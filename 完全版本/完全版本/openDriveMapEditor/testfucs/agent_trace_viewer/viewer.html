      if (exactMatches.length !== 1) {
        throw new Error("写入 DSL 后无法唯一关联子任务，请刷新后人工选择");
      }
      return exactMatches[0].dsl_answer_id;
    }

    async function ensureToolAnswerApproved(result) {
      const answer = result?.answer;
      if (!answer?.tool_answer_id) {
        throw new Error("工具答案响应缺少 tool_answer_id");
      }
      if (answer.review_status === "approved") return result;
      return requestDatabaseApi(`/api/tool-call-answers/${answer.tool_answer_id}`, {
        method: "PATCH",
        body: JSON.stringify({ review_status: "approved" })
      });
    }

    function buildToolAnswerPayload(task, step, agent) {
      return {
        tool_calls: traceToolCalls(step.tool_call_json, true),
        resolved_result: traceResolvedResult(step, task, agent),
        internal_commands: traceInternalCommands(step.internal_command),
        random_seed: null,
        metadata: {
          run_id: task.run_id || "",
          task_id: task.task_id || "",
          step_id: step.step_id || "",
          trace_source: state.sourceName || "",
          recorded_at: new Date().toISOString()
        }
      };
    }

    function traceToolCalls(value, requireValid = false) {
      const parsed = parseMaybeJson(value);
      if (!Array.isArray(parsed)) {
        if (requireValid) throw new Error("tool_call_json 必须是工具调用数组");
        return [{ name: "__invalid__", args: { raw: value } }];
      }
      return parsed.map((call, index) => {
        const valid = call && typeof call === "object"
          && typeof call.name === "string"
          && call.args && typeof call.args === "object"
          && !Array.isArray(call.args);
        if (!valid) {
          if (requireValid) throw new Error(`第 ${index + 1} 个工具调用缺少有效的 name 或 args`);
          return { name: "__invalid__", args: { raw: call } };
        }
        return { name: call.name, args: call.args };
      });
    }

    function traceResolvedResult(step, task, agent) {
      const recorded = parseMaybeJson(step.resolved_result_json);
      if (recorded !== null) return recorded;
      if (agent !== "curve") return null;
      const metric = task.metrics.find((item) => (
        String(item.step_id || "") === String(step.step_id || "")
        && String(item.operation || "").toLowerCase() === "curve"
        && (
          !step.single_review_road_id
          || normalizeSingleRoadId(item.road_id) === normalizeSingleRoadId(step.single_review_road_id)
        )
      ));
      const points = getCurveAfterPoints(parseMaybeJson(metric?.after_json));
      return points ? { optimized_control_points: points } : null;
    }

    function traceInternalCommands(value) {
      const values = Array.isArray(value) ? value : [value];
      return values
        .flatMap((command) => String(command || "").split(/\r?\n/))
        .map((command) => command.trim())
        .filter(Boolean);
    }

    function normalizeCommandValue(value, parameterKey = "", roundCommandValue = true) {
      const text = String(value || "").trim();
      if (/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[-+]?\d+)?$/i.test(text)) {
        const number = Number(text);
        if (!Number.isFinite(number)) return text;
        const normalized = parameterKey === "v" && roundCommandValue
          ? Number(number.toFixed(3))
          : number;
        return String(Object.is(normalized, -0) ? 0 : normalized);
      }
      return text;
    }

    function canonicalizeInternalCommand(
      command,
      ignoredParameterKeys = new Set(),
      roundCommandValue = true,
      roadContext = null
    ) {
      const tokens = String(command || "").trim().split(/\s+/).filter(Boolean);
      if (!tokens.length) return "";
      const name = tokens.shift().toLowerCase();
      const parameters = tokens.map((token) => {
        const separator = token.indexOf("=");
        if (separator <= 0) return { key: "", value: token };
        const key = token.slice(0, separator).toLowerCase();
        const rawValue = normalizeCommandValue(
          token.slice(separator + 1),
          key,
          roundCommandValue
        );
        return {
          key,
          value: roadContext && key === "id"
            ? normalizeToolRoadIdValue(rawValue, roadContext)
            : rawValue
        };
      }).filter((parameter) => !ignoredParameterKeys.has(parameter.key))
        .sort((left, right) => (
          left.key.localeCompare(right.key)
          || left.value.localeCompare(right.value)
        ));
      return stableJson({ name, parameters });
    }

    function randomFormulaCommandIndexes(toolCallJson) {
      const calls = traceToolCalls(toolCallJson);
      const items = calls.flatMap((call) => (
        Array.isArray(call.args?.items) ? call.args.items : []
      ));
      return new Set(items.flatMap((item, index) => (
        typeof item?.formula === "string" && /\brandom\s*\(/i.test(item.formula)
          ? [index]
          : []
      )));
    }

    function commandParameterNumber(command, parameterKey) {
      const prefix = `${String(parameterKey || "").toLowerCase()}=`;
      const token = String(command || "").trim().split(/\s+/).find((item) => (
        item.toLowerCase().startsWith(prefix)
      ));
      if (!token) return null;
      const value = Number(token.slice(token.indexOf("=") + 1));
      return Number.isFinite(value) ? Number(value.toFixed(3)) : null;
    }

    function randomCommandValuesCompatible(actualCommand, referenceCommand) {
      const actualValue = commandParameterNumber(actualCommand, "v");
      const referenceValue = commandParameterNumber(referenceCommand, "v");
      if (actualValue === null || referenceValue === null) return false;
      if (actualValue === 0 || referenceValue === 0) {
        return actualValue === referenceValue;
      }
      if (Math.sign(actualValue) !== Math.sign(referenceValue)) return false;
      const ratio = Math.max(Math.abs(actualValue), Math.abs(referenceValue))
        / Math.min(Math.abs(actualValue), Math.abs(referenceValue));
      return ratio < 2;
    }

    function compareInternalReferenceCommands(
      internalCommand,
      referenceCommand,
      toolCallJson = null
    ) {
      const actual = traceInternalCommands(internalCommand);
      const reference = traceInternalCommands(referenceCommand);
      if (!actual.length || !reference.length) {
        return {
          decision: "question",
          label: "初步判断：缺少命令，无法比较",
          actual,
          reference
        };
      }
      const randomIndexes = randomFormulaCommandIndexes(toolCallJson);
      const matches = actual.length === reference.length
        && actual.every((command, index) => {
          if (!randomIndexes.has(index)) {
            return canonicalizeInternalCommand(command)
              === canonicalizeInternalCommand(reference[index]);
          }
          const ignoredKeys = new Set(["v"]);
          return canonicalizeInternalCommand(command, ignoredKeys)
            === canonicalizeInternalCommand(reference[index], ignoredKeys)
            && randomCommandValuesCompatible(command, reference[index]);
        });
      return {
        decision: matches ? "pass" : "fail",
        label: matches
          ? randomIndexes.size
            ? "初步判断：命令一致（随机值）"
            : "初步判断：命令一致"
          : "初步判断：命令不一致",
        actual,
        reference
      };
    }

    function formatCommandForDisplay(command) {
      return String(command || "").replace(
        /(^|\s)v=([-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[-+]?\d+)?)(?=\s|$)/gi,
        (match, prefix, value) => `${prefix}v=${Number(value).toFixed(3)}`
      );
    }

    function markToolResultNumbers(value, forceThreeDecimals = false) {
      if (typeof value === "number" && Number.isFinite(value)) {
        return forceThreeDecimals
          ? { __viewerFixedThreeDecimalNumber__: value.toFixed(3) }
          : value;
      }
      if (Array.isArray(value)) {
        return value.map((item) => markToolResultNumbers(item, forceThreeDecimals));
      }
      if (!value || typeof value !== "object") return value;
      return Object.entries(value).reduce((result, [key, child]) => {
        if (key === "internal_commands" && Array.isArray(child)) {
          result[key] = child.map(formatCommandForDisplay);
        } else if (key === "v" && typeof child === "number" && Number.isFinite(child)) {
          result[key] = { __viewerFixedThreeDecimalNumber__: child.toFixed(3) };
        } else {
          result[key] = markToolResultNumbers(
            child,
            forceThreeDecimals || key === "optimized_control_points"
          );
        }
        return result;
      }, {});
    }

    function formatToolEvidence(value) {
      const fixedValues = [];
      const marked = markToolResultNumbers(value);
      const result = JSON.stringify(marked, (key, child) => {
        if (
          child
          && typeof child === "object"
          && Object.keys(child).length === 1
          && Object.prototype.hasOwnProperty.call(child, "__viewerFixedThreeDecimalNumber__")
        ) {
          const token = `__VIEWER_FIXED_THREE_DECIMAL_${fixedValues.length}__`;
          fixedValues.push(child.__viewerFixedThreeDecimalNumber__);
          return token;
        }
        return child;
      }, 2);
      return fixedValues.reduce(
        (text, fixed, index) => text.replace(
          `"__VIEWER_FIXED_THREE_DECIMAL_${index}__"`,
          fixed
        ),
        result
      );
    }

    function formatHandlerExecutionResult(value) {
      const parsed = parseMaybeJson(value);
      if (parsed === null) return formatCommandForDisplay(value);
      const formatStrings = (item) => {
        if (typeof item === "string") return formatCommandForDisplay(item);
        if (Array.isArray(item)) return item.map(formatStrings);
        if (!item || typeof item !== "object") return item;
        return Object.fromEntries(
          Object.entries(item).map(([key, child]) => [key, formatStrings(child)])
        );
      };
      return JSON.stringify(formatStrings(parsed), null, 2);
    }

    function formatResolvedEvidence(step, task) {
      const agent = normalizeStepAgent(step.agent || step.operation);
      const resolved = traceResolvedResult(step, task, agent);
      const commands = traceInternalCommands(step.internal_command).map(formatCommandForDisplay);
      return formatToolEvidence({ resolved_result: resolved, internal_commands: commands });
    }

    function dslAnswersEqual(left, right, roadContext = null) {
      return normalizeAnswerForCompare(left, roadContext)
        === normalizeAnswerForCompare(right, roadContext);
    }

    function stableJson(value) {
      const parsed = typeof value === "string" ? parseMaybeJson(value) : value;
      return JSON.stringify(sortJsonValue(parsed));
    }

    function sortJsonValue(value) {
      if (Array.isArray(value)) return value.map(sortJsonValue);
      if (!value || typeof value !== "object") return value;
      return Object.keys(value).sort().reduce((result, key) => {
        result[key] = sortJsonValue(value[key]);
        return result;
      }, {});
    }

    function normalizeRoadFieldsForCompare(value, roadContext = null) {
      const parsed = typeof value === "string" ? parseMaybeJson(value) : value;
      if (!roadContext?.enabled) return parsed;
      if (Array.isArray(parsed)) {
        return parsed.map((item) => normalizeRoadFieldsForCompare(item, roadContext));
      }
      if (!parsed || typeof parsed !== "object") return parsed;
      return Object.entries(parsed).reduce((result, [key, child]) => {
        result[key] = (key === "road_id" || key === "id")
          && (typeof child === "string" || typeof child === "number")
          ? roadIdComparisonKey(child, roadContext)
          : normalizeRoadFieldsForCompare(child, roadContext);
        return result;
      }, {});
    }

    function normalizeToolCallsForCompare(calls, agent, roadContext = null) {
      const normalized = traceToolCalls(calls).map((call) => {
        const args = sortJsonValue(call.args);
        if ((agent === "width" || agent === "slope") && Array.isArray(args.items)) {
          args.items = args.items
            .map((item) => ({
              ...item,
              ...(item.id !== undefined && roadContext?.enabled
                ? { id: normalizeToolRoadIdValue(item.id, roadContext) }
                : {}),
              formula: typeof item.formula === "string"
                ? normalizeToolFormulaForCompare(item.formula)
                : item.formula
            }))
            .sort((left, right) => (
              num(left.operation_index) - num(right.operation_index)
              || stableJson(left).localeCompare(stableJson(right))
            ));
        }
        if (args.road_id !== undefined && (agent === "curve" || roadContext?.enabled)) {
          args.road_id = normalizeToolRoadIdValue(args.road_id, roadContext);
        }
        if (agent === "curve") {
          if (args.gi !== undefined && String(args.gi).trim() !== "" && Number.isFinite(Number(args.gi))) {
            args.gi = Number(args.gi);
          }
          if (typeof args.side === "string") args.side = args.side.trim().toLowerCase();
        }
        return { name: call.name, args: sortJsonValue(args) };
      });
      if (agent === "curve") {
        normalized.sort((left, right) => (
          curveToolSortKey(left).localeCompare(curveToolSortKey(right))
          || stableJson(left).localeCompare(stableJson(right))
        ));
      }
      return normalized;
    }

    function normalizeToolFormulaForCompare(formula) {
      const normalized = String(formula || "").replace(/\s+/g, "").replace(
        /(^|[^A-Za-z0-9_])((?:\d+(?:\.\d*)?|\.\d+)(?:e[-+]?\d+)?)/gi,
        (match, prefix, numericText) => {
          const value = Number(numericText);
          return Number.isFinite(value) ? `${prefix}${value}` : match;
        }
      );
      if (normalized.length > 500) return normalized;
      const tokens = normalized.match(/(?:\d+(?:\.\d*)?|\.\d+)(?:e[-+]?\d+)?|[A-Za-z_][A-Za-z0-9_]*|\*\*|[()+*/,\-]/gi) || [];
      if (tokens.join("") !== normalized || tokens.length > 200) return normalized;
      const functions = new Set(["abs", "min", "max", "tan", "radians", "degrees", "sign", "random"]);
      const precedence = { "+": 1, "-": 1, "*": 2, "/": 2, "**": 4 };
      let index = 0;
      const consume = (expected) => {
        if (tokens[index++] !== expected) throw new Error("Unexpected formula token");
      };
      const parsePrimary = () => {
        const token = tokens[index++];
        if (token === "+" || token === "-") {
          return { operator: token, args: [parseExpression(3)] };
        }
        if (token === "(") {
          const node = parseExpression();
          consume(")");
          return node;
        }
        if (/^[\d.]/.test(token || "") && Number.isFinite(Number(token))) return String(Number(token));
        if (!functions.has(token)) throw new Error("Unsupported formula token");
        consume("(");
        const args = [parseExpression()];
        while (tokens[index] === ",") {
          index += 1;
          args.push(parseExpression());
        }
        consume(")");
        return { name: token, args };
      };
      const parseExpression = (minimum = 1) => {
        let node = parsePrimary();
        while (Object.hasOwn(precedence, tokens[index]) && precedence[tokens[index]] >= minimum) {
          const operator = tokens[index++];
          const right = parseExpression(precedence[operator] + (operator === "**" ? 0 : 1));
          const args = [node, right];
          node = {
            operator,
            args: operator === "+" ? args.flatMap((child) => (
              child.operator === "+" && child.args.length > 1 ? child.args : [child]
            )) : args
          };
        }
        return node;
      };
      // Constant-only arithmetic is compared by value. Random plans remain
      // structural: never sample random or execute arbitrary formula text.
      const constantValue = (node) => {
        if (typeof node === "string") return Number(node);
        const args = node.args.map(constantValue);
        if (args.some((value) => !Number.isFinite(value))) throw new Error("Nonfinite formula");
        if (node.name) {
          if (node.name === "random") throw new Error("Keep random formula structural");
          const unary = { abs: Math.abs, tan: Math.tan, radians: (x) => x * Math.PI / 180,
            degrees: (x) => x * 180 / Math.PI, sign: Math.sign };
          if (node.name === "min") return Math.min(...args);
          if (node.name === "max") return Math.max(...args);
          if (unary[node.name] && args.length === 1) return unary[node.name](args[0]);
          throw new Error("Invalid function arguments");
        }
        if (args.length === 1) return node.operator === "-" ? -args[0] : args[0];
        if (node.operator === "+") return args.reduce((a, b) => a + b, 0);
        if (node.operator === "-") return args[0] - args[1];
        if (node.operator === "*") return args[0] * args[1];
        if (node.operator === "/" && args[1] !== 0) return args[0] / args[1];
        if (node.operator === "**" && Math.abs(args[1]) <= 10) return args[0] ** args[1];
        throw new Error("Unsupported arithmetic");
      };
      const serialize = (node) => {
        if (typeof node === "string") return node;
        const serializeProduct = (product, initialSign = 1) => {
          let coefficient = initialSign;
          const factors = [];
          const collect = (factor) => {
            if (typeof factor === "string") {
              coefficient *= Number(factor);
              return;
            }
            if (factor.operator === "*" && factor.args.length === 2) {
              collect(factor.args[0]);
              collect(factor.args[1]);
              return;
            }
            if ((factor.operator === "+" || factor.operator === "-") && factor.args.length === 1) {
              if (factor.operator === "-") coefficient *= -1;
              collect(factor.args[0]);
              return;
            }
            factors.push(serialize(factor));
          };
          collect(product);
          factors.sort();
          const normalizedCoefficient = Number(coefficient.toPrecision(12));
          if (normalizedCoefficient !== 1 || !factors.length) {
            factors.unshift(String(normalizedCoefficient));
          }
          return `mul(${factors.join(",")})`;
        };
        if (node.operator === "*" && node.args.length === 2) {
          return serializeProduct(node);
        }
        const args = node.args.map(serialize);
        if (node.name) return `${node.name}(${args.join(",")})`;
        if (args.length === 1 && node.operator === "-" && node.args[0]?.operator === "*") {
          return serializeProduct(node.args[0], -1);
        }
        if (args.length === 1) return `(${node.operator}${args[0]})`;
        if (node.operator === "+") args.sort();
        return `(${args.join(node.operator)})`;
      };
      try {
        const expression = parseExpression();
        if (index !== tokens.length) return normalized;
        if (!tokens.includes("random")) {
          try {
            const value = constantValue(expression);
            if (Number.isFinite(value)) return `constant:${Number(value.toPrecision(12))}`;
          } catch (error) { /* Invalid formulas retain their structure for mismatch detection. */ }
        }
        return serialize(expression);
      } catch (error) {
        return normalized;
      }
    }

    function normalizeToolInternalCommandsForCompare(commands, roadContext = null) {
      return traceInternalCommands(commands).map((command) => {
        const normalized = JSON.parse(
          canonicalizeInternalCommand(command, new Set(), false, roadContext)
        );
        return [
          normalized.name,
          ...normalized.parameters.map((parameter) => (
            parameter.key ? `${parameter.key}=${parameter.value}` : parameter.value
          ))
        ].filter(Boolean).join(" ");
      });
    }

    function curveToolSortKey(call) {
      const args = call.args || {};
      return [call.name, args.side || "", args.road_id || "", args.gi ?? ""].join("|");
    }

    function containsRandomFormula(value) {
      if (typeof value === "string") return /random\s*\(/i.test(value);
      if (Array.isArray(value)) return value.some(containsRandomFormula);
      if (value && typeof value === "object") return Object.values(value).some(containsRandomFormula);
      return false;
    }

    function compareToolAnswer(step, task, agent, answer, roadContext = null) {
      const actualCalls = normalizeToolCallsForCompare(step.tool_call_json, agent, roadContext);
      const expectedCalls = normalizeToolCallsForCompare(answer.tool_calls, agent, roadContext);
      const toolPlanMatches = JSON.stringify(actualCalls) === JSON.stringify(expectedCalls);
      const hasRandom = containsRandomFormula(actualCalls) || containsRandomFormula(expectedCalls);
      let resolvedMatches = true;
      let commandMatches = true;
      if ((agent === "width" || agent === "slope") && !hasRandom) {
        if (answer.resolved_result !== null && answer.resolved_result !== undefined) {
          resolvedMatches = stableJson(
            normalizeRoadFieldsForCompare(traceResolvedResult(step, task, agent), roadContext)
          ) === stableJson(
            normalizeRoadFieldsForCompare(answer.resolved_result, roadContext)
          );
        }
        if (answer.internal_commands !== null && answer.internal_commands !== undefined) {
          commandMatches = stableJson(
            normalizeToolInternalCommandsForCompare(step.internal_command, roadContext)
          ) === stableJson(
            normalizeToolInternalCommandsForCompare(answer.internal_commands, roadContext)
          );
        }
      }
      const matches = toolPlanMatches && resolvedMatches && commandMatches;
      const parts = [toolPlanMatches ? "工具计划匹配" : "工具计划不匹配"];
      if (hasRandom) parts.push("随机解析值不严格比较");
      else if (agent === "width" || agent === "slope") {
        if (!resolvedMatches) parts.push("解析结果不匹配");
        if (!commandMatches) parts.push("内部命令不匹配");
      }
      return {
        matches,
        toolPlanMatches,
        resolvedMatches,
        commandMatches,
        hasRandom,
        summary: parts.join("；")
      };
    }

    function findClosestToolAnswer(step, task, agent, answers, roadContext = null) {
      return (answers || []).reduce((closest, answer) => {
        const score = toolAnswerDifferenceScore(step, task, agent, answer, roadContext);
        if (!closest || score < closest.score) return { answer, score };
        if (score > closest.score) return closest;
        return num(answer.variant_index) < num(closest.answer.variant_index)
          ? { answer, score }
          : closest;
      }, null)?.answer || null;
    }

    function toolAnswerDifferenceScore(step, task, agent, answer, roadContext = null) {
      const actualCalls = normalizeToolCallsForCompare(step.tool_call_json, agent, roadContext);
      const expectedCalls = normalizeToolCallsForCompare(answer.tool_calls, agent, roadContext);
      let score = jsonDifferenceScore(actualCalls, expectedCalls);
      const hasRandom = containsRandomFormula(actualCalls) || containsRandomFormula(expectedCalls);
      if ((agent === "width" || agent === "slope") && !hasRandom) {
        if (answer.resolved_result !== null && answer.resolved_result !== undefined) {
          score += jsonDifferenceScore(
            normalizeRoadFieldsForCompare(traceResolvedResult(step, task, agent), roadContext),
            normalizeRoadFieldsForCompare(answer.resolved_result, roadContext)
          );
        }
        if (answer.internal_commands !== null && answer.internal_commands !== undefined) {
          score += jsonDifferenceScore(
            normalizeToolInternalCommandsForCompare(step.internal_command, roadContext),
            normalizeToolInternalCommandsForCompare(answer.internal_commands, roadContext)
          );
        }
      }
      return score;
    }

    function jsonDifferenceScore(left, right) {
      if (JSON.stringify(sortJsonValue(left)) === JSON.stringify(sortJsonValue(right))) return 0;
      if (Array.isArray(left) && Array.isArray(right)) {
        const sharedLength = Math.min(left.length, right.length);
        let score = Math.abs(left.length - right.length);
        for (let index = 0; index < sharedLength; index += 1) {
          score += jsonDifferenceScore(left[index], right[index]);
        }
        return score;
      }
      if (left && right && typeof left === "object" && typeof right === "object") {
        const keys = unique([...Object.keys(left), ...Object.keys(right)]);
        return keys.reduce((score, key) => (
          score + (Object.hasOwn(left, key) && Object.hasOwn(right, key)
            ? jsonDifferenceScore(left[key], right[key])
            : 1)
        ), 0);
      }
      return 1;
    }

    function renderCurvePointDifference(step, task, agent, answer) {
      if (agent !== "curve" || !answer?.resolved_result?.optimized_control_points) return "";
      const actual = normalizePoints(traceResolvedResult(step, task, agent)?.optimized_control_points);
      const expected = normalizePoints(answer.resolved_result.optimized_control_points);
      if (!actual || !expected) return `<div class="subtle">控制点差值：当前 trace 缺少四个有效控制点</div>`;
      const differences = actual.map((point, index) => `P${index}: ${formatNumber(distance(point, expected[index]))}`);
      return `<div class="subtle">控制点欧氏距离（仅供审核，不决定工具计划匹配）：${escapeHtml(differences.join(" | "))}</div>`;
    }

    function getStepAnswerCompareTarget(step, agent) {
      const stepAgent = normalizeStepAgent(step?.agent || step?.operation);
      const baseOutput = prettyJson(step?.llm_output_json);
      if (!baseOutput) return { status: "empty", output: "", message: "LLM output empty" };
      if (stepAgent !== "single") return { status: "ok", output: baseOutput, message: "" };
      return singleAgentOutputForAnswerTarget(step.llm_output_json, agent);
    }

    function getAnswerCompareGroups(step, agent, entries, task = null) {
      const roadContext = buildRoadComparisonContext(
        task,
        null,
        entries.map((entry) => entry.value)
      );
      if (normalizeStepAgent(step?.agent || step?.operation) === "single") {
        return buildSingleAgentAnswerGroups(step?.llm_output_json, agent, entries, roadContext);
      }
      return [{
        scopeKey: "",
        scopeLabel: "",
        candidates: entries.map((entry, index) => ({ entry, index })),
        allowCreate: !entries.length,
        roadContext,
        ...getStepAnswerCompareTarget(step, agent)
      }];
    }

    function buildSingleAgentAnswerGroups(value, agent, entries, roadContext = null) {
      const target = singleAgentOperationsForAnswerTarget(value, agent);
      const candidates = entries.map((entry, index) => {
        const scope = getAnswerScope(entry.value);
        return {
          entry,
          index,
          scope,
          comparisonRoadIds: scope.roadIds
            .map((roadId) => roadIdComparisonKey(roadId, roadContext))
            .filter(Boolean)
        };
      });
      if (!candidates.length || candidates.some((candidate) => !candidate.scope.key)) {
        return [{
          scopeKey: "",
          scopeLabel: "",
          candidates,
          allowCreate: !entries.length,
          roadContext,
          ...singleAgentOutputForAnswerTarget(value, agent)
        }];
      }

      const grouped = new Map();
      for (const candidate of candidates) {
        const comparisonKey = candidate.comparisonRoadIds.join("|");
        if (!grouped.has(comparisonKey)) {
          grouped.set(comparisonKey, {
            scopeKey: comparisonKey,
            scopeLabel: candidate.scope.label,
            roadIds: candidate.comparisonRoadIds,
            candidates: []
          });
        }
        grouped.get(comparisonKey).candidates.push(candidate);
      }

      const outputRoadOrder = new Map();
      target.operations.forEach((operation, index) => {
        const roadId = roadIdComparisonKey(operation?.road_id, roadContext);
        if (roadId && !outputRoadOrder.has(roadId)) outputRoadOrder.set(roadId, index);
      });
      const answerGroups = [...grouped.values()]
        .map((group) => {
          const operations = target.operations.filter((operation) => (
            group.roadIds.includes(roadIdComparisonKey(operation?.road_id, roadContext))
          ));
          const status = target.status !== "ok" ? target.status : operations.length ? "ok" : "missing";
          return {
            ...group,
            status,
            output: JSON.stringify({ operations }, null, 2),
            message: status === "missing" ? `single output missing ${agent} operation for ${group.scopeLabel}` : target.message,
            allowCreate: false,
            roadContext
          };
        })
        .sort((left, right) => {
          const leftOrder = Math.min(...left.roadIds.map((roadId) => outputRoadOrder.get(roadId) ?? Number.MAX_SAFE_INTEGER));
          const rightOrder = Math.min(...right.roadIds.map((roadId) => outputRoadOrder.get(roadId) ?? Number.MAX_SAFE_INTEGER));
          return leftOrder - rightOrder;
        });

      if (target.status === "ok") {
        const coveredRoadIds = new Set(answerGroups.flatMap((group) => group.roadIds));
        const unexpected = new Map();
        for (const operation of target.operations) {
          const roadId = roadIdComparisonKey(operation?.road_id, roadContext);
          if (roadId && coveredRoadIds.has(roadId)) continue;
          const scopeKey = `unexpected:${roadId || "missing-road-id"}`;
          if (!unexpected.has(scopeKey)) {
            unexpected.set(scopeKey, {
              scopeKey,
              scopeLabel: roadId || "未标注道路",
              candidates: [],
              operations: []
            });
          }
          unexpected.get(scopeKey).operations.push(operation);
        }
        for (const group of unexpected.values()) {
          answerGroups.push({
            scopeKey: group.scopeKey,
            scopeLabel: group.scopeLabel,
            candidates: [],
            status: "unexpected",
            roadContext,
            output: JSON.stringify({ operations: group.operations }, null, 2),
            message: `LLM 输出包含未记录标准答案的 ${group.scopeLabel}`,
            allowCreate: false
          });
        }
      }
      return answerGroups;
    }

    function getAnswerScope(value) {
      const parsed = parseMaybeJson(value);
      const operations = Array.isArray(parsed?.operations) ? parsed.operations : [];
      const roadIds = [...new Set(
        operations.map((operation) => normalizeAnswerRoadId(operation?.road_id)).filter(Boolean)
      )].sort();
      return {
        key: roadIds.join("|"),
        label: roadIds.join(", "),
        roadIds
      };
    }

    function normalizeAnswerRoadId(value) {
      return String(value === undefined || value === null ? "" : value).trim().toLowerCase();
    }

    function renderAnswerCompareGroup(task, stepIndex, agent, answerColumn, group) {
      const output = group.output || "";
      const closestPosition = group.candidates.length
        ? chooseClosestAnswerEntry(
          group.candidates.map((candidate) => candidate.entry),
          output,
          group.roadContext
        )
        : 0;
      const closestCandidate = group.candidates[closestPosition] || null;
      const storedIndex = getStoredAnswerSelection(task, stepIndex, agent, group.scopeKey);
      const selectedCandidate = group.candidates.find((candidate) => candidate.index === storedIndex)
        || closestCandidate;
      const selectedPosition = selectedCandidate
        ? group.candidates.findIndex((candidate) => candidate.index === selectedCandidate.index)
        : 0;
      if (selectedCandidate) {
        setAnswerSelection(task, stepIndex, agent, selectedCandidate.index, group.scopeKey);
      }

      const current = selectedCandidate?.entry.value || "";
      const same = group.status === "ok"
        && Boolean(selectedCandidate)
        && normalizeAnswerForCompare(current, group.roadContext) === normalizeAnswerForCompare(output, group.roadContext);
      const scopeLabel = group.scopeLabel ? ` · ${group.scopeLabel}` : "";
      const compareLabel = group.status !== "ok"
        ? `，${group.message}`
        : !group.candidates.length
          ? "，未找到对应标准答案"
          : same ? "，内容一致" : "，高亮差异";
      const suffix = group.candidates.length
        ? `（第 ${selectedPosition + 1} / 共 ${group.candidates.length} 个答案${selectedCandidate?.index === closestCandidate?.index ? "，差异最小" : ""}${compareLabel}）`
        : `（共 0 个答案${compareLabel}）`;
      const titleText = `${answerColumn}${scopeLabel} 当前内容${suffix}`;
      const switcher = renderAnswerSwitcher(
        task,
        stepIndex,
        agent,
        group.scopeKey,
        selectedCandidate?.index ?? 0,
        group.candidates
      );
      const editable = Boolean(selectedCandidate) || group.allowCreate;
      const editableClass = editable ? " answer-value-editable inline-editable" : "";
      const editableAttrs = editable
        ? ` data-agent="${escapeAttr(agent)}" data-step-index="${stepIndex}" data-scope-key="${escapeAttr(group.scopeKey)}"${selectedCandidate ? ` data-entry-index="${selectedCandidate.index}"` : ""} title="点击编辑当前 answer"`
        : "";
      const targetMessage = group.status === "ok"
        ? ""
        : `<span class="answer-error">${escapeHtml(group.message)}</span>\n`;
      const content = group.candidates.length || group.allowCreate
        ? targetMessage + renderAnswerCurrentContent(current, output, group.roadContext)
        : targetMessage;
      return `
        <div class="answer-current-item">
          <div class="answer-current-title"><span>${escapeHtml(titleText)}</span>${switcher}</div>
          <div class="answer-current-content${editableClass}" role="status"${editableAttrs}>${content}</div>
        </div>
      `;
    }

    function renderAnswerCurrentContent(currentValue, llmOutput, roadContext = null) {
      const current = String(currentValue || "");
      const same = normalizeAnswerForCompare(current, roadContext) === normalizeAnswerForCompare(llmOutput, roadContext);
      if (current) return same ? escapeHtml(prettyJson(current)) : highlightAnswerDifference(current, llmOutput, roadContext);
      return same ? "\u7a7a" : `<span class="answer-diff">\u7a7a</span>`;
    }

    function renderAnswerSwitcher(task, stepIndex, agent, scopeKey, selectedIndex, candidates) {
      if (candidates.length <= 1) return "";
      const options = candidates.map((candidate, index) => (
        `<option value="${candidate.index}" ${candidate.index === selectedIndex ? "selected" : ""}>答案 ${index + 1} / ${candidates.length}</option>`
      )).join("");
      return `
        <select class="answer-switcher" data-task-id="${escapeAttr(task.task_id)}" data-step-index="${stepIndex}" data-agent="${escapeAttr(agent)}" data-scope-key="${escapeAttr(scopeKey)}" aria-label="切换 ${escapeAttr(agent)} answer">
          ${options}
        </select>
      `;
    }

    function parseAnswerEntries(value) {
      if (value === undefined || value === null || value === "") return [];
      const parsed = parseMaybeJson(value);
      if (Array.isArray(parsed) && parsed.every((item) => item && typeof item === "object" && "value" in item)) {
        return parsed
          .map((item) => ({ ...item, value: answerEntryValueToText(item.value) }))
          .filter((item) => item.value !== "");
      }
      return [{ value: answerEntryValueToText(value), created_at: "", mode: "legacy" }];
    }

    function serializeAnswerEntries(entries) {
      const normalized = entries
        .map((entry) => {
          const valueText = answerEntryValueToText(entry.value);
          return { ...entry, value: answerEntryValueToStoredValue(valueText) };
        })
        .filter((entry) => answerEntryValueToText(entry.value) !== "");
      if (!normalized.length) return "";
      return JSON.stringify(normalized, null, 2);
    }

    function answerEntryValueToText(value) {
      if (value === undefined || value === null || value === "") return "";
      if (typeof value === "object") return JSON.stringify(value, null, 2);
      return String(value);
    }

    function answerEntryValueToStoredValue(value) {
      const text = answerEntryValueToText(value);
      const parsed = parseMaybeJson(text);
      return parsed && typeof parsed === "object" ? parsed : text;
    }

    function makeAnswerEntry(value, mode) {
      return {
        value: String(value || ""),
        created_at: new Date().toISOString(),
        mode
      };
    }

    function chooseClosestAnswerEntry(entries, llmOutput, roadContext = null) {
      if (!entries.length) return 0;
      let bestIndex = 0;
      let bestScore = Infinity;
      for (let index = 0; index < entries.length; index += 1) {
        const score = answerDifferenceScore(entries[index].value, llmOutput, roadContext);
        if (score < bestScore) {
          bestScore = score;
          bestIndex = index;
        }
      }
      return bestIndex;
    }

    function answerDifferenceScore(currentValue, targetValue, roadContext = null) {
      const current = normalizeAnswerForCompare(currentValue, roadContext);
      const target = normalizeAnswerForCompare(targetValue, roadContext);
      if (current === target) return 0;
      let prefix = 0;
      while (prefix < current.length && prefix < target.length && current[prefix] === target[prefix]) prefix += 1;
      let suffix = 0;
      while (
        suffix < current.length - prefix
        && suffix < target.length - prefix
        && current[current.length - 1 - suffix] === target[target.length - 1 - suffix]
      ) {
        suffix += 1;
      }
      return (current.length - prefix - suffix) + (target.length - prefix - suffix);
    }

    function answerSelectionKey(task, stepIndex, agent, scopeKey = "") {
      return `${task.run_id || "run"}:${task.task_id}:${stepIndex}:${agent}:${scopeKey}`;
    }

    function getStoredAnswerSelection(task, stepIndex, agent, scopeKey = "") {
      if (stepIndex === undefined || Number.isNaN(Number(stepIndex))) return null;
      const value = state.answerSelectionByKey.get(answerSelectionKey(task, Number(stepIndex), agent, scopeKey));
      return Number.isInteger(value) ? value : null;
    }

    function setAnswerSelection(task, stepIndex, agent, index, scopeKey = "") {
      if (stepIndex === undefined || Number.isNaN(Number(stepIndex))) return;
      state.answerSelectionByKey.set(answerSelectionKey(task, Number(stepIndex), agent, scopeKey), index);
    }

    function clearAnswerSelection(task, stepIndex, agent, scopeKey = "") {
      if (stepIndex === undefined || Number.isNaN(Number(stepIndex))) return;
      state.answerSelectionByKey.delete(answerSelectionKey(task, Number(stepIndex), agent, scopeKey));
    }

    function clampAnswerIndex(index, count) {
      if (!count) return 0;
      if (!Number.isInteger(index)) return 0;
      return Math.min(Math.max(index, 0), count - 1);
    }

    function normalizeAnswerForCompare(value, roadContext = null) {
      const parsed = parseMaybeJson(value);
      if (parsed === null) return String(value || "").replace(/\s+/g, "");
      return JSON.stringify(canonicalizeAnswerJson(parsed, 0, "", roadContext));
    }

    function canonicalizeAnswerJson(value, depth = 0, key = "", roadContext = null) {
      if (
        roadContext?.enabled
        && (key === "road_id" || key === "id")
        && (typeof value === "string" || typeof value === "number")
      ) {
        return roadIdComparisonKey(value, roadContext);
      }
      if (Array.isArray(value)) {
        const items = value.map((item) => canonicalizeAnswerJson(item, depth + 1, "", roadContext));
        if (depth === 1 && key === "operations") {
          items.sort((left, right) => {
            const leftKey = JSON.stringify(left);
            const rightKey = JSON.stringify(right);
            return leftKey < rightKey ? -1 : leftKey > rightKey ? 1 : 0;
          });
        }
        return items;
      }
      if (!value || typeof value !== "object") return value;
      const normalized = {};
      for (const childKey of Object.keys(value).sort()) {
        normalized[childKey] = canonicalizeAnswerJson(value[childKey], depth + 1, childKey, roadContext);
      }
      return normalized;
    }

    function highlightAnswerDifference(currentValue, targetValue, roadContext = null) {
      const current = String(currentValue || "");
      const currentJson = parseMaybeJson(current);
      const targetJson = parseMaybeJson(targetValue);
      if (currentJson !== null && targetJson !== null) {
        return highlightJsonLineDifferences(currentJson, targetJson, roadContext);
      }
      const range = findAnswerDiffRange(current, String(targetValue || ""), roadContext);
      if (!range) return escapeHtml(current);
      const [start, end] = range;
      return [
        escapeHtml(current.slice(0, start)),
        `<span class="answer-diff">${escapeHtml(current.slice(start, end) || "?")}</span>`,
        escapeHtml(current.slice(end))
      ].join("");
    }

    function highlightJsonLineDifferences(currentValue, targetValue, roadContext = null) {
      const currentLines = JSON.stringify(currentValue, null, 2).split("\n");
      const comparableCurrentLines = JSON.stringify(
        canonicalizeAnswerJson(currentValue, 0, "", roadContext),
        null,
        2
      ).split("\n");
      const comparableTargetLines = JSON.stringify(
        canonicalizeAnswerJson(targetValue, 0, "", roadContext),
        null,
        2
      ).split("\n");
      const matched = matchedJsonLineIndexes(comparableCurrentLines, comparableTargetLines);
      return currentLines
        .map((line, index) => matched.has(index) ? escapeHtml(line) : `<span class="answer-diff">${escapeHtml(line)}</span>`)
        .join("\n");
    }

    function matchedJsonLineIndexes(currentLines, targetLines) {
      const rows = currentLines.length + 1;
      const cols = targetLines.length + 1;
      const dp = Array.from({ length: rows }, () => Array(cols).fill(0));
      for (let i = currentLines.length - 1; i >= 0; i -= 1) {
        for (let j = targetLines.length - 1; j >= 0; j -= 1) {
          dp[i][j] = currentLines[i] === targetLines[j]
            ? dp[i + 1][j + 1] + 1
            : Math.max(dp[i + 1][j], dp[i][j + 1]);
        }
      }
      const matched = new Set();
      let i = 0;
      let j = 0;
      while (i < currentLines.length && j < targetLines.length) {
        if (currentLines[i] === targetLines[j]) {
          matched.add(i);
          i += 1;
          j += 1;
        } else if (dp[i + 1][j] >= dp[i][j + 1]) {
          i += 1;
        } else {
          j += 1;
        }
      }
      return matched;
    }

    function findAnswerDiffRange(currentValue, targetValue, roadContext = null) {
      const currentChars = [];
      const currentIndexes = [];
      for (let index = 0; index < currentValue.length; index += 1) {
        const char = currentValue[index];
        if (/\s/.test(char)) continue;
        currentChars.push(char);
        currentIndexes.push(index);
      }
      const target = normalizeAnswerForCompare(targetValue, roadContext);
      const current = currentChars.join("");
      if (current === target) return null;
      if (!currentIndexes.length) return [0, currentValue.length];

      let prefix = 0;
      while (prefix < current.length && prefix < target.length && current[prefix] === target[prefix]) prefix += 1;
      let suffix = 0;
      while (
        suffix < current.length - prefix &&
        suffix < target.length - prefix &&
        current[current.length - 1 - suffix] === target[target.length - 1 - suffix]
      ) {
        suffix += 1;
      }
      const start = currentIndexes[Math.min(prefix, currentIndexes.length - 1)];
      const endNormIndex = Math.max(prefix, current.length - suffix - 1);
      const end = currentIndexes[Math.min(endNormIndex, currentIndexes.length - 1)] + 1;
      return [start, Math.max(start + 1, end)];
    }

    function renderTaskError(task) {
      if (!task.error) return "";
      return `
        <div class="error-box">
          <strong>错误来源：${escapeHtml(inferTaskErrorSource(task.error))}</strong>
          <pre>${escapeHtml(task.error)}</pre>
        </div>
      `;
    }

    function inferTaskErrorSource(error) {
      const text = String(error || "").toLowerCase();
      if (text.includes("dsl check failed")) return "DSL 检查";
      if (text.includes("permission denied") || text.includes("errno 13") || text.includes(".xlsx")) return "Trace 文件写入";
      if (text.includes("road id extraction failed")) return "Road ID 提取";
      if (text.includes("projected road metric failed")) return "DSL->内部命令解析";
      return "任务异常";
    }

    function renderMissingAgents(task) {
      const missing = task.agents.filter((agent) => !agent.recorded).map((agent) => agent.name);
      if (!missing.length) return "";
      return `<div class="missing">以下类型只从 manager 输出或任务文本推断，当前 trace 未记录对应修改数据：${missing.join(", ")}</div>`;
    }

    function renderTaskDurationChip(task) {
      const duration = getTaskDurationMs(task);
      return duration === null ? "" : `<span class="chip">总耗时 ${formatDuration(duration)}</span>`;
    }

    function renderRequestTimings(task) {
      const requests = task.llmRequests || [];
      const taskDuration = getTaskDurationMs(task);
      const requestDuration = requests.reduce((sum, request) => {
        const value = Number(request.duration_ms);
        return sum + (Number.isFinite(value) ? value : 0);
      }, 0);
      const summary = `
        <div class="head-meta request-timing-summary">
          <span class="chip">任务总耗时 ${taskDuration === null ? "未记录" : formatDuration(taskDuration)}</span>
          <span class="chip" title="并发请求的累计耗时可能大于任务总耗时">请求累计 ${formatDuration(requestDuration)}</span>
        </div>`;
      if (!requests.length) return summary + `<div class="missing">表格未记录 llm_requests</div>`;
      return summary + `
        <div class="table-wrap">
          <table class="request-timing-table">
            <thead>
              <tr>
                <th>请求阶段</th>
                <th>Agent</th>
                <th>Step</th>
                <th>Attempt</th>
                <th>模型</th>
                <th>开始时间</th>
                <th class="num">耗时</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody>
              ${requests.map((request) => `
                <tr>
                  <td>${escapeHtml(formatRequestKind(request))}</td>
                  <td>${escapeHtml(request.agent || request.operation || "")}</td>
                  <td>${escapeHtml(request.step_id ?? "")}</td>
                  <td>${escapeHtml(request.attempt ?? "")}</td>
                  <td>${escapeHtml(request.model_name || "未记录")}</td>
                  <td>${escapeHtml(formatRequestTime(request.started_at))}</td>
                  <td class="num">${escapeHtml(formatDuration(request.duration_ms))}</td>
                  <td>
                    ${statusChip(request.status || "")}
                    ${request.error ? `<div class="answer-error">${escapeHtml(request.error)}</div>` : ""}
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>`;
    }

    function getTaskDurationMs(task) {
      const recordedValue = task?.duration_ms;
      const recorded = Number(recordedValue);
      if (recordedValue !== "" && recordedValue !== null && recordedValue !== undefined
          && Number.isFinite(recorded) && recorded >= 0) return recorded;
      const started = Date.parse(task?.started_at || "");
      const finished = Date.parse(task?.finished_at || "");
      return Number.isFinite(started) && Number.isFinite(finished) && finished >= started
        ? finished - started
        : null;
    }

    function formatDuration(value) {
      const milliseconds = Number(value);
      if (!Number.isFinite(milliseconds) || milliseconds < 0) return "未记录";
      if (milliseconds < 1000) return `${milliseconds.toFixed(milliseconds < 10 ? 1 : 0)} ms`;
      if (milliseconds < 60000) return `${(milliseconds / 1000).toFixed(2)} s`;
      const minutes = Math.floor(milliseconds / 60000);
      return `${minutes} min ${((milliseconds % 60000) / 1000).toFixed(1)} s`;
    }

    function formatRequestKind(request) {
      const kind = String(request.request_kind || "");
      const label = REQUEST_KIND_LABELS[kind] || kind || "LLM 请求";
      const index = Number(request.request_index);
      return Number.isFinite(index) && index > 1 ? `${label} #${index}` : label;
    }

    function formatRequestTime(value) {
      return value ? String(value).replace("T", " ") : "未记录";
    }

    function renderSteps(steps, dslChecks = [], task = null) {
      if (!steps.length) return `<div class="missing">表格未记录 agent_steps</div>`;
      return `<div class="timeline">${steps.map((step, index) => `
        <article class="step">
          <div class="step-summary">
            <div class="step-meta">
              <code>step ${escapeHtml(step.step_id || "")}</code>
              ${agentChip(String(step.agent || step.operation || ""), true)}
              ${step.status ? statusChip(step.status) : ""}
            </div>
            <div class="field-grid">
              ${renderStepFields(step, task, index)}
            </div>
            ${renderStepDslChecks(step, dslChecks)}
            ${step.error ? `<div class="error-box">${escapeHtml(step.error)}</div>` : ""}
          </div>
        </article>
      `).join("")}</div>`;
    }

    function renderStepFields(step, task, stepIndex) {
      const agent = normalizeStepAgent(step.agent || step.operation);
      if (agent === "manager") {
        return stepFieldBlock("输入", step.input_text, "", { editableInput: true, stepIndex })
          + stepFieldBlock("LLM 输出", prettyJson(step.llm_output_json));
      }
      if (agent === "road_alignment") {
        const alignment = parseMaybeJson(step.road_context_json) || {};
        return [
          stepFieldBlock("原始输入", alignment.original_input || ""),
          stepFieldBlock("匹配后输入", step.input_text || alignment.test_input || ""),
          stepFieldBlock("实际道路", alignment.road_id || "")
        ].join("");
      }
      return [
        stepFieldBlock("输入", step.input_text, "", { editableInput: agent === "single", stepIndex }),
        stepFieldBlock("道路上下文", prettyJson(step.road_context_json)),
        stepFieldBlock("Road id 输出", prettyJson(step.road_id_output_json)),
        renderLlmOutputField(step, task, stepIndex),
        renderToolReviewField(step, task, stepIndex),
        renderHandlerResultField(step, task)
      ].join("");
    }

    function renderHandlerResultField(step, task = null) {
      if (normalizeStepAgent(step.agent || step.operation) === "single") {
        const targets = singleAgentReviewTargets(step, task);
        if (targets.length) {
          return targets.map((target) => renderHandlerResultField(
            projectSingleStepForReview(step, target.agent, target.roadId),
            task
          )).join("");
        }
      }
      const comparison = compareInternalReferenceCommands(
        step.internal_command,
        step.reference_command,
        step.tool_call_json
      );
      const actual = comparison.actual.length
        ? comparison.actual.map(formatCommandForDisplay).join("\n")
        : "未记录";
      const reference = comparison.reference.length
        ? comparison.reference.map(formatCommandForDisplay).join("\n")
        : "未记录";
      const handlerResult = formatHandlerExecutionResult(step.handler_result_json) || "未记录";
      return `
        <div class="field handler-result-field">
          <div class="field-head">
            <label>Handler 结果${step.single_review_label ? ` · ${escapeHtml(step.single_review_label)}` : ""}</label>
            ${reviewChip(comparison.decision, comparison.label)}
          </div>
          <div class="handler-command-grid">
            <div class="answer-pane source-pane">
              <div class="answer-pane-title">最终内部命令</div>
              <pre>${escapeHtml(actual)}</pre>
            </div>
            <div class="answer-pane">
              <div class="answer-pane-title">旧 DSL 参考命令</div>
              <pre>${escapeHtml(reference)}</pre>
            </div>
          </div>
          <div class="handler-execution-result">
            <div class="answer-pane-title">Handler 执行回执</div>
            <pre>${escapeHtml(handlerResult)}</pre>
          </div>
        </div>
      `;
    }

    function renderToolReviewField(step, task, stepIndex) {
      const agent = normalizeStepAgent(step.agent || step.operation);
      const hasTrace = [step.tool_call_json, step.resolved_result_json, step.internal_command]
        .some((value) => value !== undefined && value !== null && value !== "");
      if (agent === "single" && hasTrace) {
        const targets = singleAgentReviewTargets(step, task);
        if (targets.length) {
          return targets.map((target) => renderToolReviewFieldForStep(
            projectSingleStepForReview(step, target.agent, target.roadId),
            task,
            stepIndex,
            `${target.agent}:${target.roadId}`
          )).join("");
        }
      }
      if (!ANSWER_AGENTS.includes(agent) || !hasTrace) {
        return stepFieldBlock("工具调用", prettyJson(step.tool_call_json));
      }
      return renderToolReviewFieldForStep(step, task, stepIndex);
    }

    function renderToolReviewFieldForStep(step, task, stepIndex, targetKey = "") {
      const agent = normalizeStepAgent(step.agent || step.operation);
      const roadId = String(step.single_review_road_id || "");
      return `
        <div class="field tool-review-field" data-step-index="${stepIndex}" data-agent="${escapeAttr(agent)}" data-road-id="${escapeAttr(roadId)}" data-target-key="${escapeAttr(targetKey)}">
          <div class="field-head">
            <label>工具调用审核${step.single_review_label ? ` · ${escapeHtml(step.single_review_label)}` : ""}</label>
            <span class="subtle">正在关联 DSL 子任务...</span>
          </div>
          <div class="tool-review-grid" role="status">
            <div class="answer-pane source-pane tool-review-evidence">
              <div class="answer-pane-title">本次 LLM 工具调用</div>
              <pre>${escapeHtml(prettyJson(step.tool_call_json) || "未记录")}</pre>
            </div>
            <div class="answer-pane tool-review-evidence">
              <div class="answer-pane-title">本地解析结果与内部命令</div>
              <pre>${escapeHtml(formatResolvedEvidence(step, task))}</pre>
            </div>
            <div class="answer-pane current-pane tool-review-standard">
              <div class="answer-pane-title">工具调用标准答案</div>
              <div class="subtle">正在读取...</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderLlmOutputField(step, task, stepIndex) {
      const output = prettyJson(step.llm_output_json);
      const targets = resolveAnswerTargets(step, task);
      if (!targets.length) return stepFieldBlock("LLM 输出", output);
      const agent = normalizeStepAgent(step.agent || step.operation);
      const writable = ANSWER_AGENTS.includes(agent);
      const actionHtml = writable ? renderWriteAnswerButton(agent, step.llm_output_json, stepIndex) : "";
      const answerItems = targets.map((target) => renderAnswerCurrentItem(target, stepIndex)).join("");
      const sourceText = output || "未记录";
      return `
        <div class="field">
          <div class="field-head">
            <label>LLM 输出</label>
            ${actionHtml}
          </div>
          <div class="answer-compare">
            <div class="answer-pane source-pane">
              <div class="answer-pane-title">本次测试内容</div>
              <pre>${escapeHtml(sourceText)}</pre>
            </div>
            <div class="answer-pane current-pane">
              <div class="answer-pane-title">当前标准答案</div>
              <div class="answer-current-list">
                ${answerItems}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderAnswerCurrentItem(agent, stepIndex) {
      return `
        <div class="answer-current-group" data-agent="${escapeAttr(agent)}" data-step-index="${stepIndex}">
          <div class="answer-current-item">
            <div class="answer-current-title">${escapeHtml(REQUEST_ANSWER_COLUMNS[agent] || agent)} 当前内容</div>
            <div class="answer-current-content" role="status">正在读取当前 answer...</div>
          </div>
        </div>
      `;
    }

    function resolveAnswerTargets(step, task = null) {
      const agent = normalizeStepAgent(step.agent || step.operation);
      if (ANSWER_AGENTS.includes(agent)) return [agent];
      if (agent !== "single") return [];
      return resolveSingleAnswerTargets(step, task);
    }

    function resolveSingleAnswerTargets(step, task = null) {
      const fromRequestTable = getRequestOperatorAgentsForTask(task);
      if (fromRequestTable.length) return fromRequestTable;
      const fromOutput = collectOrderedAnswerAgents(step.llm_output_json);
      if (fromOutput.length) return fromOutput;
      const fromTaskAgents = unique((task?.agents || [])
        .map((agent) => String(agent.name || "").toLowerCase())
        .filter((agent) => ANSWER_AGENTS.includes(agent)));
      if (fromTaskAgents.length) return fromTaskAgents;
      const fromManager = collectManagerAgentTypes(task?.steps || [])
        .filter((agent) => ANSWER_AGENTS.includes(agent));
      if (fromManager.length) return fromManager;
      return inferAgentTypesFromText(task?.user_input || "")
        .filter((agent) => ANSWER_AGENTS.includes(agent));
    }

    function getRequestOperatorAgentsForTask(task) {
      if (!task) return [];
      return state.requestOperatorByInput.get(normalizeTaskInput(task.user_input)) || [];
    }
    function normalizeStepAgent(value) {
      const agent = String(value || "").toLowerCase();
      return ["singleagent", "single_agent", "single-agent"].includes(agent) ? "single" : agent;
    }

    function collectOrderedAnswerAgents(value) {
      const seen = new Set();
      const ordered = [];
      const add = (agent) => {
        if (!ANSWER_AGENTS.includes(agent) || seen.has(agent)) return;
        seen.add(agent);
        ordered.push(agent);
      };
      const parsed = parseMaybeJson(value);
      const items = [];
      if (parsed?.commands) items.push(...parsed.commands);
      if (parsed?.operations) items.push(...parsed.operations);
      if (parsed?.dsl?.operations) items.push(...parsed.dsl.operations);
      if (parsed?.plans) items.push(...parsed.plans);
      for (const item of items) {
        add(String(item?.type_name || item?.operation || item?.agent || "").toLowerCase());
      }
      if (ordered.length) return ordered;
      return ANSWER_AGENTS
        .map((agent) => ({ agent, index: String(value || "").toLowerCase().indexOf(agent) }))
        .filter((item) => item.index >= 0)
        .sort((a, b) => a.index - b.index)
        .map((item) => item.agent);
    }

    function renderWriteAnswerButton(agent, value, stepIndex) {
      if (!ANSWER_AGENTS.includes(agent)) return "";
      if (value === undefined || value === null || value === "") return "";
      return `
        <span class="field-actions">
          <button class="field-action write-answer-btn" type="button" data-agent="${escapeAttr(agent)}" data-step-index="${stepIndex}">写入 answer</button>
          <button class="field-action append-answer-btn" type="button" data-agent="${escapeAttr(agent)}" data-step-index="${stepIndex}">追加</button>
          <button class="field-action clear-answer-btn" type="button" data-agent="${escapeAttr(agent)}" data-step-index="${stepIndex}">清除</button>
        </span>
      `;
    }

    function stepFieldBlock(label, value, actionHtml = "", options = {}) {
      const hasValue = !(value === undefined || value === null || value === "");
      const editableClass = options.editableInput ? "request-input-editable inline-editable" : "";
      const editableAttrs = options.editableInput
        ? `data-step-index="${Number(options.stepIndex)}" title="点击编辑并同步到 ${escapeAttr(REQUEST_DATABASE_NAME)}"`
        : "";
      return `
        <div class="field ${hasValue ? "" : "empty-field"}">
          <div class="field-head">
            <label>${escapeHtml(label)}</label>
            ${actionHtml}
          </div>
          <pre class="${editableClass}" ${editableAttrs}>${escapeHtml(hasValue ? String(value) : "未记录")}</pre>
        </div>
      `;
    }

    function renderStepDslChecks(step, dslChecks) {
      const stepId = String(step.step_id || "");
      const agent = String(step.agent || step.operation || "").toLowerCase();
      const checks = dslChecks.filter((check) => (
        String(check.step_id || "") === stepId
        && String(check.agent || check.operation || "").toLowerCase() === agent
      ));
      if (!checks.length) return "";
      return `
        <div class="table-wrap" style="margin-top:12px">
          <table class="dsl-check-table">
            <thead>
              <tr>
                <th>Attempt</th>
                <th>Passed</th>
                <th>Problem source</th>
                <th>Check result</th>
                <th>DSL output</th>
              </tr>
            </thead>
            <tbody>
              ${checks.map((check) => `
                <tr>
                  <td>${escapeHtml(check.attempt || "")}</td>
                  <td>${escapeHtml(check.passed || "")}</td>
                  <td>${escapeHtml(check.problem_source || "")}</td>
                  <td><pre>${escapeHtml(formatDslCheckResult(check))}</pre></td>
                  <td><pre>${escapeHtml(prettyJson(check.dsl_output_json))}</pre></td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function formatDslCheckResult(check) {
      const parsed = parseMaybeJson(check.check_output_json);
      if (parsed) return JSON.stringify(parsed, null, 2);
      return JSON.stringify({
        check_result: check.check_result || "",
        passed: check.passed || "",
        problem_source: check.problem_source || ""
      }, null, 2);
    }

    function fieldBlock(label, value) {
      if (value === undefined || value === null || value === "") return "";
      return `
        <div class="field">
          <label>${escapeHtml(label)}</label>
          <pre>${escapeHtml(String(value))}</pre>
        </div>
      `;
    }

    function renderMetrics(task) {
      if (!task.metrics.length) return `<div class="missing">表格未记录 road_metrics，无法计算道路结构变化。</div>`;
      return `<div class="metrics">${task.metrics.map((metric) => renderMetricCard(metric, task)).join("")}</div>`;
    }

    function renderMetricCard(metric, task) {
      const operation = String(metric.operation || "").toLowerCase();
      const before = parseMaybeJson(metric.before_json);
      const after = parseMaybeJson(metric.after_json);
      const delta = parseMaybeJson(metric.delta_json);
      return `
        <article class="metric-card">
          <div class="metric-head">
            <div class="metric-meta">
              ${agentChip(operation, true)}
              <code>road ${escapeHtml(metric.road_id || "")}</code>
              <code>step ${escapeHtml(metric.step_id || "")}</code>
              ${statusChip(metric.status || "ok")}
            </div>
            <code>${escapeHtml(metric.internal_command || "")}</code>
          </div>
          <div class="metric-body">
            ${renderMetricSummary(operation, before, after, delta, metric, task)}
            ${metric.error ? `<div class="error-box">${escapeHtml(metric.error)}</div>` : ""}
            <details>
              <summary>JSON 原文</summary>
              <div class="field-grid">
                ${fieldBlock("before_json", prettyJson(metric.before_json))}
                ${fieldBlock("after_json", prettyJson(metric.after_json))}
                ${fieldBlock("delta_json", prettyJson(metric.delta_json))}
              </div>
            </details>
          </div>
        </article>
      `;
    }

    function renderMetricSummary(operation, before, after, delta, metric, task) {
      if (operation === "width") return renderWidthMetric(before, after, delta);
      if (operation === "slope") return renderSlopeMetric(before, after, delta);
      if (operation === "curve") return renderCurveMetric(before, after, delta, metric, task);
      return renderGenericMetric(before, after);
    }

    function renderWidthMetric(before, after, delta) {
      if (!before || !after) return `<div class="missing">缺少 width before_json 或 after_json</div>`;
      const beforeTotal = num(before.target_avg_width_total);
      const afterTotal = num(after.target_avg_width_total);
      const diff = afterTotal - beforeTotal;
      const pct = percentChange(beforeTotal, afterTotal);
      const laneIds = unique([
        ...Object.keys(before.lane_avg_width || {}),
        ...Object.keys(after.lane_avg_width || {})
      ]);
      return `
        <div class="compare-grid">
          ${numberBox("修改前总宽", beforeTotal, "m")}
          ${numberBox("修改后总宽", afterTotal, "m")}
          ${numberBox("变化", diff, `m / ${formatPct(pct)}`, diff)}
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>lane</th><th class="num">修改前 m</th><th class="num">修改后 m</th><th class="num">变化 m</th><th class="num">变化 %</th></tr></thead>
            <tbody>
              ${laneIds.map((laneId) => {
                const b = num(before.lane_avg_width?.[laneId]);
                const a = num(after.lane_avg_width?.[laneId]);
                const d = a - b;
                return `<tr>
                  <td><code>${escapeHtml(laneId)}</code></td>
                  <td class="num">${formatNumber(b)}</td>
                  <td class="num">${formatNumber(a)}</td>
                  <td class="num ${signClass(d)}">${signed(formatNumber(d))}</td>
                  <td class="num ${signClass(d)}">${formatPct(percentChange(b, a))}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderSlopeMetric(before, after, delta) {
      if (!before || !after) return `<div class="missing">缺少 slope before_json 或 after_json</div>`;
      const rows = [
        ["start_elevation", "起点高程", "m"],
        ["end_elevation", "终点高程", "m"],
        ["height_delta", "高差", "m"],
        ["grade_degree", "坡度角", "deg"],
        ["grade_fraction", "坡度比例", ""]
      ];
      const magnitudeKeys = new Set(["height_delta", "grade_degree", "grade_fraction"]);
      const slopeChange = (key, beforeValue, afterValue) => (
        magnitudeKeys.has(key)
          ? Math.abs(afterValue) - Math.abs(beforeValue)
          : afterValue - beforeValue
      );
      const slopePercentChange = (key, beforeValue, afterValue) => (
        magnitudeKeys.has(key)
          ? percentChange(Math.abs(beforeValue), Math.abs(afterValue))
          : percentChange(beforeValue, afterValue)
      );
      const primaryDelta = slopeChange(
        "height_delta",
        num(before.height_delta),
        num(after.height_delta)
      );
      const gradeDegreeDelta = slopeChange(
        "grade_degree",
        num(before.grade_degree),
        num(after.grade_degree)
      );
      return `
        <div class="compare-grid">
          ${numberBox("道路长度", num(before.length ?? after.length), "m")}
          ${numberBox("高差变化", primaryDelta, "m", primaryDelta)}
          ${numberBox("坡度角变化", gradeDegreeDelta, "deg", gradeDegreeDelta)}
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>指标</th><th class="num">修改前</th><th class="num">修改后</th><th class="num">单位变化</th><th class="num">变化 %</th></tr></thead>
            <tbody>
              ${rows.map(([key, label, unit]) => {
                const b = num(before[key]);
                const a = num(after[key]);
                const d = slopeChange(key, b, a);
                return `<tr>
                  <td>${label}</td>
                  <td class="num">${formatNumber(b)} ${unit}</td>
                  <td class="num">${formatNumber(a)} ${unit}</td>
                  <td class="num ${signClass(d)}">${signed(formatNumber(d))} ${unit}</td>
                  <td class="num ${signClass(d)}">${formatPct(slopePercentChange(key, b, a))}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderCurveMetric(before, after, delta, metric, task) {
      const beforePoints = getCurveBeforePoints(before);
      const afterPoints = getCurveAfterPoints(after);
      if (!beforePoints || !afterPoints) {
        return `<div class="missing">缺少 curve 控制点，需 before_json.initial_control_points 或 before_json.curve_info.control_points，以及 after_json.optimized_control_points。</div>`;
      }
      const legacyPoints = getLegacyCurvePoints(beforePoints, metric, task);
      const peakContext = getCurvePeakContext(before, after, delta, metric, task);
      const beforeLength = approximateBezierLength(beforePoints);
      const afterLength = approximateBezierLength(afterPoints);
      const beforeChord = distance(beforePoints[0], beforePoints[3]);
      const pointRows = beforePoints.map((point, index) => {
        const afterPoint = afterPoints[index];
        const move = distance(point, afterPoint);
        return { index, before: point, after: afterPoint, move, pct: beforeChord ? move / beforeChord * 100 : null };
      });
      const maxMove = Math.max(...pointRows.map((row) => row.move));
      const beforePeaks = getCurvaturePeakSegments(beforePoints, peakContext);
      const afterPeaks = getCurvaturePeakSegments(afterPoints, peakContext);
      const beforeMaxCurvature = Math.max(...beforePeaks.map((item) => item.avgCurvature));
      const afterMaxCurvature = Math.max(...afterPeaks.map((item) => item.avgCurvature));
      const beforeRadius = curvatureRadius(beforeMaxCurvature);
      const afterRadius = curvatureRadius(afterMaxCurvature);
      const maxCentroidMove = Math.max(
        0,
        ...beforePeaks.map((item, index) => afterPeaks[index] ? distance(item.centroid, afterPeaks[index].centroid) : 0)
      );
      const comparisonRows = [
        ["曲线长度", beforeLength, afterLength, "m"],
        ["曲率半径", beforeRadius, afterRadius, "m"],
        ["最大平均曲率", beforeMaxCurvature, afterMaxCurvature, ""]
      ];
      const maxMovePct = beforeChord ? maxMove / beforeChord * 100 : null;
      const maxCentroidMovePct = beforeChord ? maxCentroidMove / beforeChord * 100 : null;
      return `
        <div class="curve-wrap">
          ${renderCurveSvg(beforePoints, legacyPoints, afterPoints)}
          <div class="curve-side">
            <div class="table-wrap">
              <table>
                <thead><tr><th>指标</th><th class="num">修改前</th><th class="num">修改后</th><th class="num">单位变化</th><th class="num">变化 %</th></tr></thead>
                <tbody>
                  ${comparisonRows.map(([label, beforeValue, afterValue, unit]) => {
                    const hasValues = isFiniteNumber(beforeValue) && isFiniteNumber(afterValue);
                    const difference = hasValues ? Number(afterValue) - Number(beforeValue) : null;
                    const unitSuffix = unit ? ` ${unit}` : "";
                    return `<tr>
                      <td>${label}</td>
                      <td class="num">${hasValues ? `${formatNumber(beforeValue)}${unitSuffix}` : "n/a"}</td>
                      <td class="num">${hasValues ? `${formatNumber(afterValue)}${unitSuffix}` : "n/a"}</td>
                      <td class="num ${difference === null ? "" : signClass(difference)}">${difference === null ? "n/a" : `${signed(formatNumber(difference))}${unitSuffix}`}</td>
                      <td class="num ${difference === null ? "" : signClass(difference)}">${difference === null ? "n/a" : formatPct(percentChange(Number(beforeValue), Number(afterValue)))}</td>
                    </tr>`;
                  }).join("")}
                  <tr>
                    <td>最大控制点位移</td>
                    <td class="num">-</td>
                    <td class="num">${formatNumber(maxMove)} m</td>
                    <td class="num ${signClass(maxMove)}">${signed(formatNumber(maxMove))} m</td>
                    <td class="num ${signClass(maxMove)}">${formatPct(maxMovePct)}</td>
                  </tr>
                  <tr>
                    <td>最大质心位移</td>
                    <td class="num">-</td>
                    <td class="num">${formatNumber(maxCentroidMove)} m</td>
                    <td class="num ${signClass(maxCentroidMove)}">${signed(formatNumber(maxCentroidMove))} m</td>
                    <td class="num ${signClass(maxCentroidMove)}">${formatPct(maxCentroidMovePct)}</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="table-wrap" style="margin-top:12px">
              <table>
                <thead><tr><th>点</th><th>修改前 (m)</th><th>修改后 (m)</th><th class="num">位移 (m)</th><th class="num">占弦长</th></tr></thead>
                <tbody>
                  ${pointRows.map((row) => `<tr>
                    <td><code>P${row.index}</code></td>
                    <td>${formatPoint(row.before)}</td>
                    <td>${formatPoint(row.after)}</td>
                    <td class="num">${formatNumber(row.move)}</td>
                    <td class="num">${formatPct(row.pct)}</td>
                  </tr>`).join("")}
                </tbody>
              </table>
            </div>
            ${renderCurvaturePeakTable(beforePeaks, afterPeaks)}
            ${delta?.command_params ? `<pre style="margin-top:12px">${escapeHtml(JSON.stringify(delta.command_params, null, 2))}</pre>` : ""}
          </div>
        </div>
      `;
    }

    function renderCurvaturePeakTable(beforePeaks, afterPeaks) {
      const count = Math.max(beforePeaks.length, afterPeaks.length);
      const rows = [];
      for (let index = 0; index < count; index += 1) {
        const before = beforePeaks[index];
        const after = afterPeaks[index];
        const curvatureDelta = after && before ? after.avgCurvature - before.avgCurvature : null;
        const centroidMove = after && before ? distance(before.centroid, after.centroid) : null;
        rows.push(`<tr>
          <td><code>${index + 1}</code></td>
          <td>${before ? formatRange(before.range) : "n/a"}</td>
          <td class="num">${before ? formatNumber(before.avgCurvature) : "n/a"}</td>
          <td>${before ? formatPoint(before.centroid) : "n/a"}</td>
          <td>${after ? formatRange(after.range) : "n/a"}</td>
          <td class="num">${after ? formatNumber(after.avgCurvature) : "n/a"}</td>
          <td>${after ? formatPoint(after.centroid) : "n/a"}</td>
          <td class="num ${signClass(curvatureDelta)}">${curvatureDelta === null ? "n/a" : signed(formatNumber(curvatureDelta))}</td>
          <td class="num">${centroidMove === null ? "n/a" : formatNumber(centroidMove)}</td>
        </tr>`);
      }
      return `
        <div class="table-wrap" style="margin-top:12px">
          <table class="peak-table">
            <thead>
              <tr>
                <th>片段</th>
                <th>before t 区间</th>
                <th class="num">before 平均曲率</th>
                <th>before 加权质心 (m)</th>
                <th>after t 区间</th>
                <th class="num">after 平均曲率</th>
                <th>after 加权质心 (m)</th>
                <th class="num">曲率变化</th>
                <th class="num">质心位移 (m)</th>
              </tr>
            </thead>
            <tbody>${rows.join("")}</tbody>
          </table>
        </div>
      `;
    }

    function renderGenericMetric(before, after) {
      if (!before || !after) return `<div class="missing">缺少 before_json 或 after_json</div>`;
      const keys = unique([...Object.keys(before), ...Object.keys(after)]).filter((key) => isFiniteNumber(before[key]) || isFiniteNumber(after[key]));
      if (!keys.length) return `<div class="missing">未找到可直接比较的数值字段</div>`;
      return `
        <div class="table-wrap">
          <table>
            <thead><tr><th>字段</th><th class="num">修改前</th><th class="num">修改后</th><th class="num">变化</th><th class="num">变化 %</th></tr></thead>
            <tbody>
              ${keys.map((key) => {
                const b = num(before[key]);
                const a = num(after[key]);
                const d = a - b;
                return `<tr><td>${escapeHtml(key)}</td><td class="num">${formatNumber(b)}</td><td class="num">${formatNumber(a)}</td><td class="num ${signClass(d)}">${signed(formatNumber(d))}</td><td class="num">${formatPct(percentChange(b, a))}</td></tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderCurveSvg(beforePoints, legacyPoints, afterPoints) {
      const all = [...beforePoints, ...(legacyPoints || []), ...afterPoints];
      const xs = all.map((point) => point[0]);
      const ys = all.map((point) => point[1]);
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);
      const spanX = Math.max(1e-6, maxX - minX);
      const spanY = Math.max(1e-6, maxY - minY);
      const pad = 28;
      const width = 640;
      const height = 300;
      const scale = Math.min((width - pad * 2) / spanX, (height - pad * 2) / spanY);
      const project = (point) => [
        pad + (point[0] - minX) * scale + ((width - pad * 2) - spanX * scale) / 2,
        height - pad - (point[1] - minY) * scale - ((height - pad * 2) - spanY * scale) / 2
      ];
      const b = beforePoints.map(project);
      const legacy = legacyPoints ? legacyPoints.map(project) : null;
      const agent = afterPoints.map(project);
      const path = (points) => `M ${points[0][0]} ${points[0][1]} C ${points[1][0]} ${points[1][1]}, ${points[2][0]} ${points[2][1]}, ${points[3][0]} ${points[3][1]}`;
      const poly = (points) => points.map((point) => point.join(",")).join(" ");
      return `
        <div class="curve-figure">
          <svg class="curve-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="三阶贝塞尔曲线三方案对比">
            <rect x="0" y="0" width="${width}" height="${height}" fill="transparent"></rect>
            <polyline points="${poly(b)}" fill="none" stroke="oklch(64% 0.01 248)" stroke-width="1.5" stroke-dasharray="5 5"></polyline>
            ${legacy ? `<polyline points="${poly(legacy)}" fill="none" stroke="oklch(56% 0.065 205)" stroke-width="1.5" stroke-dasharray="4 4"></polyline>` : ""}
            <polyline points="${poly(agent)}" fill="none" stroke="oklch(63% 0.15 28)" stroke-width="1.5" stroke-dasharray="4 4"></polyline>
            <path d="${path(b)}" fill="none" stroke="oklch(48% 0.01 248)" stroke-width="3" stroke-dasharray="8 6"></path>
            ${legacy ? `<path d="${path(legacy)}" fill="none" stroke="oklch(48% 0.085 205)" stroke-width="3"></path>` : ""}
