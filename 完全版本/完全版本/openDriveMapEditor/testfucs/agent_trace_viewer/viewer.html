    async function chooseTraceDirectory() {
      if (!window.showDirectoryPicker) {
        $("#loadMessage").textContent = "当前浏览器不支持目录快速导入";
        return;
      }
      try {
        const handle = await window.showDirectoryPicker({ mode: "read" });
        state.directoryHandle = handle;
        try {
          await saveDirectoryHandle(handle);
        } catch (error) {
          console.warn(error);
        }
        await refreshDirectoryFileList({ requestPermission: true });
        if (state.taskModels.length) await ensureRequestOperatorMap();
      } catch (error) {
        if (error && error.name === "AbortError") return;
        console.error(error);
        $("#loadMessage").textContent = `读取数据目录失败：${error.message || String(error)}`;
      }
    }

    async function restoreTraceDirectory() {
      try {
        const handle = await readDirectoryHandle();
        if (!handle) return;
        state.directoryHandle = handle;
        const permission = await queryDirectoryPermission(handle);
        if (permission === "granted") {
          await refreshDirectoryFileList();
          return;
        }
        renderQuickFileSelect("已记住数据目录，点击“选择数据目录”授权");
      } catch (error) {
        console.warn(error);
      }
    }

    async function refreshDirectoryFileList(options = {}) {
      if (!state.directoryHandle) return;
      const permission = options.requestPermission
        ? await requestDirectoryPermission(state.directoryHandle)
        : await queryDirectoryPermission(state.directoryHandle);
      if (permission !== "granted") {
        renderQuickFileSelect("未获得目录权限");
        return;
      }
      const entries = [];
      for await (const [name, handle] of state.directoryHandle.entries()) {
        if (handle.kind !== "file") continue;
        if (!/\.(jsonl|xlsx)$/i.test(name) || name.startsWith("~$")) continue;
        entries.push({ name, handle });
      }
      entries.sort((a, b) => {
        const formatOrder = Number(/\.xlsx$/i.test(a.name)) - Number(/\.xlsx$/i.test(b.name));
        return formatOrder || a.name.localeCompare(b.name, "zh-CN", { numeric: true });
      });
      state.traceFileHandles = entries;
      renderQuickFileSelect(entries.length ? "快速导入目录 trace" : "目录中未找到 JSONL/XLSX");
      $("#loadMessage").textContent = entries.length ? `已读取数据目录：${entries.length} 个 trace 文件` : "数据目录中未找到 JSONL 或 XLSX 文件";
    }

    function renderQuickFileSelect(placeholder) {
      const trigger = $("#xlsxQuickTrigger");
      const menu = $("#xlsxQuickMenu");
      const current = state.traceFileHandles.find((entry) => entry.name === state.sourceName);
      trigger.disabled = !state.traceFileHandles.length;
      const triggerName = current ? current.name : placeholder;
      trigger.textContent = compactFileName(triggerName);
      trigger.title = triggerName;
      menu.innerHTML = state.traceFileHandles.map((entry, index) => (
        `<button class="quick-select-option" type="button" role="option" data-index="${index}">${escapeHtml(entry.name)}</button>`
      )).join("");
      setQuickSelectOpen(false);
    }

    function setQuickSelectOpen(open) {
      const trigger = $("#xlsxQuickTrigger");
      const menu = $("#xlsxQuickMenu");
      if (trigger.disabled || !state.traceFileHandles.length) open = false;
      menu.hidden = !open;
      trigger.setAttribute("aria-expanded", String(open));
    }

    async function loadDirectoryTraceFile(index) {
      const entry = state.traceFileHandles[index];
      if (!entry) return;
      try {
        const file = await entry.handle.getFile();
        await loadTraceFile(file);
        renderQuickFileSelect("快速导入目录 trace");
      } catch (error) {
        if (error && error.name === "AbortError") return;
        console.error(error);
        $("#loadMessage").textContent = `快速导入失败：${error.message || String(error)}`;
      }
    }

    async function queryDirectoryPermission(handle) {
      if (!handle?.queryPermission) return "granted";
      return handle.queryPermission({ mode: "read" });
    }

    async function requestDirectoryPermission(handle) {
      if (!handle?.queryPermission || !handle?.requestPermission) return "granted";
      const options = { mode: "read" };
      if (await handle.queryPermission(options) === "granted") return "granted";
      return handle.requestPermission(options);
    }

    async function saveDirectoryHandle(handle) {
      const db = await openDirectoryDb();
      await writeDirectorySetting(db, DIRECTORY_HANDLE_KEY, handle);
      db.close();
    }

    async function readDirectoryHandle() {
      const db = await openDirectoryDb();
      const handle = await readDirectorySetting(db, DIRECTORY_HANDLE_KEY);
      db.close();
      return handle;
    }

    function openDirectoryDb() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DIRECTORY_DB_NAME, 1);
        request.onupgradeneeded = () => {
          request.result.createObjectStore(DIRECTORY_STORE_NAME);
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function writeDirectorySetting(db, key, value) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DIRECTORY_STORE_NAME, "readwrite");
        tx.objectStore(DIRECTORY_STORE_NAME).put(value, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
    }

    function readDirectorySetting(db, key) {
      return new Promise((resolve, reject) => {
        const request = db.transaction(DIRECTORY_STORE_NAME, "readonly")
          .objectStore(DIRECTORY_STORE_NAME)
          .get(key);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });
    }

    function releaseLoadedTraceState() {
      clearTimeout(state.accuracyRefreshTimer);
      state.accuracyRefreshToken += 1;
      state.accuracyResults.clear();
      state.accuracyLoading = false;
      state.accuracyError = "";
      for (const pending of state.reviewSaveTimers.values()) {
        clearTimeout(pending?.timerId ?? pending);
      }
      state.reviewSaveTimers.clear();
      state.toolReviewRefreshToken += 1;
      state.workbook = null;
      state.tasks = [];
      state.steps = [];
      state.metrics = [];
      state.dslChecks = [];
      state.llmRequests = [];
      state.taskModels = [];
      state.detailTaskIds = [];
      state.selectedTaskId = null;
      state.viewMode = "overview";
      state.statusFilter = "all";
      state.instructionFilter = "all";
      state.accuracyFailureFilter = "all";
      state.reviewFilter = "all";
      state.search = "";
      state.sourceName = "";
      state.sourceFormat = "";
      state.answerSelectionByKey.clear();
      state.toolReviewSelectionByKey.clear();
      state.reviewByTask = new Map();
      lastTaskNavigationAt = 0;
      $("#searchInput").value = "";
      $("#taskList").replaceChildren();
      $("#overviewView").replaceChildren();
      $("#detailView").replaceChildren();
      $("#taskList").scrollTop = 0;
      $("#main-content").scrollTop = 0;
    }

    async function loadTraceFile(file) {
      if (state.autoReviewRunning) {
        $("#loadMessage").textContent = "自动审核进行中，完成后才能切换 trace 文件";
        return;
      }
      const loadToken = ++state.traceLoadToken;
      $("#loadMessage").textContent = `正在读取 ${file.name}...`;
      try {
        await ensureRequestOperatorMap();
        const sourceFormat = /\.jsonl$/i.test(file.name)
          ? "jsonl"
          : /\.xlsx$/i.test(file.name)
            ? "xlsx"
            : "";
        if (!sourceFormat) throw new Error("只支持 .jsonl 或旧版 .xlsx trace 文件");
        let workbook;
        if (sourceFormat === "jsonl") {
          const parsed = readJsonlTrace(await file.text(), file.name);
          workbook = parsed.workbook;
        } else {
          workbook = normalizeLegacyTraceWorkbook(
            await readXlsxWorkbook(await file.arrayBuffer()),
            file.name
          );
        }
        const tasks = sheetToObjects(workbook.sheets.tasks || []);
        const steps = sheetToObjects(workbook.sheets.agent_steps || []);
        const metrics = sheetToObjects(workbook.sheets.road_metrics || []);
        const dslChecks = sheetToObjects(workbook.sheets.dsl_checks || []);
        const llmRequests = sheetToObjects(workbook.sheets.llm_requests || []);
        if (!tasks.length) {
          throw new Error(
            sourceFormat === "jsonl"
              ? "JSONL 未包含可识别的 task/agent_step 或 tool_plan_case 记录"
              : "XLSX 未包含 tasks/agent_steps 或 Summary/Cases 工具评测记录"
          );
        }
        const taskModels = buildTaskModels(tasks, steps, metrics, dslChecks, llmRequests);
        const reviewByTask = await buildReviewMap(
          workbook.sheets.manual_review || [],
          tasks,
          file.name
        );
        if (loadToken !== state.traceLoadToken) return;
        await flushPendingReviewSaves();
        if (loadToken !== state.traceLoadToken) return;
        releaseLoadedTraceState();
        state.workbook = workbook;
        state.tasks = tasks;
        state.steps = steps;
        state.metrics = metrics;
        state.dslChecks = dslChecks;
        state.llmRequests = llmRequests;
        state.sourceFormat = sourceFormat;
        state.sourceName = file.name;
        state.reviewByTask = reviewByTask;
        state.taskModels = taskModels;
        state.selectedTaskId = state.taskModels[0]?.task_id || null;
        setDisplayFileName("#fileName", file.name);
        if (state.traceFileHandles.length) renderQuickFileSelect("快速导入目录 trace");
        updateAutoReviewButton();
        $("#loadMessage").textContent = `已载入 ${tasks.length} 个任务，${metrics.length} 条修改记录，${dslChecks.length} 条 DSL 检查，${llmRequests.length} 条 LLM 请求`;
        $("#saveMessage").textContent = "Trace 已按只读方式载入；审核结果将保存到请求数据库。";
        renderAll();
        await refreshAccuracy();
      } catch (error) {
        if (loadToken !== state.traceLoadToken) return;
        console.error(error);
        $("#loadMessage").innerHTML = `<span class="error-box">${escapeHtml(error.message || String(error))}</span>`;
      }
    }

    function buildTaskModels(tasks, steps, metrics, dslChecks = [], llmRequests = []) {
      const stepsByTask = groupBy(steps, (row) => String(row.task_id || ""));
      const metricsByTask = groupBy(metrics, (row) => String(row.task_id || ""));
      const dslChecksByTask = groupBy(dslChecks, (row) => String(row.task_id || ""));
      const llmRequestsByTask = groupBy(llmRequests, (row) => String(row.task_id || ""));
      return tasks.map((task) => {
        const taskId = String(task.task_id || "");
        const taskSteps = sortByStep(stepsByTask.get(taskId) || []);
        const taskMetrics = sortByStep(metricsByTask.get(taskId) || []);
        const taskDslChecks = sortDslChecks(dslChecksByTask.get(taskId) || []);
        const taskLlmRequests = sortLlmRequests(llmRequestsByTask.get(taskId) || []);
        const agents = inferAgents(task, taskSteps, taskMetrics);
        return { ...task, task_id: taskId, steps: taskSteps, metrics: taskMetrics, dslChecks: taskDslChecks, llmRequests: taskLlmRequests, agents };
      });
    }

    function inferAgents(task, steps, metrics) {
      const recorded = new Set();
      for (const step of steps) {
        const agent = String(step.agent || step.operation || "").toLowerCase();
        if (AGENTS.includes(agent)) recorded.add(agent);
      }
      for (const metric of metrics) {
        const op = String(metric.operation || "").toLowerCase();
        if (AGENTS.includes(op)) recorded.add(op);
      }
      const sources = new Map();
      for (const agent of recorded) sources.set(agent, "recorded");
      const hasSingleStep = recorded.has("single");
      if (!hasSingleStep) {
        const requestOperators = state.requestOperatorByInput.get(normalizeTaskInput(task.user_input));
        if (requestOperators?.length) {
          for (const agent of requestOperators) if (!sources.has(agent)) sources.set(agent, "request_table");
        } else {
          const managerAgents = collectManagerAgentTypes(steps);
          if (managerAgents.length) {
            for (const agent of managerAgents) if (!sources.has(agent)) sources.set(agent, "manager");
          } else {
            const textAgents = inferAgentTypesFromText(task.user_input);
            for (const agent of textAgents) if (!sources.has(agent)) sources.set(agent, "inferred");
          }
        }
      }
      return AGENTS
        .filter((agent) => sources.has(agent))
        .map((agent) => ({ name: agent, source: sources.get(agent), recorded: sources.get(agent) === "recorded" }));
    }

    function collectAgentTypesFromJson(value, target) {
      const parsed = parseMaybeJson(value);
      const items = [];
      if (parsed?.commands) items.push(...parsed.commands);
      if (parsed?.operations) items.push(...parsed.operations);
      for (const item of items) {
        const name = String(item?.type_name || item?.operation || "").toLowerCase();
        if (AGENTS.includes(name)) target.add(name);
      }
    }

    async function ensureRequestOperatorMap() {
      if (state.requestOperatorLoadAttempted || state.requestOperatorByInput.size || state.requestOperatorWorkbook) return;
      state.requestOperatorLoadAttempted = true;
      const source = await readRequestDatabase();
      if (!source) return;
      setRequestOperatorSource(source);
    }

    async function readRequestDatabase() {
      try {
        const payload = await requestDatabaseApi("/api/request-data");
        return {
          workbook: { sheets: { [payload.sheet_name || "Sheet1"]: payload.rows || [] } },
          roadAlignments: payload.road_alignments || {}
        };
      } catch (error) {
        console.warn(error);
        $("#saveMessage").textContent = `未连接请求数据库服务：${error.message || String(error)}`;
      }
      return null;
    }

    async function requestDatabaseApi(path, options = {}) {
      const response = await fetch(new URL(path, window.location.href), {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });
      let payload = {};
      try {
        payload = await response.json();
      } catch (error) {
        throw new Error(`数据库服务返回了无效响应（HTTP ${response.status}）`);
      }
      if (!response.ok) throw new Error(payload.error || `数据库请求失败（HTTP ${response.status}）`);
      return payload;
    }

    function setRequestOperatorSource(source) {
      state.requestOperatorWorkbook = source.workbook;
      state.requestOperatorSheetName = Object.keys(source.workbook.sheets)[0] || "";
      const requestInfo = buildRequestOperatorInfo(source.workbook);
      state.requestOperatorByInput = requestInfo.operatorByInput;
      state.requestCaseIdByInput = requestInfo.caseIdByInput;
      state.requestInputRowIndexes = requestInfo.rowIndexesByInput;
      const roadAlignments = source.roadAlignments === undefined
        ? Object.fromEntries(state.roadAlignmentByCaseId)
        : source.roadAlignments;
      state.roadAlignmentByCaseId = new Map(Object.entries(roadAlignments || {}));
      updateAutoReviewButton();
    }

    function buildRequestOperatorInfo(workbook) {
      const rows = Object.values(workbook.sheets)[0] || [];
      const headers = (rows[0] || []).map((cell) => String(cell || "").trim());
      const inputIndex = headers.indexOf(REQUEST_INPUT_COLUMN);
      const operatorIndex = headers.indexOf(REQUEST_OPERATOR_COLUMN);
      const caseIdIndex = headers.indexOf(REQUEST_CASE_ID_COLUMN);
      const operatorByInput = new Map();
      const caseIdByInput = new Map();
      const rowIndexesByInput = new Map();
      if (inputIndex < 0) return { operatorByInput, caseIdByInput, rowIndexesByInput };
      for (let rowIndex = 1; rowIndex < rows.length; rowIndex += 1) {
        const row = rows[rowIndex] || [];
        const input = normalizeTaskInput(row[inputIndex]);
        if (!input) continue;
        if (!rowIndexesByInput.has(input)) rowIndexesByInput.set(input, []);
        rowIndexesByInput.get(input).push(rowIndex);
        if (caseIdIndex >= 0 && String(row[caseIdIndex] || "").trim()) {
          caseIdByInput.set(input, String(row[caseIdIndex]).trim());
        }
        const operators = operatorIndex >= 0 ? parseOperatorTypes(row[operatorIndex]) : [];
        if (operators.length) operatorByInput.set(input, operators);
      }
      return { operatorByInput, caseIdByInput, rowIndexesByInput };
    }

    function collectManagerAgentTypes(steps) {
      const agents = new Set();
      for (const step of steps) {
        const agent = String(step.agent || step.operation || "").toLowerCase();
        if (agent !== "manager") continue;
        collectAgentTypesFromJson(step.llm_output_json, agents);
      }
      return [...agents];
    }

    function inferAgentTypesFromText(userInput) {
      const text = String(userInput || "").toLowerCase();
      const agents = new Set();
      if (/\b(width|widen|lane)\b/.test(text)) agents.add("width");
      if (/\b(slope|grade|elevation|raise|lower|height)\b/.test(text)) agents.add("slope");
      if (/\b(curve|curvature|sharper|bend|shape)\b/.test(text)) agents.add("curve");
      return [...agents];
    }

    function parseOperatorTypes(value) {
      const text = String(value || "").toLowerCase();
      if (/\ball\b/.test(text)) return [...ANSWER_AGENTS];
      const matches = text.match(/\b(width|slope|curve)\b/g) || [];
      return ANSWER_AGENTS.filter((agent) => matches.includes(agent));
    }
    function normalizeTaskInput(value) {
      return String(value || "").trim().replace(/\s+/g, " ").toLowerCase();
    }

    function getTaskCaseId(task, autoReviewData = null) {
      const mappedCaseId = autoReviewData?.caseIdByTask?.get?.(task?.task_id);
      if (mappedCaseId) return String(mappedCaseId);
      return state.requestCaseIdByInput.get(normalizeTaskInput(task?.user_input)) || "";
    }

    function getRoadAlignmentForTask(task, autoReviewData = null) {
      const caseId = getTaskCaseId(task, autoReviewData);
      const caseData = caseId ? autoReviewData?.cases?.[caseId] : null;
      const alignment = caseData?.road_alignment
        || autoReviewData?.roadAlignments?.[caseId]
        || state.roadAlignmentByCaseId.get(caseId);
      if (!alignment) return null;
      const status = String(alignment.match_status || "matched").trim().toLowerCase();
      const roadId = normalizeSingleRoadId(alignment.road_id);
      if (status !== "matched" || !roadId) return null;
      return { ...alignment, road_id: roadId };
    }

    function answerRoadIds(value) {
      return getAnswerScope(value).roadIds
        .map((roadId) => normalizeSingleRoadId(roadId))
        .filter(Boolean);
    }

    function buildRoadComparisonContext(task, autoReviewData = null, expectedValues = []) {
      const caseId = getTaskCaseId(task, autoReviewData);
      const caseData = caseId ? autoReviewData?.cases?.[caseId] : null;
      const baselineValues = ANSWER_AGENTS.flatMap((agent) => (
        (caseData?.[agent] || []).map((answer) => answer.dsl)
      ));
      const standardRoadIds = unique(
        [...baselineValues, ...expectedValues].flatMap(answerRoadIds)
      );
      const alignment = getRoadAlignmentForTask(task, autoReviewData);
      const alignedRoadId = alignment?.road_id || "";
      const requestedRoadIds = unique([...String(task?.user_input || "")
        .matchAll(/\broad(?:way)?[\s_]*(\d+)\b/gi)]
        .map((match) => normalizeSingleRoadId(match[1])));
      // A placeholder and its aligned road are alternative answer scopes, not
      // two required subtasks. Do not collapse genuine multi-road requests.
      const requestedRoadId = requestedRoadIds.length === 1 ? requestedRoadIds[0] : "";
      const preferAlignedAnswers = Boolean(
        alignedRoadId && requestedRoadId && requestedRoadId !== alignedRoadId
        && standardRoadIds.includes(alignedRoadId)
        && standardRoadIds.every((roadId) => [requestedRoadId, alignedRoadId].includes(roadId))
      );
      const standardRoadId = preferAlignedAnswers
        ? alignedRoadId : standardRoadIds.length === 1 ? standardRoadIds[0] : "";
      return {
        caseId,
        alignment,
        alignedRoadId,
        standardRoadId,
        standardRoadIds,
        comparisonAliasRoadId: preferAlignedAnswers ? requestedRoadId : alignedRoadId,
        preferAlignedAnswers,
        enabled: Boolean(alignedRoadId && standardRoadId)
      };
    }

    function roadIdComparisonKey(value, roadContext = null) {
      const normalized = normalizeSingleRoadId(value);
      if (!normalized) return "";
      if (
        roadContext?.enabled
        && normalized === roadContext.comparisonAliasRoadId
      ) {
        return roadContext.standardRoadId;
      }
      return normalized;
    }

    function preferAlignedAnswerCandidates(candidates, roadContext, valueOf = (answer) => answer.dsl) {
      if (!roadContext?.preferAlignedAnswers) return candidates;
      const aligned = candidates.filter((answer) => (
        answerRoadIds(valueOf(answer)).includes(roadContext.alignedRoadId)
      ));
      return aligned.length ? aligned : candidates;
    }

    function normalizeToolRoadIdValue(value, roadContext = null) {
      const normalized = roadIdComparisonKey(value, roadContext);
      return normalized.replace(/^road_/, "");
    }

    function renderAll() {
      renderSummary();
      renderFilters();
      renderTaskList();
      renderMain();
    }

    function renderMain() {
      if (!state.taskModels.length) {
        $("#emptyState").hidden = false;
        $("#overviewView").hidden = true;
        $("#detailView").hidden = true;
        return;
      }
      $("#emptyState").hidden = true;
      if (state.viewMode === "detail") {
        $("#overviewView").hidden = true;
        $("#detailView").hidden = false;
        renderDetail();
        return;
      }
      $("#overviewView").hidden = false;
      $("#detailView").hidden = true;
      renderOverview();
    }

    function renderSummary() {
      renderAccuracySummary();
      const done = state.tasks.filter((task) => task.status === "done").length;
      const errors = state.tasks.filter((task) => task.status === "error").length;
      $("#summary").innerHTML = `
        <div class="stat"><span class="subtle">任务</span><strong>${state.tasks.length}</strong></div>
        <div class="stat"><span class="subtle">修改记录</span><strong>${state.metrics.length}</strong></div>
        <div class="stat"><span class="subtle">完成</span><strong>${done}</strong></div>
        <div class="stat"><span class="subtle">异常</span><strong>${errors}</strong></div>
      `;
    }

    function renderFilters() {
      const statuses = ["all", "done", "running", "error"];
      const statusLabels = { all: "全部", done: "完成", running: "运行中", error: "异常" };
      $("#statusFilters").innerHTML = statuses.map((status) => `
        <button class="filter-btn ${state.statusFilter === status ? "active" : ""}" type="button" data-status="${status}">
          ${statusLabels[status]}
        </button>
      `).join("");
      $("#statusFilters").querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          state.statusFilter = button.dataset.status;
          renderAccuracySummary();
          resetDetailTaskSnapshotForFilterChange();
          renderFilters();
          renderTaskList();
          renderMain();
        });
      });

      $("#instructionFilters").innerHTML = ["all", ...INSTRUCTION_TYPES].map((type) => {
        const active = state.instructionFilter === type;
        return `
        <button class="filter-btn ${active ? "active" : ""}" type="button" data-instruction="${type}" aria-pressed="${active}">
          ${type === "all" ? "全部指令" : type}
        </button>`;
      }).join("");
      $("#instructionFilters").querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          toggleInstructionFilter(button.dataset.instruction);
        });
      });
      updateLocatePendingButton();
    }

    function resetDetailTaskSnapshotForFilterChange() {
      state.detailTaskIds = [];
      if (state.viewMode === "detail") state.viewMode = "overview";
    }

    function toggleInstructionFilter(type) {
      state.instructionFilter = state.instructionFilter === type ? "all" : type;
      resetDetailTaskSnapshotForFilterChange();
      renderAccuracySummary();
      renderFilters();
      renderTaskList();
      renderMain();
    }

    function toggleAccuracyFilter(stage) {
      state.accuracyFailureFilter = state.accuracyFailureFilter === stage ? "all" : stage;
      resetDetailTaskSnapshotForFilterChange();
      renderAccuracySummary();
      renderTaskList();
      renderMain();
    }

    function getDetailTaskSnapshotTasks() {
      if (state.viewMode !== "detail" || !state.detailTaskIds.length) return [];
      const taskById = new Map(state.taskModels.map((task) => [task.task_id, task]));
      return state.detailTaskIds.map((taskId) => taskById.get(taskId)).filter(Boolean);
    }

    function getTaskListItems() {
      const snapshotTasks = getDetailTaskSnapshotTasks();
      return snapshotTasks.length ? snapshotTasks : filteredTasks();
    }

    function captureDetailTaskSnapshot(taskId) {
      const ids = filteredTasks().map((task) => task.task_id);
      if (taskId && !ids.includes(taskId)) ids.push(taskId);
      state.detailTaskIds = ids;
    }

    function renderTaskList() {
      const taskList = $("#taskList");
      const previousScrollTop = taskList.scrollTop;
      const tasks = getTaskListItems();
      if (!tasks.length) {
        taskList.innerHTML = `<div class="missing">没有匹配任务</div>`;
        restoreTaskListScroll(taskList, previousScrollTop);
        updateLocatePendingButton();
        return;
      }
      taskList.innerHTML = tasks.map((task) => `
        <button class="task-button ${task.task_id === state.selectedTaskId ? "active" : ""}" type="button" data-task-id="${escapeAttr(task.task_id)}">
          <div class="task-top">
            <code>${escapeHtml(task.task_id)}</code>
            <span class="task-tags">
              ${statusChip(task.status)}
              ${renderTaskDurationChip(task)}
              <span class="task-review-chip">${reviewChip(readReview(task).decision)}</span>
            </span>
          </div>
          <div class="task-title">${escapeHtml(task.user_input || "")}</div>
          <div class="head-meta" style="margin-top:10px">
            ${renderAgentChips(task.agents)}
          </div>
        </button>
      `).join("");
      restoreTaskListScroll(taskList, previousScrollTop);
      taskList.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          selectTask(button.dataset.taskId);
        });
      });
      updateLocatePendingButton();
    }

    function restoreTaskListScroll(taskList, scrollTop) {
      taskList.scrollTop = scrollTop;
      requestAnimationFrame(() => {
        taskList.scrollTop = scrollTop;
      });
    }

    function updateTaskListReviewChip(task) {
      const taskButton = Array.from($("#taskList").querySelectorAll(".task-button"))
        .find((button) => button.dataset.taskId === String(task.task_id));
      const chip = taskButton?.querySelector(".task-review-chip");
      if (chip) chip.innerHTML = reviewChip(readReview(task).decision);
    }

    function selectTask(taskId, options = {}) {
      const preserveSnapshot = options.preserveDetailTaskList === true
        || (options.preserveDetailTaskList !== false && state.viewMode === "detail" && state.detailTaskIds.length);
      if (!preserveSnapshot) captureDetailTaskSnapshot(taskId);
      else if (taskId && !state.detailTaskIds.includes(taskId)) state.detailTaskIds.push(taskId);
      state.selectedTaskId = taskId;
      state.viewMode = "detail";
      renderTaskList();
      renderMain();
      requestAnimationFrame(scrollSelectedTaskIntoView);
      $("#main-content").scrollTop = 0;
    }

    function isTypingTarget(target) {
      if (!(target instanceof Element)) return false;
      const editable = target.closest("[contenteditable]");
      return Boolean(
        target.closest("input, textarea, select") ||
        (editable && editable.getAttribute("contenteditable") !== "false")
      );
    }

    function navigateSelectedTask(direction) {
      if (state.viewMode !== "detail" || !state.selectedTaskId) return false;
      const navigation = getTaskNavigation(state.selectedTaskId);
      const targetTask = navigation[direction];
      if (!targetTask) return false;
      selectTask(targetTask.task_id, { preserveDetailTaskList: true });
      return true;
    }

    function getTaskNavigation(taskId) {
      const snapshotTasks = getDetailTaskSnapshotTasks();
      const tasks = snapshotTasks.length ? snapshotTasks : filteredTasks();
      const index = tasks.findIndex((task) => task.task_id === taskId);
      return {
        previous: index > 0 ? tasks[index - 1] : null,
        next: index >= 0 && index < tasks.length - 1 ? tasks[index + 1] : null
      };
    }

    function markSelectedTaskReview(decision) {
      if (state.viewMode !== "detail" || !state.selectedTaskId) return false;
      const task = state.taskModels.find((item) => item.task_id === state.selectedTaskId);
      if (!task) return false;
      setTaskReviewDecision(task, decision);
      return true;
    }

    function scrollSelectedTaskIntoView() {
      $("#taskList .task-button.active")?.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    function findNearestPendingTask() {
      const tasks = filteredTasks({ includeReviewFilter: false });
      const pendingTasks = tasks.filter((task) => normalizeReviewDecision(readReview(task).decision) === "pending");
      if (!pendingTasks.length) return null;
      const selectedIndex = tasks.findIndex((task) => task.task_id === state.selectedTaskId);
      if (selectedIndex < 0) return pendingTasks[0];
      return pendingTasks.reduce((nearest, task) => {
        const distance = Math.abs(tasks.findIndex((item) => item.task_id === task.task_id) - selectedIndex);
        return distance < nearest.distance ? { task, distance } : nearest;
      }, { task: pendingTasks[0], distance: Infinity }).task;
    }

    function updateLocatePendingButton() {
      const button = $("#locatePendingButton");
      if (!button) return;
      const hasPendingTask = Boolean(findNearestPendingTask());
      button.disabled = !hasPendingTask;
      button.title = hasPendingTask ? "定位到未审核任务" : "当前筛选下没有未审核任务";
    }

    function showOverview() {
      state.detailTaskIds = [];
      state.viewMode = "overview";
      renderTaskList();
      renderMain();
      $("#main-content").scrollTop = 0;
    }

    function renderOverview() {
      const baseTasks = filteredTasks({ includeReviewFilter: false });
      const tasks = applyReviewFilter(baseTasks);
      if (!baseTasks.length) {
        $("#overviewView").innerHTML = `<div class="missing">没有匹配任务</div>`;
        return;
      }
      $("#overviewView").innerHTML = `
        <section class="overview-head">
          <div>
            <h2>任务总览</h2>
            <div class="subtle">${tasks.length} / ${baseTasks.length} 个任务，点击卡片查看详情</div>
          </div>
          <div class="overview-stats">
            ${renderOverviewStats(baseTasks)}
          </div>
        </section>
        ${tasks.length ? `
          <section class="overview-grid" aria-label="任务人工裁定总览">
            ${tasks.map(renderOverviewCard).join("")}
          </section>
        ` : `<div class="missing">当前人工裁定筛选下没有任务</div>`}
      `;
      $("#overviewView").querySelectorAll(".overview-card").forEach((card) => {
        card.addEventListener("click", () => selectTask(card.dataset.taskId));
      });
      $("#overviewView").querySelectorAll(".review-stat").forEach((button) => {
        button.addEventListener("click", () => toggleReviewFilter(button.dataset.reviewFilter));
      });
    }

    function renderOverviewCard(task) {
      const review = readReview(task);
      const note = String(review.note || "").trim();
      return `
        <button class="overview-card ${task.task_id === state.selectedTaskId ? "active" : ""}" type="button" data-task-id="${escapeAttr(task.task_id)}">
          <div class="overview-card-top">
            <code>${escapeHtml(task.task_id)}</code>
            <span class="task-tags">
              ${statusChip(task.status)}
              ${reviewChip(review.decision)}
            </span>
          </div>
          <div class="overview-card-meta">
            ${renderAgentChips(task.agents)}
            <span class="chip">${task.metrics.length} \u6761\u4fee\u6539</span>
            ${renderTaskDurationChip(task)}
          </div>
          <p class="overview-title">${escapeHtml(task.user_input || "")}</p>
          <div class="overview-note">${note ? `\u5907\u6ce8\uff1a${escapeHtml(note)}` : "\u65e0\u5907\u6ce8"}</div>
        </button>
      `;
    }

    function renderOverviewStats(tasks) {
      const counts = { pending: 0, pass: 0, question: 0, fail: 0 };
      for (const task of tasks) {
        const key = normalizeReviewDecision(readReview(task).decision);
        counts[key] += 1;
      }
      const total = tasks.length || 1;
      return [
        reviewStatButton("pending", reviewStatLabel("未审核", counts.pending, total)),
        reviewStatButton("pass", reviewStatLabel("通过", counts.pass, total)),
        reviewStatButton("question", reviewStatLabel("有疑问", counts.question, total)),
        reviewStatButton("fail", reviewStatLabel("未通过", counts.fail, total))
      ].join("");
    }

    function reviewStatLabel(label, count, total) {
      return `${label} ${count} / ${(count / total * 100).toFixed(1)}%`;
    }

    function reviewStatButton(filter, label) {
      const active = state.reviewFilter === filter;
      const value = filter === "pending" ? "" : filter;
      return `<button class="chip review-stat ${reviewClass(value)} ${active ? "active" : ""}" type="button" data-review-filter="${escapeAttr(filter)}" aria-pressed="${active}">${escapeHtml(label)}</button>`;
    }

    function toggleReviewFilter(filter) {
      state.reviewFilter = state.reviewFilter === filter ? "all" : filter;
      resetDetailTaskSnapshotForFilterChange();
      renderTaskList();
      renderMain();
    }

    function applyReviewFilter(tasks) {
      if (state.reviewFilter === "all") return tasks;
      return tasks.filter((task) => normalizeReviewDecision(readReview(task).decision) === state.reviewFilter);
    }
    function getTaskInstructionType(task) {
      const operators = state.requestOperatorByInput.get(normalizeTaskInput(task.user_input)) || [];
      return ANSWER_AGENTS.filter((agent) => operators.includes(agent))
        .map((agent) => agent[0].toUpperCase()).join("");
    }

    function filteredTasks(options = {}) {
      const includeReviewFilter = options.includeReviewFilter !== false;
      const includeAccuracyFilter = options.includeAccuracyFilter !== false;
      return state.taskModels.filter((task) => {
        if (state.statusFilter !== "all" && String(task.status) !== state.statusFilter) return false;
        if (state.instructionFilter !== "all" && getTaskInstructionType(task) !== state.instructionFilter) return false;
        if (includeAccuracyFilter && state.accuracyFailureFilter !== "all"
          && state.accuracyResults.get(task.task_id)?.[state.accuracyFailureFilter]?.decision !== "fail") return false;
        const review = readReview(task);
        if (includeReviewFilter && state.reviewFilter !== "all" && normalizeReviewDecision(review.decision) !== state.reviewFilter) return false;
        if (!state.search) return true;
        const haystack = [
          task.task_id,
          task.user_input,
          task.status,
          review.decision,
          review.note,
          ...task.agents.map((agent) => agent.name),
          ...task.metrics.map((metric) => `${metric.operation} ${metric.road_id} ${metric.internal_command}`)
        ].join(" ").toLowerCase();
        return haystack.includes(state.search);
      });
    }

    function renderDetail() {
      const task = state.taskModels.find((item) => item.task_id === state.selectedTaskId);
      if (!task) {
        $("#emptyState").hidden = false;
        $("#detailView").hidden = true;
        return;
      }
      $("#emptyState").hidden = true;
      $("#detailView").hidden = false;
      const review = readReview(task);
      const navigation = getTaskNavigation(task.task_id);
      const writableAnswerSteps = collectWritableAnswerSteps(task);

    function readJsonlTrace(text, sourceName = "agent_trace.jsonl") {
      const events = [];
      String(text || "").split(/\r?\n/).forEach((line, index) => {
        const stripped = line.trim();
        if (!stripped) return;
        let event;
        try {
          event = JSON.parse(stripped);
        } catch {
          throw new Error(`JSONL 第 ${index + 1} 行不是有效 JSON`);
        }
        if (!event || typeof event !== "object" || Array.isArray(event)) {
          throw new Error(`JSONL 第 ${index + 1} 行必须是对象`);
        }
        events.push(event);
      });
      if (!events.length) throw new Error("JSONL 文件没有可读取的记录");
      return {
        events,
        workbook: { sheets: traceEventsToSheets(events, sourceName) }
      };
    }

    function traceEventsToSheets(events, sourceName) {
      const latestStart = new Map();
      events.forEach((event, index) => {
        if (event.type !== "task" || event.row?.status !== "running") return;
        latestStart.set(traceTaskKey(event.row), index);
      });
      const filtered = events.filter((event, index) => {
        const start = latestStart.get(traceTaskKey(event.row || {}));
        return start === undefined || index >= start;
      });
      const stores = {
        task: new Map(),
        agent_step: new Map(),
        road_metric: new Map(),
        dsl_check: new Map(),
        llm_request: new Map(),
        manual_review: new Map()
      };
      const metadata = filtered.find((event) => event.type === "evaluation_metadata")?.row || {};
      const toolPlanCases = [];
      filtered.forEach((event, index) => {
        if (event.type === "tool_plan_case") {
          toolPlanCases.push(event.row || {});
          return;
        }
        const store = stores[event.type];
        if (!store || !event.row || typeof event.row !== "object") return;
        const key = traceEventKey(event.type, event.row, index);
        store.set(key, mergeTraceRows(store.get(key), event.row));
      });
      appendToolPlanCasesToStores(stores, toolPlanCases, metadata, sourceName);
      return {
        tasks: rowsFromObjects([...stores.task.values()]),
        agent_steps: rowsFromObjects([...stores.agent_step.values()]),
        road_metrics: rowsFromObjects([...stores.road_metric.values()]),
        dsl_checks: rowsFromObjects([...stores.dsl_check.values()]),
        llm_requests: rowsFromObjects([...stores.llm_request.values()]),
        manual_review: rowsFromObjects([...stores.manual_review.values()])
      };
    }

    function traceTaskKey(row) {
      return `${row?.run_id || ""}:${row?.task_id || ""}`;
    }

    function traceEventKey(type, row, index = 0) {
      if (type === "task") return traceTaskKey(row);
      if (type === "agent_step") return `${traceTaskKey(row)}:${row.step_id || ""}:${row.agent || ""}`;
      if (type === "road_metric") return `${traceTaskKey(row)}:${row.step_id || ""}:${row.metric_id || index}`;
      if (type === "dsl_check") return `${traceTaskKey(row)}:${row.step_id || ""}:${row.check_id || index}`;
      if (type === "llm_request") return `${traceTaskKey(row)}:${row.request_id || index}`;
      if (type === "manual_review") return traceTaskKey(row);
      return `${type}:${index}`;
    }

    function mergeTraceRows(current, update) {
      const merged = { ...(current || {}) };
      Object.entries(update || {}).forEach(([key, value]) => {
        if (value !== undefined && value !== null && value !== "") merged[key] = value;
      });
      return merged;
    }

    function appendToolPlanCasesToStores(stores, cases, metadata, sourceName) {
      const runId = metadata.run_id
        || String(sourceName || "dsl_tool_plan").replace(/\.(jsonl|xlsx)$/i, "");
      cases.forEach((record, index) => {
        const taskId = String(record.case_id || `dsl_eval_${index + 1}`);
        const status = record.status === "ok" ? "done" : record.status === "error" ? "error" : record.status || "unknown";
        const task = {
          run_id: runId,
          task_id: taskId,
          user_input: record.natural_language || "",
          status,
          evaluation_mode: "tool_plan_only",
          error: record.error || "",
          started_at: metadata.created_at || "",
          finished_at: metadata.created_at || ""
        };
        stores.task.set(traceTaskKey(task), task);
        const step = {
          run_id: runId,
          task_id: taskId,
          step_id: "1",
          agent: record.agent_type || "",
          operation: record.agent_type || "",
          input_text: record.natural_language || "",
          road_context_json: record.road_original_data ?? "",
          road_id_output_json: {
            source_case_id: record.source_case_id || "",
            source_row: record.source_row ?? "",
            reused_from: record.reused_from || ""
          },
          llm_output_json: record.planned_dsl ?? record.source_dsl ?? "",
          tool_call_json: record.llm_tool_calls ?? "",
          resolved_result_json: record.resolved_tool_calls ?? "",
          internal_command: Array.isArray(record.internal_commands)
            ? record.internal_commands.join("\n")
            : record.internal_commands || "",
          status: record.status || "",
          error: record.error || ""
        };
        stores.agent_step.set(traceEventKey("agent_step", step), step);
        if (record.llm_duration_ms !== undefined && record.llm_duration_ms !== null) {
          const request = {
            run_id: runId,
            task_id: taskId,
            step_id: "1",
            request_id: `${taskId}:tool_plan`,
            request_index: 1,
            agent: record.agent_type || "",
            operation: record.agent_type || "",
            request_kind: "tool_plan",
            model_name: metadata.model_name || "",
            status: record.status || "",
            duration_ms: record.llm_duration_ms,
            error: record.error || ""
          };
          stores.llm_request.set(traceEventKey("llm_request", request), request);
        }
      });
    }

    function normalizeLegacyTraceWorkbook(workbook, sourceName) {
      if ((workbook.sheets.tasks || []).length > 1) return workbook;
      const caseRows = sheetToObjects(workbook.sheets.Cases || workbook.sheets.cases || []);
      if (!caseRows.length) return workbook;
      const stores = {
        task: new Map(),
        agent_step: new Map(),
        road_metric: new Map(),
        dsl_check: new Map(),
        llm_request: new Map(),
        manual_review: new Map()
      };
      appendToolPlanCasesToStores(stores, caseRows, {}, sourceName);
      return {
        sheets: {
          ...workbook.sheets,
          tasks: rowsFromObjects([...stores.task.values()]),
          agent_steps: rowsFromObjects([...stores.agent_step.values()]),
          road_metrics: rowsFromObjects([]),
          dsl_checks: rowsFromObjects([]),
          llm_requests: rowsFromObjects([...stores.llm_request.values()]),
          manual_review: rowsFromObjects([])
        }
      };
    }

    function rowsFromObjects(objects) {
      if (!objects.length) return [];
      const headers = [];
      const seen = new Set();
      objects.forEach((row) => Object.keys(row || {}).forEach((key) => {
        if (seen.has(key)) return;
        seen.add(key);
        headers.push(key);
      }));
      return [headers, ...objects.map((row) => headers.map((header) => row?.[header] ?? ""))];
    }

    async function beginAnswerValueEdit(task, container) {
      const agent = String(container.dataset.agent || "").toLowerCase();

        const target = getStepAnswerCompareTarget(step, agent);
        const explicitIndex = Number(container.dataset.entryIndex);
        const roadContext = buildRoadComparisonContext(
          task,
          null,
          entries.map((entry) => entry.value)
        );
        const selectedIndex = Number.isInteger(explicitIndex) && explicitIndex >= 0
          ? clampAnswerIndex(explicitIndex, entries.length)
          : clampAnswerIndex(
            getStoredAnswerSelection(task, stepIndex, agent, scopeKey)
              ?? chooseClosestAnswerEntry(entries, target.output, roadContext),
            entries.length
          );
        setAnswerSelection(task, stepIndex, agent, selectedIndex, scopeKey);
        openInlineEditor(container, entries[selectedIndex]?.value || "", async (value) => {
          await saveAnswerValueEdit(task, stepIndex, agent, value, { selectedIndex, scopeKey });
        });

      }
    }

    function openInlineEditor(container, value, saveValue) {
      if (container.querySelector(".inline-editor")) return;
      const originalHtml = container.innerHTML;
      const originalValue = String(value ?? "");
      const editor = document.createElement("textarea");
      editor.className = "inline-editor";
      editor.value = originalValue;
      editor.setAttribute("aria-label", "编辑内容");
      editor.style.height = `${Math.max(54, container.getBoundingClientRect().height)}px`;
      container.replaceChildren(editor);
      let cancelled = false;
      let saving = false;

      const restore = () => {
        cancelled = true;
        container.innerHTML = originalHtml;
      };
      editor.addEventListener("input", () => editor.removeAttribute("aria-invalid"));
      editor.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        event.preventDefault();
        restore();
      });
      editor.addEventListener("blur", async () => {
        if (cancelled || saving) return;
        if (editor.value === originalValue) {
          restore();
          return;
        }
        saving = true;
        editor.disabled = true;
        try {
          await saveValue(editor.value);
          if (container.isConnected && container.contains(editor)) restore();
        } catch (error) {
          console.error(error);
          saving = false;
          editor.disabled = false;
          editor.setAttribute("aria-invalid", "true");
          editor.title = error.message || String(error);
          $("#saveMessage").textContent = `保存失败：${error.message || String(error)}`;
        }
      });
      editor.focus();
      editor.setSelectionRange(editor.value.length, editor.value.length);
    }

    async function saveRequestInputEdit(task, step, value) {
      const nextInput = String(value || "").trim();
      if (!nextInput) throw new Error("输入不能为空");
      const info = await getRequestInputCellInfo(task, { requireWritable: true });
      const normalizedNextInput = normalizeTaskInput(nextInput);
      const duplicateRows = state.requestInputRowIndexes.get(normalizedNextInput) || [];
      if (duplicateRows.some((rowIndex) => rowIndex !== info.rowIndex)) {
        throw new Error("请求数据库中已存在相同输入");
      }

      await requestDatabaseApi(`/api/cases/${encodeURIComponent(info.caseId)}`, {
        method: "PATCH",
        body: JSON.stringify({ input_text: nextInput })
      });
      info.row[info.inputIndex] = nextInput;

      task.user_input = nextInput;
      step.input_text = nextInput;
      updateTraceWorkbookInput(task, step, nextInput);
      setRequestOperatorSource({ workbook: state.requestOperatorWorkbook });
      notifyAccuracyDataChanged();
      renderTaskList();
      renderDetail();
      $("#saveMessage").textContent = `已更新 ${REQUEST_DATABASE_NAME}：${REQUEST_INPUT_COLUMN}，${new Date().toLocaleTimeString()}`;
    }

    function updateTraceWorkbookInput(task, step, value) {
      const updateRow = (sheetName, keys, values) => {
        const rows = state.workbook?.sheets?.[sheetName] || [];
        const headers = (rows[0] || []).map((cell) => String(cell || "").trim());
        const row = rows.slice(1).find((candidate) => Object.entries(keys).every(([key, expected]) => {
          const index = headers.indexOf(key);
          return index >= 0 && String(candidate[index] || "") === String(expected || "");
        }));
        if (!row) return;
        for (const [key, nextValue] of Object.entries(values)) {
          const index = headers.indexOf(key);
          if (index < 0) continue;
          while (row.length <= index) row.push("");
          row[index] = nextValue;
        }
      };
      updateRow("tasks", {
        run_id: task.run_id,
        task_id: task.task_id
      }, { user_input: value });
      updateRow("agent_steps", {
        run_id: step.run_id || task.run_id,
        task_id: task.task_id,
        step_id: step.step_id,
        agent: step.agent
      }, {
        input_text: value,
        updated_at: new Date().toISOString()
      });
    }

    async function saveAnswerValueEdit(task, stepIndex, agent, value, options = {}) {
      const text = String(value || "").trim();
      if (!text) throw new Error("如需删除答案，请使用清除按钮");
      let parsed;
      try {
        parsed = JSON.parse(text);
      } catch (error) {
        throw new Error("answer 必须是有效 JSON");
      }
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
        throw new Error("answer 顶层必须是 JSON 对象");
      }

      const formatted = JSON.stringify(parsed, null, 2);
      const info = await getRequestAnswerCellInfo(task, agent, { requireWritable: true });
      const entries = parseAnswerEntries(info.value);
      const selectedIndex = clampAnswerIndex(
        options.selectedIndex ?? getStoredAnswerSelection(task, stepIndex, agent, options.scopeKey),
        entries.length
      );
      const now = new Date().toISOString();
      const nextEntries = entries.length
        ? [...entries]
        : [{ ...makeAnswerEntry(formatted, "edit"), updated_at: now }];
      if (entries.length) {
        nextEntries[selectedIndex] = {
          ...entries[selectedIndex],
          value: formatted,
          mode: "edit",
          updated_at: now
        };
      }
      await writeRequestAnswerEntries(info, nextEntries);
      setAnswerSelection(task, stepIndex, agent, selectedIndex, options.scopeKey);
      await refreshAnswerAndToolReviewPanels(task);
    }

    async function clearCurrentAnswerEntry(task, button, agent) {
      const originalText = button.textContent;
      const stepIndex = Number(button.dataset.stepIndex);
      button.disabled = true;
      button.textContent = "清除中";
      try {
        const info = await getRequestAnswerCellInfo(task, agent, { requireWritable: true });
        const entries = parseAnswerEntries(info.value);
        const selectedIndex = clampAnswerIndex(
          getStoredAnswerSelection(task, stepIndex, agent),
          entries.length
        );
        const confirmText = entries.length > 1
          ? `清除当前展示的第 ${selectedIndex + 1} / ${entries.length} 个 ${agent} answer？`
          : `清空当前任务的 ${agent} answer？`;
        if (!confirm(confirmText)) {
          button.textContent = originalText;
          return;
        }

        const nextEntries = entries.length > 1
          ? entries.filter((_, index) => index !== selectedIndex)
          : [];
        await writeRequestAnswerEntries(info, nextEntries);
        if (nextEntries.length) {
          setAnswerSelection(task, stepIndex, agent, Math.min(selectedIndex, nextEntries.length - 1));
        } else {
          clearAnswerSelection(task, stepIndex, agent);
        }
        await refreshAnswerAndToolReviewPanels(task);
        button.textContent = "已清除";
        setTimeout(() => {
          button.textContent = originalText;
        }, 1200);
      } catch (error) {
        console.error(error);
        $("#saveMessage").textContent = `清除请求表失败：${error.message || String(error)}`;
        button.textContent = "清除失败";
        setTimeout(() => {
          button.textContent = originalText;
        }, 1600);
      } finally {
        button.disabled = false;
      }
    }

    async function handleClearAnswerButton(task, button) {
      const agent = String(button.dataset.agent || "").toLowerCase();
      await clearCurrentAnswerEntry(task, button, agent);
      return;
      if (!confirm(`清空当前任务的 ${agent} answer 中所有答案？`)) return;
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = "清除中";
      try {
        await setRequestAnswerEntries(task, agent, []);
        clearAnswerSelection(task, button.dataset.stepIndex, agent);
        await refreshAnswerAndToolReviewPanels(task);
        button.textContent = "已清除";
        setTimeout(() => {
          button.textContent = originalText;
        }, 1200);
      } catch (error) {
        console.error(error);
        $("#saveMessage").textContent = `清除请求表失败：${error.message || String(error)}`;
        button.textContent = "清除失败";
        setTimeout(() => {
          button.textContent = originalText;
        }, 1600);
      } finally {
        button.disabled = false;
      }
    }

    async function handleBulkAnswerButton(task, button, mode) {
      const steps = collectWritableAnswerSteps(task);
      if (!steps.length) {
        $("#saveMessage").textContent = "当前任务没有可写 answer";
        return;
      }
      const originalText = button.textContent;
      const bulkButtons = Array.from($("#detailView").querySelectorAll(".bulk-write-answer-btn, .bulk-append-answer-btn"));
      bulkButtons.forEach((item) => {
        item.disabled = true;
      });
      button.textContent = mode === "append" ? "追加中" : "写入中";
      try {
        for (const item of steps) {
          if (mode === "append") {
            await appendLlmOutputToRequestAnswer(task, item.step, item.agent, { stepIndex: item.stepIndex });
          } else {
            await writeLlmOutputToRequestAnswer(task, item.step, item.agent, { stepIndex: item.stepIndex });
          }
        }
        await refreshAnswerAndToolReviewPanels(task);
        button.textContent = mode === "append" ? "已追加" : "已写入";
        setTimeout(() => {
          button.textContent = originalText;
        }, 1200);
      } catch (error) {
        console.error(error);
        $("#saveMessage").textContent = `${mode === "append" ? "批量追加" : "批量写入"}请求表失败：${error.message || String(error)}`;
        button.textContent = mode === "append" ? "追加失败" : "写入失败";
        setTimeout(() => {
          button.textContent = originalText;
        }, 1600);
      } finally {
        bulkButtons.forEach((item) => {
          item.disabled = false;
        });
      }
    }

    function collectWritableAnswerSteps(task) {
      return task.steps
        .map((step, stepIndex) => ({ step, stepIndex, agent: normalizeStepAgent(step.agent || step.operation) }))
        .filter(({ step, agent }) => (
          ANSWER_AGENTS.includes(agent)
          && !(step.llm_output_json === undefined || step.llm_output_json === null || step.llm_output_json === "")
        ));
    }

    async function writeLlmOutputToRequestAnswer(task, step, agent, options = {}) {
      if (!ANSWER_AGENTS.includes(agent)) throw new Error(`不支持写入 ${agent || "unknown"} answer`);
      if (!step) throw new Error("未找到对应 step");
      const output = prettyJson(step.llm_output_json);
      if (!output) throw new Error("当前 step 没有 LLM 输出");
      const info = await getRequestAnswerCellInfo(task, agent, { requireWritable: true });
      const entries = parseAnswerEntries(info.value);
      const roadContext = buildRoadComparisonContext(
        task,
        null,
        entries.map((entry) => entry.value)
      );
      const selection = getStoredAnswerSelection(task, options.stepIndex, agent);
      const selectedIndex = clampAnswerIndex(
        selection ?? chooseClosestAnswerEntry(entries, output, roadContext),
        entries.length
      );
      const nextEntries = entries.length ? [...entries] : [makeAnswerEntry(output, "write")];
      nextEntries[selectedIndex] = makeAnswerEntry(output, "write");
      await writeRequestAnswerEntries(info, nextEntries);
      setAnswerSelection(task, options.stepIndex, agent, selectedIndex);
    }

    async function appendLlmOutputToRequestAnswer(task, step, agent, options = {}) {
      if (!ANSWER_AGENTS.includes(agent)) throw new Error(`不支持追加 ${agent || "unknown"} answer`);
      if (!step) throw new Error("未找到对应 step");
      const output = prettyJson(step.llm_output_json);
      if (!output) throw new Error("当前 step 没有 LLM 输出");
      const info = await getRequestAnswerCellInfo(task, agent, { requireWritable: true });
      const entries = parseAnswerEntries(info.value);
      entries.push(makeAnswerEntry(output, "append"));
      await writeRequestAnswerEntries(info, entries);
      if (options.stepIndex !== undefined) setAnswerSelection(task, options.stepIndex, agent, entries.length - 1);
    }

    async function setRequestAnswerCell(task, agent, value) {
      await setRequestAnswerEntries(task, agent, value ? [makeAnswerEntry(value, "write")] : []);
    }

    async function setRequestAnswerEntries(task, agent, entries) {
      const info = await getRequestAnswerCellInfo(task, agent, { requireWritable: true });
      await writeRequestAnswerEntries(info, entries);
    }

    async function writeRequestAnswerEntries(info, entries) {
      const storedEntries = entries.map((entry) => ({
        ...entry,
        value: answerEntryValueToStoredValue(entry.value)
      }));
      const result = await requestDatabaseApi(
        `/api/cases/${encodeURIComponent(info.caseId)}/dsl-answers/${encodeURIComponent(info.agent)}`,
        {
          method: "PUT",
          body: JSON.stringify({ entries: storedEntries })
        }
      );
      while (info.row.length <= info.answerIndex) info.row.push("");
      info.row[info.answerIndex] = serializeAnswerEntries(result.entries || []);
      notifyAccuracyDataChanged();
      const action = entries.length ? "写入" : "清除";
      $("#saveMessage").textContent = `已${action} ${REQUEST_DATABASE_NAME}：${info.answerColumn}，${new Date().toLocaleTimeString()}`;
    }

    async function getRequestAnswerCellInfo(task, agent, options = {}) {
      if (!ANSWER_AGENTS.includes(agent)) throw new Error(`不支持读取 ${agent || "unknown"} answer`);
      await ensureRequestOperatorWorkbookForAnswer(Boolean(options.requireWritable));
      const rows = state.requestOperatorWorkbook?.sheets?.[state.requestOperatorSheetName] || [];
      const headers = (rows[0] || []).map((cell) => String(cell || "").trim());
      const caseIdIndex = headers.indexOf(REQUEST_CASE_ID_COLUMN);
      const inputIndex = headers.indexOf(REQUEST_INPUT_COLUMN);
      const answerColumn = REQUEST_ANSWER_COLUMNS[agent];
      const answerIndex = headers.indexOf(answerColumn);
      if (caseIdIndex < 0) throw new Error(`请求数据库缺少 ${REQUEST_CASE_ID_COLUMN}`);
      if (inputIndex < 0) throw new Error(`请求表缺少 ${REQUEST_INPUT_COLUMN} 列`);
      if (answerIndex < 0) throw new Error(`请求表缺少 ${answerColumn} 列`);

      const input = normalizeTaskInput(task.user_input);
      const rowIndexes = state.requestInputRowIndexes.get(input) || [];
      if (!rowIndexes.length) throw new Error("请求表中未找到当前任务输入");
      if (rowIndexes.length > 1) throw new Error("请求表中当前任务输入不唯一");

      if (!rows[rowIndexes[0]]) rows[rowIndexes[0]] = [];
      const row = rows[rowIndexes[0]];
      return {
        row,
        caseId: String(row[caseIdIndex] || ""),
        agent,
        answerIndex,
        answerColumn,
        value: row[answerIndex] ?? ""
      };
    }

    async function getRequestInputCellInfo(task, options = {}) {
      await ensureRequestOperatorWorkbookForAnswer(Boolean(options.requireWritable));
      const rows = state.requestOperatorWorkbook?.sheets?.[state.requestOperatorSheetName] || [];
      const headers = (rows[0] || []).map((cell) => String(cell || "").trim());
      const caseIdIndex = headers.indexOf(REQUEST_CASE_ID_COLUMN);
      const inputIndex = headers.indexOf(REQUEST_INPUT_COLUMN);
      if (caseIdIndex < 0) throw new Error(`请求数据库缺少 ${REQUEST_CASE_ID_COLUMN}`);
      if (inputIndex < 0) throw new Error(`请求表缺少 ${REQUEST_INPUT_COLUMN} 列`);

      const input = normalizeTaskInput(task.user_input);
      const rowIndexes = state.requestInputRowIndexes.get(input) || [];
      if (!rowIndexes.length) throw new Error("请求表中未找到当前任务输入");
      if (rowIndexes.length > 1) throw new Error("请求表中当前任务输入不唯一");

      const rowIndex = rowIndexes[0];
      if (!rows[rowIndex]) rows[rowIndex] = [];
      return {
        row: rows[rowIndex],
        rowIndex,
        caseId: String(rows[rowIndex][caseIdIndex] || ""),
        inputIndex,
        value: rows[rowIndex][inputIndex] ?? ""
      };
    }

    async function ensureRequestOperatorWorkbookForAnswer(requireWritable = false) {
      await ensureRequestOperatorMap();
      if (!state.requestOperatorWorkbook) {
        throw new Error(`未读取到 ${REQUEST_DATABASE_NAME}，请通过本地 Viewer 服务打开页面`);
      }
    }

    async function refreshAnswerComparePanels(task) {
      const groups = Array.from($("#detailView").querySelectorAll(".answer-current-group"));
      await Promise.all(groups.map(async (container) => {
        const agent = String(container.dataset.agent || "").toLowerCase();
        const stepIndex = Number(container.dataset.stepIndex);
        const step = task.steps[stepIndex];
        container.innerHTML = `
          <div class="answer-current-item">
            <div class="answer-current-title">${escapeHtml(REQUEST_ANSWER_COLUMNS[agent] || agent)} 当前内容</div>
            <div class="answer-current-content" role="status">正在读取当前 answer...</div>
          </div>
        `;
        try {
          const info = await getRequestAnswerCellInfo(task, agent);
          if (state.selectedTaskId !== task.task_id) return;
          const entries = parseAnswerEntries(info.value);
          const compareGroups = getAnswerCompareGroups(step, agent, entries, task);
          container.innerHTML = compareGroups
            .map((group) => renderAnswerCompareGroup(task, stepIndex, agent, info.answerColumn, group))
            .join("");
        } catch (error) {
          if (state.selectedTaskId !== task.task_id) return;
          container.innerHTML = `
            <div class="answer-current-item">
              <div class="answer-current-title">${escapeHtml(REQUEST_ANSWER_COLUMNS[agent] || agent)} 读取失败</div>
              <div class="answer-current-content"><span class="answer-error">${escapeHtml(error.message || String(error))}</span></div>
            </div>
          `;
        }
      }));
    }

    async function refreshAnswerAndToolReviewPanels(task) {
      await refreshAnswerComparePanels(task);
      await refreshToolReviewPanels(task);
    }

    function toolReviewSelectionKey(task, stepIndex, agent, targetKey = "") {
      return `${task.run_id || "run"}:${task.task_id}:${stepIndex}:${agent}:${targetKey}`;
    }

    function getToolReviewSelection(task, stepIndex, agent, targetKey = "") {
      const key = toolReviewSelectionKey(task, stepIndex, agent, targetKey);
      if (!state.toolReviewSelectionByKey.has(key)) {
        state.toolReviewSelectionByKey.set(key, { dslAnswerId: null, toolAnswerId: null });
      }
      return state.toolReviewSelectionByKey.get(key);
    }

    async function refreshToolReviewPanels(task) {
      const token = ++state.toolReviewRefreshToken;
      const panels = Array.from($("#detailView").querySelectorAll(".tool-review-field"));
      await Promise.all(panels.map(async (container) => {
        const stepIndex = Number(container.dataset.stepIndex);
        const agent = String(container.dataset.agent || "").toLowerCase();
        const targetKey = String(container.dataset.targetKey || "");
        const rawStep = task.steps[stepIndex];
        const step = normalizeStepAgent(rawStep?.agent || rawStep?.operation) === "single"
          ? projectSingleStepForReview(rawStep, agent, container.dataset.roadId || "")
          : rawStep;
        if (!step || !ANSWER_AGENTS.includes(agent)) return;
        try {
          const caseInfo = await getRequestInputCellInfo(task);
          const payload = await requestDatabaseApi(
            `/api/cases/${encodeURIComponent(caseInfo.caseId)}/dsl-subtasks/${agent}`
          );
          if (token !== state.toolReviewRefreshToken || state.selectedTaskId !== task.task_id || !container.isConnected) return;
          const subtasks = Array.isArray(payload.subtasks) ? payload.subtasks : [];
          const roadContext = buildRoadComparisonContext(
            task,
            null,
            subtasks.map((subtask) => subtask.dsl)
          );
          const selection = getToolReviewSelection(task, stepIndex, agent, targetKey);
          const exactMatches = subtasks.filter((subtask) => (
            dslAnswersEqual(step.llm_output_json, subtask.dsl, roadContext)
          ));
          if (!subtasks.some((subtask) => subtask.dsl_answer_id === selection.dslAnswerId)) {
            selection.dslAnswerId = exactMatches.length === 1 ? exactMatches[0].dsl_answer_id : null;
            selection.toolAnswerId = null;
          }
          const selectedSubtask = subtasks.find((subtask) => subtask.dsl_answer_id === selection.dslAnswerId) || null;
          const toolAnswers = selectedSubtask?.tool_answers || [];
          if (!toolAnswers.some((answer) => answer.tool_answer_id === selection.toolAnswerId)) {
            const approved = toolAnswers.filter((answer) => answer.review_status === "approved");
            const approvedMatch = approved.find((answer) => (
              compareToolAnswer(step, task, agent, answer, roadContext).matches
            ));
            const closest = findClosestToolAnswer(
              step,
              task,
              agent,
              approved.length ? approved : toolAnswers,
              roadContext
            );
            selection.toolAnswerId = (approvedMatch || closest || {}).tool_answer_id || null;
          }
          const selectedAnswer = toolAnswers.find((answer) => answer.tool_answer_id === selection.toolAnswerId) || null;
          renderToolReviewPanel(
            container,
            task,
            step,
            stepIndex,
            agent,
            targetKey,
            subtasks,
            exactMatches,
            selectedSubtask,
            selectedAnswer,
            roadContext
          );
          bindToolReviewPanel(container, task, stepIndex, agent, targetKey);
        } catch (error) {
          if (token !== state.toolReviewRefreshToken || state.selectedTaskId !== task.task_id || !container.isConnected) return;
          const status = container.querySelector(".field-head .subtle");
          if (status) status.textContent = "工具答案读取失败";
          const standard = container.querySelector(".tool-review-standard");
          if (standard) standard.innerHTML = `
            <div class="answer-pane-title">工具调用标准答案</div>
            <div class="answer-error">${escapeHtml(error.message || String(error))}</div>
          `;
        }
      }));
    }

    function renderToolReviewPanel(container, task, step, stepIndex, agent, targetKey, subtasks, exactMatches, selectedSubtask, selectedAnswer, roadContext = null) {
      const selection = getToolReviewSelection(task, stepIndex, agent, targetKey);
      const toolAnswers = selectedSubtask?.tool_answers || [];
      const approved = toolAnswers.filter((answer) => answer.review_status === "approved");
      const approvedMatch = approved.find((answer) => (
        compareToolAnswer(step, task, agent, answer, roadContext).matches
      )) || null;
      const closestApproved = approvedMatch
        ? null
        : findClosestToolAnswer(step, task, agent, approved, roadContext);
      const closestCandidate = approved.length
        ? closestApproved
        : findClosestToolAnswer(step, task, agent, toolAnswers, roadContext);
      const selectedComparison = selectedAnswer
        ? compareToolAnswer(step, task, agent, selectedAnswer, roadContext)
        : null;
      const status = container.querySelector(".field-head .subtle");
      if (status) {
        status.textContent = approvedMatch
          ? `匹配 approved 候选 #${approvedMatch.variant_index}`
          : approved.length
            ? closestCandidate
              ? `无匹配；已显示差异最小的 approved #${closestCandidate.variant_index}`
              : "与 approved 候选不匹配"
            : closestCandidate
              ? `缺少 approved；已显示差异最小候选 #${closestCandidate.variant_index}`
              : "缺少 approved 工具答案基准";
      }
      const standard = container.querySelector(".tool-review-standard");
      if (!standard) return;
      const dslHint = exactMatches.length === 1
        ? `已精确关联 ${exactMatches[0].subtask_key}`
        : exactMatches.length > 1
          ? "存在多个精确 DSL，请人工选择"
          : "未找到精确 DSL，请人工选择";
      const selectedAnswerText = selectedAnswer
        ? formatToolEvidence({
            tool_calls: normalizeToolCallsForCompare(selectedAnswer.tool_calls, agent, roadContext),
            resolved_result: selectedAnswer.resolved_result,
            internal_commands: normalizeToolInternalCommandsForCompare(
              selectedAnswer.internal_commands,
              roadContext
            )
          })
        : "尚无候选工具答案";
      const selectedAnswerContent = selectedAnswer
        ? renderToolAnswerDifference(
            selectedAnswerText,
            step,
            task,
            agent,
            selectedAnswer,
            selectedComparison,
            roadContext
          )
        : escapeHtml(selectedAnswerText);
      const canCreate = Boolean(selectedSubtask) || !subtasks.length;
      const createTitle = selectedSubtask
        ? "写入工具答案并批准"
        : "写入 DSL 与工具答案并批准";
      standard.innerHTML = `
        <div class="answer-pane-title">工具调用标准答案</div>
        <div class="tool-review-controls">
          <select class="tool-dsl-select" aria-label="选择 DSL 子任务" ${subtasks.length ? "" : "disabled"}>
            <option value="">${subtasks.length ? "请选择 DSL 子任务" : "暂无 DSL 基准"}</option>
            ${subtasks.map((subtask) => `
              <option value="${subtask.dsl_answer_id}" ${subtask.dsl_answer_id === selection.dslAnswerId ? "selected" : ""}>
                ${escapeHtml(`${subtask.subtask_key} | ${subtask.road_id || "无 road_id"}`)}
              </option>
            `).join("")}
          </select>
          <select class="tool-answer-select" aria-label="选择工具答案" ${selectedSubtask ? "" : "disabled"}>
            <option value="">${toolAnswers.length ? "请选择候选" : "暂无候选"}</option>
            ${toolAnswers.map((answer) => `
              <option value="${answer.tool_answer_id}" ${answer.tool_answer_id === selection.toolAnswerId ? "selected" : ""}>
                ${escapeHtml(`#${answer.variant_index} | ${answer.review_status || "draft"}`)}
              </option>
            `).join("")}
          </select>
        </div>
        <div class="subtle">${escapeHtml(
          subtasks.length ? dslHint : "尚无 DSL 基准，可直接写入本次 DSL 与工具答案"
        )}</div>
        <div class="tool-review-match">${renderToolComparisonStatus(approved, approvedMatch, selectedAnswer, selectedComparison)}</div>
        <pre>${selectedAnswerContent}</pre>
        ${renderCurvePointDifference(step, task, agent, selectedAnswer)}
        <div class="tool-review-controls tool-review-actions">
          <button class="field-action" type="button" data-tool-action="create" title="${createTitle}" ${canCreate ? "" : "disabled"}>写入并批准</button>
          <button class="field-action" type="button" data-tool-action="overwrite" ${selectedAnswer ? "" : "disabled"}>覆盖并批准</button>
          <button class="field-action" type="button" data-tool-action="approve" ${selectedAnswer ? "" : "disabled"}>批准</button>
          <button class="field-action" type="button" data-tool-action="reject" ${selectedAnswer ? "" : "disabled"}>驳回</button>
          <button class="field-action clear-answer-btn" type="button" data-tool-action="delete" ${selectedAnswer ? "" : "disabled"}>删除</button>
        </div>
      `;
    }

    function renderToolComparisonStatus(approved, approvedMatch, selectedAnswer, selectedComparison) {
      if (selectedAnswer && selectedComparison) {
        if (selectedComparison.matches) {
          const approvedLabel = selectedAnswer.review_status === "approved" ? "approved" : "未批准";
          return reviewChip(
            selectedAnswer.review_status === "approved" ? "pass" : "fail",
            `候选 #${selectedAnswer.variant_index} 内容匹配（${approvedLabel}）`
          );
        }
        return reviewChip(
          "fail",
          `候选 #${selectedAnswer.variant_index} 不匹配`
        );
      }
      if (approvedMatch) return reviewChip("pass", `匹配 approved #${approvedMatch.variant_index}`);
      if (approved.length) return reviewChip("fail", `${approved.length} 个 approved 均不匹配`);
      if (!selectedAnswer) return reviewChip("fail", "缺少 approved 工具答案基准");
      const detail = selectedComparison?.summary || "当前候选未批准";
      return reviewChip("fail", detail);
    }

    function renderToolAnswerDifference(selectedAnswerText, step, task, agent, selectedAnswer, comparison, roadContext = null) {
      if (!comparison || comparison.matches) return escapeHtml(selectedAnswerText);
      const actualEvidence = {
        tool_calls: comparison.toolPlanMatches
          ? normalizeToolCallsForCompare(selectedAnswer.tool_calls, agent, roadContext)
          : normalizeToolCallsForCompare(step.tool_call_json, agent, roadContext),
        resolved_result: normalizeRoadFieldsForCompare(
          comparison.resolvedMatches
            ? selectedAnswer.resolved_result
            : traceResolvedResult(step, task, agent),
          roadContext
        ),
        internal_commands: comparison.commandMatches
          ? normalizeToolInternalCommandsForCompare(selectedAnswer.internal_commands, roadContext)
          : normalizeToolInternalCommandsForCompare(step.internal_command, roadContext)
      };
      return highlightAnswerDifference(
        selectedAnswerText,
        formatToolEvidence(actualEvidence),
        roadContext
      );
    }

    function bindToolReviewPanel(container, task, stepIndex, agent, targetKey) {
      const selection = getToolReviewSelection(task, stepIndex, agent, targetKey);
      container.querySelector(".tool-dsl-select")?.addEventListener("change", (event) => {
        selection.dslAnswerId = event.target.value ? Number(event.target.value) : null;
        selection.toolAnswerId = null;
        refreshToolReviewPanels(task);
      });
      container.querySelector(".tool-answer-select")?.addEventListener("change", (event) => {
        selection.toolAnswerId = event.target.value ? Number(event.target.value) : null;
        refreshToolReviewPanels(task);
      });
      container.querySelectorAll("[data-tool-action]").forEach((button) => {
        button.addEventListener("click", async () => {
          await handleToolReviewAction(task, stepIndex, agent, targetKey, button.dataset.toolAction, button);
        });
      });
    }

    async function handleToolReviewAction(task, stepIndex, agent, targetKey, action, button) {
      const rawStep = task.steps[stepIndex];
      const roadId = targetKey.startsWith(`${agent}:`) ? targetKey.slice(agent.length + 1) : "";
      const step = normalizeStepAgent(rawStep?.agent || rawStep?.operation) === "single"
        ? projectSingleStepForReview(rawStep, agent, roadId)
        : rawStep;
      const selection = getToolReviewSelection(task, stepIndex, agent, targetKey);
      const originalText = button.textContent;
      button.disabled = true;
      try {
        if (!step) throw new Error("未找到当前工具调用 step");
        if (action === "create" && !selection.dslAnswerId) {
          selection.dslAnswerId = await ensureToolReviewDslAnswer(task, step, agent);
        }
        if (action === "overwrite" && !selection.dslAnswerId) {
          throw new Error("请先选择 DSL 子任务");
        }
        if (action !== "create" && !selection.toolAnswerId) {
          throw new Error("请先选择工具答案候选");
        }
        if (action === "delete" && !window.confirm("确定删除当前工具答案候选吗？")) return;
        let result;
        if (action === "create") {
          result = await requestDatabaseApi(`/api/dsl-answers/${selection.dslAnswerId}/tool-call-answers`, {
            method: "POST",
            body: JSON.stringify(buildToolAnswerPayload(task, step, agent))
          });
          selection.toolAnswerId = result.answer.tool_answer_id;
          result = await ensureToolAnswerApproved(result);
        } else if (action === "overwrite") {
          result = await requestDatabaseApi(`/api/tool-call-answers/${selection.toolAnswerId}`, {
            method: "PUT",
            body: JSON.stringify(buildToolAnswerPayload(task, step, agent))
          });
          result = await ensureToolAnswerApproved(result);
        } else if (action === "approve" || action === "reject") {
          result = await requestDatabaseApi(`/api/tool-call-answers/${selection.toolAnswerId}`, {
            method: "PATCH",
            body: JSON.stringify({ review_status: action === "approve" ? "approved" : "rejected" })
          });
        } else if (action === "delete") {
          await requestDatabaseApi(`/api/tool-call-answers/${selection.toolAnswerId}`, { method: "DELETE" });
          selection.toolAnswerId = null;
        }
        $("#saveMessage").textContent = `工具答案已${action === "create" ? "写入并批准" : action === "overwrite" ? "覆盖并批准" : action === "approve" ? "批准" : action === "reject" ? "驳回" : "删除"}`;
        await refreshAnswerAndToolReviewPanels(task);
        notifyAccuracyDataChanged();
      } catch (error) {
        console.error(error);
        $("#saveMessage").textContent = `工具答案操作失败：${error.message || String(error)}`;
      } finally {
        if (button.isConnected) {
          button.disabled = false;
          button.textContent = originalText;
        }
      }
    }

    async function ensureToolReviewDslAnswer(task, step, agent) {
      const info = await getRequestAnswerCellInfo(task, agent, { requireWritable: true });
      const entries = parseAnswerEntries(info.value);
      if (entries.length) {
        throw new Error("当前已有 DSL 标准答案，请先人工选择对应子任务");
      }
      const target = getStepAnswerCompareTarget(step, agent);
      if (target.status !== "ok" || !target.output) {
        throw new Error(target.message || "当前 step 缺少可写入的 DSL 输出");
      }
      const entry = {
        ...makeAnswerEntry(target.output, "tool-review"),
        review_status: "approved"
      };
      await writeRequestAnswerEntries(info, [entry]);
      const payload = await requestDatabaseApi(
        `/api/cases/${encodeURIComponent(info.caseId)}/dsl-subtasks/${agent}`
      );
      const roadContext = buildRoadComparisonContext(
        task,
        null,
        (payload.subtasks || []).map((subtask) => subtask.dsl)
      );
      const exactMatches = (payload.subtasks || []).filter((subtask) => (
        dslAnswersEqual(step.llm_output_json, subtask.dsl, roadContext)
      ));
