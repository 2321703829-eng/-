<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent trace 审核查看器</title>
  <style>
    :root {
      --bg: oklch(96.5% 0.008 248);
      --panel: oklch(99.2% 0.004 248);
      --panel-2: oklch(94.2% 0.01 248);
      --text: oklch(22% 0.018 248);
      --muted: oklch(49% 0.022 248);
      --line: oklch(84% 0.012 248);
      --line-soft: oklch(90% 0.008 248);
      --accent: oklch(48% 0.085 205);
      --accent-soft: oklch(92% 0.035 205);
      --ok: oklch(50% 0.085 155);
      --ok-soft: oklch(92% 0.035 155);
      --warn: oklch(58% 0.085 78);
      --warn-soft: oklch(93% 0.04 78);
      --bad: oklch(51% 0.09 28);
      --bad-soft: oklch(93% 0.035 28);
      --width: oklch(48% 0.07 205);
      --slope: oklch(48% 0.07 145);
      --curve: oklch(50% 0.065 305);
      --radius: 8px;
      --shadow: 0 1px 3px rgba(31, 42, 55, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.55;
    }

    [hidden] {
      display: none !important;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      touch-action: manipulation;
    }

    .skip {
      position: absolute;
      left: 16px;
      top: -40px;
      z-index: 20;
      background: var(--text);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
    }

    .skip:focus {
      top: 16px;
    }

    .app {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(300px, 390px) minmax(0, 1fr);
      overflow: hidden;
    }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--line);
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .brand {
      padding: 22px 22px 16px;
      border-bottom: 1px solid var(--line-soft);
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: 0;
      font-weight: 680;
    }

    .subtle {
      color: var(--muted);
      font-size: 13px;
    }

    .upload {
      margin-top: 16px;
      display: grid;
      gap: 10px;
    }

    .file-panel {
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
      min-height: 78px;
      padding: 14px;
      display: grid;
      gap: 6px;
      transition: border-color 120ms ease, background-color 120ms ease, box-shadow 120ms ease;
    }

    body.is-file-drag-over .file-panel {
      border-color: var(--accent);
      background: color-mix(in oklch, var(--accent) 8%, var(--panel-2));
      box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 26%, transparent);
    }

    body.is-file-drag-over .file-panel .file-select-title {
      color: var(--accent);
    }

    .file-drop-overlay {
      position: fixed;
      inset: 12px;
      z-index: 200;
      display: grid;
      place-items: center;
      border: 2px dashed var(--accent);
      border-radius: var(--radius);
      background: color-mix(in oklch, var(--panel) 88%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 18%, transparent);
      pointer-events: none;
    }

    .file-drop-overlay-content {
      border: 1px solid color-mix(in oklch, var(--accent) 36%, var(--line));
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--accent);
      padding: 12px 16px;
      box-shadow: var(--shadow);
      font-weight: 700;
    }

    .file-select-title {
      width: max-content;
      max-width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 0;
      text-align: left;
      font-weight: 700;
      cursor: pointer;
    }

    .file-select-title:focus,
    .file-panel:focus-within {
      outline: 3px solid color-mix(in oklch, var(--accent) 20%, transparent);
      outline-offset: 2px;
    }

    .file-panel input {
      display: none;
    }

    #fileName {
      display: block;
      min-width: 0;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    .auto-review-btn {
      margin-top: 4px;
      width: 100%;
      border: 1px solid color-mix(in oklch, var(--accent) 35%, var(--line));
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--accent);
      min-height: 34px;
      padding: 7px 10px;
      cursor: pointer;
      transition-property: transform, opacity, background-color;
      transition-duration: 120ms;
    }

    .auto-review-btn:hover,
    .auto-review-btn:focus {
      background: var(--accent-soft);
      outline: 0;
    }

    .auto-review-btn:active {
      transform: scale(0.98);
    }

    .auto-review-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
    }

    .auto-review-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      background: color-mix(in oklch, var(--text) 34%, transparent);
      backdrop-filter: blur(2px);
    }

    .auto-review-panel {
      width: min(560px, 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 18px 48px rgba(31, 42, 55, 0.22);
      padding: 22px;
      display: grid;
      gap: 16px;
    }

    .auto-review-panel h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .auto-review-progress {
      display: grid;
      gap: 8px;
    }

    .auto-review-progress-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .auto-review-track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
    }

    .auto-review-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 160ms ease;
    }

    .auto-review-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .auto-review-stat {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: var(--panel-2);
      padding: 9px;
      min-width: 0;
    }

    .auto-review-stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .auto-review-stat strong {
      display: block;
      font-size: 18px;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .auto-review-actions {
      display: flex;
      justify-content: flex-end;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line-soft);
      flex: 0 0 auto;
    }

    .stat {
      background: var(--panel-2);
      border-radius: var(--radius);
      padding: 10px;
      min-height: 58px;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .accuracy-summary {
      position: sticky;
      top: 0;
      z-index: 25;
      width: min(270px, calc(100vw - 16px));
      margin: 0 0 14px auto;
      padding: 16px;
      background: color-mix(in oklch, var(--panel) 96%, var(--accent-soft));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 12px 28px rgba(31, 42, 55, 0.16);
    }

    .accuracy-summary.is-positioned {
      position: fixed;
      right: auto;
      margin: 0;
    }

    .accuracy-summary.is-dragging {
      box-shadow: 0 16px 34px rgba(31, 42, 55, 0.22);
    }

    .accuracy-card-head {
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr) 32px;
      align-items: center;
      gap: 8px;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .accuracy-summary.is-dragging .accuracy-card-head {
      cursor: grabbing;
    }

    .accuracy-drag-handle {
      color: var(--muted);
      font-size: 17px;
      line-height: 1;
    }

    .accuracy-card-copy {
      min-width: 0;
    }

    .accuracy-value {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .accuracy-card-title {
      display: block;
      font-size: 15px;
      line-height: 1.35;
    }

    .accuracy-scope {
      display: block;
      margin-top: 2px;
      font-size: 11px;
      line-height: 1.4;
    }

    .accuracy-refresh {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      transition: background-color 120ms, border-color 120ms;
    }

    .accuracy-refresh:hover {
      background: var(--accent-soft);
      border-color: color-mix(in oklch, var(--accent) 36%, var(--line));
    }

    .accuracy-refresh:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .accuracy-grid {
      display: grid;
      grid-template-columns: 1fr;
      margin-top: 12px;
      border-top: 1px solid var(--line-soft);
    }

    .accuracy-item {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 10px 4px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .accuracy-item:hover,
    .accuracy-item.active {
      background: var(--accent-soft);
    }

    .accuracy-item.active {
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .accuracy-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .accuracy-item + .accuracy-item {
      border-top: 1px solid var(--line-soft);
    }

    .accuracy-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .accuracy-label::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
    }

    .accuracy-item[data-stage="tool"] .accuracy-label::before {
      background: var(--ok);
    }

    .accuracy-value strong {
      display: block;
      margin-top: 0;
      font-size: 19px;
      white-space: nowrap;
      line-height: 1.4;
    }

    .accuracy-detail,
    .accuracy-message {
      display: block;
      margin-top: 2px;
      font-size: 11px;
    }

    .accuracy-message:empty {
      display: none;
    }

    @media (min-width: 981px) and (max-width: 1699px) {
      .accuracy-summary {
        position: fixed;
        top: 22px;
        right: 22px;
        margin: 0;
      }

      .overview-head,
      .task-head {
        margin-right: 290px;
      }

      .overview-grid {
        padding-top: 128px;
      }
    }

    @media (min-width: 1700px) {
      .accuracy-summary {
        position: fixed;
        top: 22px;
        right: 22px;
        width: 270px;
        margin: 0;
      }

      .overview,
      .detail {
        margin-left: 0;
        margin-right: 294px;
      }
    }

    .filters {
      padding: 14px 22px;
      border-bottom: 1px solid var(--line-soft);
      display: grid;
      gap: 10px;
      flex: 0 0 auto;
    }

    .filter-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .search-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .chip,
    .filter-btn {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      padding: 5px 9px;
      font-size: 12px;
      line-height: 1.2;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .filter-btn {
      cursor: pointer;
      min-height: 32px;
      transition-property: transform, background-color, color, border-color;
      transition-duration: 120ms;
    }

    .filter-btn:active {
      transform: scale(0.97);
    }

    .filter-btn.active {
      color: var(--text);
      border-color: color-mix(in oklch, var(--accent) 42%, var(--line));
      background: var(--accent-soft);
    }

    .search {
      flex: 1 1 auto;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 9px 10px;
      background: white;
      color: var(--text);
    }

    .locate-pending-btn {
      flex: 0 0 38px;
      width: 38px;
      min-height: 38px;
      border: 1px solid color-mix(in oklch, var(--accent) 35%, var(--line));
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--accent);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      transition-property: transform, opacity, background-color;
      transition-duration: 120ms;
    }

    .locate-pending-btn:hover,
    .locate-pending-btn:focus {
      background: var(--accent-soft);
      outline: 0;
    }

    .locate-pending-btn:active {
      transform: scale(0.96);
    }

    .locate-pending-btn:disabled {
      cursor: not-allowed;
      opacity: 0.42;
      transform: none;
    }

    .quick-select {
      position: relative;
      width: 100%;
    }

    .quick-select-trigger {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 9px 10px;
      background: white;
      color: var(--text);
      min-height: 42px;
      font-weight: 620;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition-property: border-color, background-color;
      transition-duration: 120ms;
    }

    .quick-select-trigger:disabled {
      color: var(--muted);
      cursor: not-allowed;
    }

    .quick-select-trigger:focus {
      outline: 3px solid color-mix(in oklch, var(--accent) 20%, transparent);
      outline-offset: 2px;
    }

    .quick-select-menu {
      position: absolute;
      z-index: 30;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      max-height: 260px;
      overflow: auto;
      padding: 6px;
      border: 1px solid color-mix(in oklch, var(--accent) 26%, var(--line));
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 12px 28px rgba(31, 42, 55, 0.18);
    }

    .quick-select-option {
      width: 100%;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      padding: 9px 10px;
      text-align: left;
      font-size: 13px;
      font-weight: 620;
      line-height: 1.35;
      cursor: pointer;
      word-break: break-word;
    }

    .quick-select-option:hover,
    .quick-select-option:focus {
      outline: 0;
      background: var(--accent-soft);
    }

    .action-btn {
      border: 1px solid color-mix(in oklch, var(--accent) 35%, var(--line));
      border-radius: var(--radius);
      background: var(--accent);
      color: white;
      min-height: 38px;
      padding: 8px 11px;
      cursor: pointer;
      transition-property: transform, opacity, background-color;
      transition-duration: 120ms;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .action-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .secondary-btn {
      background: var(--panel);
      color: var(--accent);
    }

    .task-list {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      padding: 10px;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .task-button {
      width: 100%;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 12px;
      cursor: pointer;
      transition-property: transform, background-color, border-color;
      transition-duration: 120ms;
    }

    .task-button:hover {
      background: var(--panel-2);
    }

    .task-button:active {
      transform: scale(0.99);
    }

    .task-button.active {
      border-color: color-mix(in oklch, var(--accent) 40%, var(--line));
      background: var(--accent-soft);
    }

    .task-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-variant-numeric: tabular-nums;
    }

    .task-tags {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .task-title {
      font-size: 14px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .main {
      padding: 22px;
      min-width: 0;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
    }

    .empty {
      min-height: calc(100vh - 44px);
      min-height: calc(100dvh - 44px);
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
    }

    .empty-inner {
      max-width: 460px;
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .detail {
      display: grid;
      gap: 14px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .overview {
      display: grid;
      gap: 14px;
      max-width: 1280px;
      margin: 0 auto;
    }

    .overview-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      box-shadow: 0 10px 24px rgba(31, 42, 55, 0.14);
    }

    .overview-head h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
      font-weight: 660;
    }

    .overview-stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .review-stat {
      cursor: pointer;
      transition-property: transform, border-color, background-color, color;
      transition-duration: 120ms;
    }

    .review-stat:active {
      transform: scale(0.97);
    }

    .review-stat.active {
      color: var(--text);
      border-color: color-mix(in oklch, var(--accent) 45%, var(--line));
      box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 18%, transparent);
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    .overview-card {
      width: 100%;
      min-height: 148px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      padding: 12px;
      text-align: left;
      cursor: pointer;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 8px;
      box-shadow: var(--shadow);
      transition-property: transform, background-color, border-color;
      transition-duration: 120ms;
    }

    .overview-card:hover {
      background: color-mix(in oklch, var(--panel) 65%, var(--panel-2));
      border-color: color-mix(in oklch, var(--accent) 35%, var(--line));
    }

    .overview-card:active {
      transform: scale(0.99);
    }

    .overview-card.active {
      border-color: color-mix(in oklch, var(--accent) 45%, var(--line));
      background: var(--accent-soft);
    }

    .overview-card-top,
    .overview-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .overview-card-meta {
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    .overview-title {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .overview-note {
      color: var(--muted);
      font-size: 12px;
      min-height: 18px;
      overflow: hidden;
      text-overflow: clip;
      white-space: nowrap;
    }

    .task-head,
    .section,
    .metric-card {
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .task-head {
      padding: 18px;
      display: grid;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 20;
      isolation: isolate;
      border: 1px solid var(--line-soft);
      background: var(--panel);
      box-shadow: 0 10px 24px rgba(31, 42, 55, 0.14);
    }

    .task-head::before {
      content: "";
      position: absolute;
      left: -1px;
      right: -1px;
      top: -26px;
      height: 26px;
      z-index: 0;
      border-radius: var(--radius) var(--radius) 0 0;
      background: transparent;
      pointer-events: auto;
    }

    .task-head > * {
      position: relative;
      z-index: 1;
    }

    .task-head h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: 0;
      font-weight: 660;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .head-meta,
    .metric-meta,
    .step-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .task-nav {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: auto;
    }

    .review {
      display: grid;
      grid-template-columns: minmax(180px, 240px) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .review select,
    .review textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
      color: var(--text);
      padding: 9px 10px;
    }

    .review textarea {
      min-height: 74px;
      resize: vertical;
    }

    .review-note-field {
      display: grid;
      gap: 6px;
    }

    .review-note-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .review-decision-field {
      display: grid;
      gap: 8px;
    }

    .review-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .review-option {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 7px 8px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.2;
      transition-property: transform, border-color, background-color, color, box-shadow;
      transition-duration: 120ms;
    }

    .review-option:hover,
    .review-option:focus {
      border-color: color-mix(in oklch, var(--accent) 38%, var(--line));
    }

    .review-option:active {
      transform: scale(0.97);
    }

    .review-option.active {
      font-weight: 650;
      border-color: color-mix(in oklch, var(--accent) 48%, var(--line));
      box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 18%, transparent);
    }

    .section {
      overflow: hidden;
    }

    .section-title {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 660;
    }

    .section-actions {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .section-body {
      padding: 14px 16px 16px;
    }

    .timeline {
      display: grid;
      gap: 10px;
    }

    .step {
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      overflow: hidden;
      background: color-mix(in oklch, var(--panel) 75%, var(--panel-2));
    }

    .step-summary {
      padding: 12px;
      display: grid;
      gap: 9px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .field {
      min-width: 0;
      border-top: 1px solid var(--line-soft);
      padding-top: 9px;
    }

    .field-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-bottom: 4px;
    }

    .field-head label {
      font-size: 12px;
      color: var(--muted);
    }

    .field-action {
      border: 1px solid color-mix(in oklch, var(--accent) 30%, var(--line));
      border-radius: 6px;
      background: white;
      color: var(--accent);
      min-height: 26px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.2;
    }

    .field-action:disabled {
      cursor: default;
      opacity: 0.6;
      pointer-events: none;
    }

    .field-actions {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      flex: 0 0 auto;
    }

    .field-action.clear-answer-btn {
      color: var(--bad);
      border-color: color-mix(in oklch, var(--bad) 28%, var(--line));
    }

    .field-action.append-answer-btn,
    .field-action.bulk-append-answer-btn {
      color: var(--ok);
      border-color: color-mix(in oklch, var(--ok) 28%, var(--line));
    }

    .answer-compare {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      align-items: stretch;
    }

    .tool-review-field {
      grid-column: 1 / -1;
    }

    .tool-review-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;
      max-height: 550px;
    }

    .tool-review-evidence,
    .tool-review-standard {
      display: grid;
      gap: 8px;
      padding: 8px;
      min-height: 360px;
      max-height: 550px;
      box-sizing: border-box;
    }

    .tool-review-evidence {
      grid-template-rows: 32px minmax(300px, 1fr);
      align-content: stretch;
    }

    .tool-review-evidence .answer-pane-title,
    .tool-review-standard .answer-pane-title {
      height: 32px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .tool-review-standard .answer-pane-title {
      flex: 0 0 32px;
    }

    .tool-review-standard {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tool-review-evidence pre,
    .tool-review-standard pre {
      margin: 0;
      max-height: 300px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
    }

    .tool-review-evidence pre {
      height: auto;
      max-height: none;
      min-height: 0;
    }

    .tool-review-standard pre {
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
    }

    .tool-review-controls {
      display: flex;
      gap: 6px;
      flex: 0 0 30px;
      height: 30px;
      flex-wrap: nowrap;
      align-items: center;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .tool-review-controls select {
      min-width: 0;
      max-width: 100%;
    }

    .tool-review-actions {
      flex-basis: 40px;
      height: 40px;
      align-items: flex-start;
      scrollbar-width: thin;
    }

    .tool-review-actions .field-action {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .tool-review-standard > .subtle {
      flex: 0 0 20px;
      height: 20px;
      line-height: 20px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .tool-review-match {
      display: flex;
      flex: 0 0 28px;
      height: 28px;
      align-items: center;
      overflow: hidden;
    }

    .tool-review-field > .field-head {
      height: 20px;
      overflow: hidden;
    }

    .tool-review-field > .field-head .subtle {
      height: 20px;
      line-height: 20px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .handler-result-field {
      grid-column: 1 / -1;
    }

    .handler-command-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    .handler-command-grid pre,
    .handler-execution-result pre {
      margin: 0;
      padding: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
    }

    .handler-execution-result {
      margin-top: 8px;
      border-top: 1px solid var(--line-soft);
    }

    .answer-pane {
      min-width: 0;
      border: 2px solid var(--line);
      border-radius: 4px;
      background: oklch(97.2% 0.005 248);
      overflow: hidden;
    }

    .answer-pane.source-pane {
      border-color: var(--accent);
    }

    .answer-pane.current-pane {
      border-color: var(--bad);
    }

    .answer-pane-title {
      padding: 6px 8px;
      color: var(--muted);
      font-size: 12px;
      border-bottom: 1px solid var(--line-soft);
      background: white;
    }

    .answer-current-list {
      display: grid;
      gap: 8px;
      padding: 8px;
    }

    .answer-current-group {
      display: grid;
      gap: 8px;
    }

    .answer-current-item {
      display: grid;
      gap: 4px;
    }

    .answer-current-title {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .answer-switcher {
      display: inline-block;
      width: max-content;
      max-width: 100%;
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: white;
      color: var(--text);
      font-size: 12px;
      padding: 2px 6px;
    }

    .answer-current-content {
      min-height: 54px;
      padding: 8px;
      border-radius: 4px;
      background: white;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
    }

    .inline-editable {
      cursor: text;
    }

    .inline-editable:hover {
      box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--accent) 35%, var(--line));
    }

    .inline-editable:has(.inline-editor) {
      padding: 0;
      overflow: visible;
      box-shadow: none;
    }

    .inline-editor {
      display: block;
      width: 100%;
      min-height: 54px;
      box-sizing: border-box;
      resize: vertical;
      border: 1px solid var(--accent);
      border-radius: 4px;
      background: white;
      color: var(--text);
      padding: 8px;
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    .inline-editor[aria-invalid="true"] {
      border-color: var(--bad);
      outline: 2px solid color-mix(in oklch, var(--bad) 18%, transparent);
    }

    .answer-error {
      color: var(--bad);
    }

    .answer-compare pre {
      height: auto;
      max-height: none;
      min-height: 54px;
      overflow: visible;
      border-radius: 0;
    }

    .answer-diff {
      background: var(--warn-soft);
      color: var(--warn);
      border-radius: 3px;
    }

    pre,
    code {
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      background: oklch(97.2% 0.005 248);
      border-radius: 6px;
      padding: 9px;
      max-height: 410px;
      overflow: auto;
    }

    .empty-field pre {
      color: var(--muted);
      background: transparent;
      border: 1px dashed var(--line-soft);
    }

    .metrics {
      display: grid;
      gap: 12px;
    }

    .metric-card {
      border: 1px solid var(--line-soft);
      box-shadow: none;
      overflow: hidden;
    }

    .metric-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line-soft);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .metric-body {
      padding: 14px;
      display: grid;
      gap: 14px;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .number-box {
      border-radius: var(--radius);
      background: var(--panel-2);
      padding: 10px;
      min-width: 0;
    }

    .number-box span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .number-box strong {
      font-size: 18px;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
      word-break: break-word;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--line-soft);
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      text-align: left;
      background: oklch(97.2% 0.005 248);
    }

    td.num,
    th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
    }

    .peak-table {
      min-width: 1060px;
      table-layout: fixed;
    }

    .peak-table th {
      white-space: nowrap;
    }

    .peak-table th,
    .peak-table td {
      min-width: 120px;
    }

    .peak-table th:first-child,
    .peak-table td:first-child {
      width: 64px;
      min-width: 64px;
    }

    .peak-table th:nth-child(4),
    .peak-table td:nth-child(4),
    .peak-table th:nth-child(7),
    .peak-table td:nth-child(7) {
      width: 190px;
      min-width: 190px;
    }

    .dsl-check-table {
      min-width: 1040px;
      table-layout: fixed;
    }

    .dsl-check-table th:nth-child(1),
    .dsl-check-table td:nth-child(1) {
      width: 70px;
    }

    .dsl-check-table th:nth-child(2),
    .dsl-check-table td:nth-child(2) {
      width: 70px;
    }

    .dsl-check-table th:nth-child(3),
    .dsl-check-table td:nth-child(3) {
      width: 120px;
    }

    .dsl-check-table th:nth-child(4),
    .dsl-check-table td:nth-child(4) {
      width: 390px;
    }

    .dsl-check-table th:nth-child(5),
    .dsl-check-table td:nth-child(5) {
      width: 390px;
    }

    .request-timing-summary {
      margin-bottom: 12px;
    }

    .request-timing-table {
      min-width: 980px;
    }

    .request-timing-table th,
    .request-timing-table td {
      white-space: nowrap;
    }

    .curve-wrap {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: start;
    }

    .curve-svg {
      width: 100%;
      min-height: 280px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      background: oklch(98.5% 0.004 248);
    }

    .curve-figure {
      display: grid;
      gap: 8px;
    }

    .curve-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .curve-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .curve-legend-line {
      width: 24px;
      border-top: 3px solid currentColor;
    }

    .curve-legend-line.before {
      color: oklch(48% 0.01 248);
      border-top-style: dashed;
    }

    .curve-legend-line.legacy {
      color: oklch(48% 0.085 205);
    }

    .curve-legend-line.agent {
      color: oklch(55% 0.2 28);
    }

    details {
      border-top: 1px solid var(--line-soft);
      padding-top: 10px;
    }

    details summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      min-height: 34px;
      display: flex;
      align-items: center;
    }

    .status-done {
      background: var(--ok-soft);
      color: var(--ok);
      border-color: color-mix(in oklch, var(--ok) 28%, var(--line));
    }

    .status-error {
      background: var(--bad-soft);
      color: var(--bad);
      border-color: color-mix(in oklch, var(--bad) 28%, var(--line));
    }

    .status-running {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: color-mix(in oklch, var(--warn) 28%, var(--line));
    }

    .review-pending {
      color: var(--muted);
      background: color-mix(in oklch, var(--panel-2) 80%, white);
      border-color: var(--line);
    }

    .review-pass {
      background: var(--ok-soft);
      color: var(--ok);
      border-color: color-mix(in oklch, var(--ok) 28%, var(--line));
    }

    .review-question {
      background: var(--warn-soft);
      color: var(--warn);
      border-color: color-mix(in oklch, var(--warn) 28%, var(--line));
    }

    .review-fail {
      background: var(--bad-soft);
      color: var(--bad);
      border-color: color-mix(in oklch, var(--bad) 28%, var(--line));
    }

    .agent-width {
      color: var(--width);
      background: color-mix(in oklch, var(--width) 11%, white);
      border-color: color-mix(in oklch, var(--width) 30%, var(--line));
    }

    .agent-slope {
      color: var(--slope);
      background: color-mix(in oklch, var(--slope) 11%, white);
      border-color: color-mix(in oklch, var(--slope) 30%, var(--line));
    }

    .agent-curve {
      color: var(--curve);
      background: color-mix(in oklch, var(--curve) 11%, white);
      border-color: color-mix(in oklch, var(--curve) 30%, var(--line));
    }

    .agent-inferred {
      border-style: dashed;
    }

    .missing {
      color: var(--muted);
      background: var(--panel-2);
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 13px;
    }

    .error-box {
      color: var(--bad);
      background: var(--bad-soft);
      border: 1px solid color-mix(in oklch, var(--bad) 28%, var(--line));
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 13px;
    }

    .error-box pre {
      margin-top: 6px;
      background: transparent;
      padding: 0;
      max-height: none;
    }

    .positive {
      color: var(--ok);
    }

    .negative {
      color: var(--bad);
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(320px, 45dvh) minmax(0, 1fr);
      }

      .sidebar {
        height: auto;
        min-height: 0;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .task-list {
        max-height: none;
      }

      .main {
        padding: 14px;
        height: auto;
      }

      .review,
      .curve-wrap {
        grid-template-columns: 1fr;
      }

      .overview-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .overview-stats {
        justify-content: flex-start;
      }
    }

    @media (max-width: 620px) {
      .accuracy-summary {
        top: 0;
        width: 100%;
      }

      .summary,
      .field-grid,
      .compare-grid,
      .answer-compare,
      .tool-review-grid,
      .handler-command-grid {
        grid-template-columns: 1fr;
      }

      .tool-review-grid {
        max-height: none;
      }

      .brand,
      .summary,
      .filters {
        padding-left: 14px;
        padding-right: 14px;
      }

      .task-head h2 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main-content">跳到详情</a>
  <div class="app">
    <aside class="sidebar" aria-label="任务列表">
      <div class="brand">
        <h1>Agent trace 审核查看器</h1>
        <div class="upload">
          <div class="file-panel" aria-label="可拖入 trace 文件">
            <button class="file-select-title" id="fileSelectButton" type="button">选择 trace 文件</button>
            <span class="subtle" id="fileName">尚未载入</span>
            <input id="fileInput" type="file" accept=".jsonl,application/x-ndjson,.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
            <button class="auto-review-btn" id="autoReviewButton" type="button" disabled>一键审核</button>
          </div>
          <button class="action-btn secondary-btn" id="selectDirectoryButton" type="button">选择数据目录</button>
          <div class="quick-select" id="xlsxQuickSelect">
            <button class="quick-select-trigger" id="xlsxQuickTrigger" type="button" disabled aria-haspopup="listbox" aria-expanded="false">选择目录后快速导入 JSONL</button>
            <div class="quick-select-menu" id="xlsxQuickMenu" role="listbox" hidden></div>
          </div>
          <div id="saveMessage" class="subtle">Trace 文件只读；审核结果直接保存到请求数据库。</div>
          <div id="loadMessage" class="subtle" role="status" aria-live="polite"></div>
        </div>
      </div>

      <div class="summary" id="summary">
        <div class="stat"><span class="subtle">任务</span><strong>0</strong></div>
        <div class="stat"><span class="subtle">修改记录</span><strong>0</strong></div>
        <div class="stat"><span class="subtle">完成</span><strong>0</strong></div>
        <div class="stat"><span class="subtle">异常</span><strong>0</strong></div>
      </div>

      <div class="filters">
        <div class="search-row">

  <script>
    const state = {

      selectedTaskId: null,

      requestOperatorByInput: new Map(),
      requestCaseIdByInput: new Map(),

      requestOperatorWorkbook: null,
      requestOperatorSheetName: "",

    const AGENTS = ["single", "width", "slope", "curve"];
    const ANSWER_AGENTS = ["width", "slope", "curve"];
    const INSTRUCTION_TYPES = ["W", "S", "C", "WS", "WC", "SC", "WSC"];

      road_context_manager: "道路上下文拆分",

    };

    const ACCURACY_POSITION_KEY = "agent-trace-viewer:accuracy-position";

    function compactFileName(name, limit = FILE_NAME_DISPLAY_LIMIT) {
      const value = String(name || "");
      if (value.length <= limit) return value;
      const extensionMatch = value.match(/(\.[^.]+)$/);
      const extension = extensionMatch ? extensionMatch[1] : "";
      const stem = extension ? value.slice(0, -extension.length) : value;
      const available = limit - extension.length - 3;
      if (available < 10) return `${value.slice(0, Math.max(0, limit - 3))}...`;
      const head = Math.ceil(available * 0.55);
      const tail = Math.floor(available * 0.45);
      return `${stem.slice(0, head)}...${stem.slice(-tail)}${extension}`;
    }

    function setDisplayFileName(selector, name) {
      const element = $(selector);
      const value = String(name || "");
      element.textContent = value || "尚未载入";
      element.title = value;
    }

    async function buildReviewMap(reviewRows, tasks, sourceName = "") {
      const map = new Map();
      const rows = sheetToObjects(reviewRows || []);
      for (const row of rows) {
        const taskId = String(row.task_id || "");
        if (!taskId) continue;
        map.set(taskId, {
          decision: row.decision || "",
          note: row.note || "",
          updated_at: row.review_updated_at || row.updated_at || "",
          review_source: isAutoReviewPayload(row) ? "auto" : "human",
          legacy: true
        });
      }
      try {
        const payload = await requestDatabaseApi("/api/case-reviews");
        for (const task of tasks) {
          try {
            const taskId = String(task.task_id || "");
            const caseInfo = await getRequestInputCellInfo(task);
            const review = (payload.reviews || []).find((item) => (
              String(item.case_id || "") === caseInfo.caseId
              && String(item.run_id || "") === taskReviewRunId(task, sourceName)
              && String(item.task_id || "") === taskId
            ));
            if (review) map.set(taskId, review);
          } catch (error) {
            console.warn(`任务 ${task.task_id || "unknown"} 未关联请求数据库审核记录。`, error);
          }
        }
      } catch (error) {
        console.warn("读取数据库审核结果失败，保留 trace 中的旧审核记录。", error);
      }
      return map;
    }

    $("#fileInput").addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      await loadTraceFile(file);
      event.target.value = "";
    });

    $("#fileSelectButton").addEventListener("click", () => {
      $("#fileInput").click();
    });

    const fileDropOverlay = $("#fileDropOverlay");
    let fileDragDepth = 0;

    document.addEventListener("dragenter", handlePageFileDragEnter);
    document.addEventListener("dragover", handlePageFileDragOver);
    document.addEventListener("dragleave", handlePageFileDragLeave);
    document.addEventListener("drop", handlePageFileDrop);
    window.addEventListener("blur", clearPageFileDragState);
    window.addEventListener("dragend", clearPageFileDragState);

    $("#selectDirectoryButton").addEventListener("click", async () => {
      await chooseTraceDirectory();
    });

    $("#xlsxQuickTrigger").addEventListener("click", () => {
      setQuickSelectOpen($("#xlsxQuickMenu").hidden);
    });

    $("#xlsxQuickMenu").addEventListener("click", async (event) => {
      const option = event.target.closest(".quick-select-option");
      if (!option) return;
      setQuickSelectOpen(false);
      await loadDirectoryTraceFile(Number(option.dataset.index));
    });

    document.addEventListener("click", (event) => {
      if ($("#xlsxQuickSelect").contains(event.target)) return;
      setQuickSelectOpen(false);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        setQuickSelectOpen(false);
        return;
      }
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      if (isTypingTarget(event.target)) return;
      const key = event.key.toLowerCase();
      if (key === "s") {
        if (markSelectedTaskReview("pass")) event.preventDefault();
        return;
      }
      if (key !== "a" && key !== "d") return;
      const direction = key === "a" ? "previous" : "next";
      const now = performance.now();
      if (event.repeat && now - lastTaskNavigationAt < TASK_NAVIGATION_REPEAT_INTERVAL_MS) {
        event.preventDefault();
        return;
      }
      if (navigateSelectedTask(direction)) {
        lastTaskNavigationAt = now;
        event.preventDefault();
      }
    });

    function hasDraggedFiles(event) {
      return Array.from(event.dataTransfer?.types || []).includes("Files");
    }

    function setPageFileDragActive(active) {
      document.body.classList.toggle("is-file-drag-over", active);
      fileDropOverlay.hidden = !active;
    }

    function clearPageFileDragState() {
      fileDragDepth = 0;
      setPageFileDragActive(false);
    }

    function handlePageFileDragEnter(event) {
      if (!hasDraggedFiles(event)) return;
      event.preventDefault();
      if (state.autoReviewRunning) {
        clearPageFileDragState();
        return;
      }
      fileDragDepth += 1;
      setPageFileDragActive(true);
    }

    function handlePageFileDragOver(event) {
      if (!hasDraggedFiles(event)) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = state.autoReviewRunning ? "none" : "copy";
    }

    function handlePageFileDragLeave(event) {
      if (!fileDragDepth) return;
      event.preventDefault();
      fileDragDepth = Math.max(0, fileDragDepth - 1);
      if (!fileDragDepth) setPageFileDragActive(false);
    }

    async function handlePageFileDrop(event) {
      if (!hasDraggedFiles(event) && !fileDragDepth) return;
      event.preventDefault();
      const files = event.dataTransfer?.files;
      clearPageFileDragState();
      if (state.autoReviewRunning) {
        $("#loadMessage").textContent = "自动审核进行中，完成后才能切换 trace 文件";
        return;
      }
      await loadDroppedTraceFile(files);
    }

    async function loadDroppedTraceFile(fileList) {
      const files = Array.from(fileList || []);
      if (files.length !== 1) {
        $("#loadMessage").textContent = files.length
          ? "一次只能载入一个 trace 文件"
          : "没有读取到拖入的文件";
        return;
      }
      if (!/\.(jsonl|xlsx)$/i.test(files[0].name)) {
        $("#loadMessage").textContent = "只支持 .jsonl 或旧版 .xlsx trace 文件";
        return;
      }
      await loadTraceFile(files[0]);
    }

    if (!window.showDirectoryPicker) {
      $("#selectDirectoryButton").disabled = true;
      $("#xlsxQuickTrigger").textContent = "当前浏览器不支持目录快速导入";
    } else {
      restoreTraceDirectory();
    }

    $("#autoReviewButton").addEventListener("click", async () => {
      await autoReviewPendingTasks();
    });

    });

    const accuracyDragHandle = $("#accuracyDragHandle");
    accuracyDragHandle.addEventListener("pointerdown", beginAccuracyDrag);
    accuracyDragHandle.addEventListener("pointermove", moveAccuracyCard);
    accuracyDragHandle.addEventListener("pointerup", finishAccuracyDrag);
    accuracyDragHandle.addEventListener("pointercancel", finishAccuracyDrag);
    accuracyDragHandle.addEventListener("lostpointercapture", finishAccuracyDrag);
    accuracyDragHandle.addEventListener("dblclick", (event) => {
      if (event.target.closest("button")) return;
      resetAccuracyCardPosition();
    });
    accuracyDragHandle.addEventListener("keydown", nudgeAccuracyCard);

    window.addEventListener("pointercancel", finishAccuracyDrag);

      if (state.accuracyPosition) applyAccuracyCardPosition(state.accuracyPosition, true);
    });

    if ("BroadcastChannel" in window) {
      state.accuracyChannel = new BroadcastChannel("agent-trace-viewer-answers");
      state.accuracyChannel.addEventListener("message", () => scheduleAccuracyRefresh());
    }

    });

    $("#locatePendingButton").addEventListener("click", () => {
      const task = findNearestPendingTask();
      if (task) selectTask(task.task_id);
    });

    $("#searchInput").addEventListener("input", (event) => {
      state.search = event.target.value.trim().toLowerCase();
      resetDetailTaskSnapshotForFilterChange();

      renderTaskList();
      renderMain();
