            <path d="${path(agent)}" fill="none" stroke="oklch(55% 0.2 28)" stroke-width="3"></path>
            ${b.map((point) => `<circle cx="${point[0]}" cy="${point[1]}" r="3.5" fill="oklch(48% 0.01 248)"></circle>`).join("")}
            ${legacy ? legacy.map((point) => `<circle cx="${point[0]}" cy="${point[1]}" r="3.5" fill="oklch(48% 0.085 205)"></circle>`).join("") : ""}
            ${agent.map((point, index) => `<circle cx="${point[0]}" cy="${point[1]}" r="4" fill="oklch(55% 0.2 28)"></circle><text x="${point[0] + 7}" y="${point[1] + 16}" font-size="12" fill="oklch(43% 0.18 28)">P${index}</text>`).join("")}
          </svg>
          <div class="curve-legend" aria-label="曲线图例">
            <span class="curve-legend-item"><span class="curve-legend-line before"></span>修改前</span>
            <span class="curve-legend-item"><span class="curve-legend-line legacy"></span>${legacy ? "旧 DSL 优化" : "旧 DSL 优化（未记录）"}</span>
            <span class="curve-legend-item"><span class="curve-legend-line agent"></span>Agent 自主调用</span>
          </div>
        </div>
      `;
    }

    function readReview(task) {
      if (state.reviewByTask.has(task.task_id)) return state.reviewByTask.get(task.task_id);
      return {};
    }

    function taskReviewRunId(task, sourceName = state.sourceName) {
      const recorded = String(task?.run_id || "").trim();
      if (recorded) return recorded;
      return String(sourceName || "trace").replace(/\.(jsonl|xlsx)$/i, "");
    }

    async function saveCurrentReview(task, options = {}) {
      const payload = {
        decision: $("#reviewDecision").value,
        note: $("#reviewNote").value,
        review_source: "human"
      };
      try {
        await setTaskReviewPayload(task, payload, options);
      } catch (error) {
        console.error(error);
        $("#saveMessage").textContent = `审核结果保存失败：${error.message || String(error)}`;
      }
    }

    async function setTaskReviewPayload(task, payload, options = {}) {
      const renderList = options.renderList === true;
      const updateTaskList = options.updateTaskList !== false;
      const normalized = normalizeTaskReviewPayload(task, payload);
      state.reviewByTask.set(task.task_id, normalized);
      if (renderList) renderTaskList();
      else if (updateTaskList) updateTaskListReviewChip(task);
      updateLocatePendingButton();
      updateAutoReviewButton();
      if (state.viewMode === "overview") renderOverview();
      const timerKey = `${taskReviewRunId(task)}:${task.task_id}`;
      const previousPending = state.reviewSaveTimers.get(timerKey);
      clearTimeout(previousPending?.timerId ?? previousPending);
      state.reviewSaveTimers.delete(timerKey);
      if (options.debounce) {
        const pending = { task, review: normalized, timerId: null, promise: null };
        pending.timerId = setTimeout(async () => {
          if (state.reviewSaveTimers.get(timerKey) !== pending) return;
          pending.promise = persistTaskReview(task, normalized);
          let saved = false;
          try {
            await pending.promise;
            saved = true;
          } catch (error) {
            pending.timerId = null;
            pending.promise = null;
            console.error(error);
            $("#saveMessage").textContent = `审核备注保存失败：${error.message || String(error)}`;
          } finally {
            if (saved && state.reviewSaveTimers.get(timerKey) === pending) {
              state.reviewSaveTimers.delete(timerKey);
            }
          }
        }, 500);
        state.reviewSaveTimers.set(timerKey, pending);
        return normalized;
      }
      return persistTaskReview(task, normalized);
    }

    async function flushPendingReviewSaves() {
      const pendingEntries = [...state.reviewSaveTimers.entries()];
      if (!pendingEntries.length) return;
      state.reviewSaveTimers.clear();
      const results = await Promise.allSettled(pendingEntries.map(async ([timerKey, pending]) => {
        clearTimeout(pending?.timerId ?? pending);
        try {
          if (pending?.promise) return await pending.promise;
          if (pending?.task && pending?.review) {
            return await persistTaskReview(pending.task, pending.review);
          }
        } catch (error) {
          if (!state.reviewSaveTimers.has(timerKey) && pending?.task && pending?.review) {
            state.reviewSaveTimers.set(timerKey, {
              task: pending.task,
              review: pending.review,
              timerId: null,
              promise: null
            });
          }
          throw error;
        }
      }));
      const failed = results.find((result) => result.status === "rejected");
      if (failed) {
        throw new Error(`切换文件前保存旧审核备注失败：${failed.reason?.message || String(failed.reason)}`);
      }
    }

    function normalizeTaskReviewPayload(task, payload) {
      return {
        ...payload,
        decision: normalizeReviewDecision(payload.decision),
        note: String(payload.note || ""),
        review_source: payload.review_source === "auto" ? "auto" : "human",
        run_id: taskReviewRunId(task),
        trace_source: state.sourceName || "",
        updated_at: new Date().toISOString()
      };
    }

    async function buildTaskReviewRequest(task, review, caseId = null) {
      const resolvedCaseId = caseId || (await getRequestInputCellInfo(task)).caseId;
      return {
        case_id: resolvedCaseId,
        run_id: review.run_id || taskReviewRunId(task),
        task_id: String(task.task_id || ""),
        decision: normalizeReviewDecision(review.decision),
        note: String(review.note || ""),
        review_source: review.review_source === "auto" ? "auto" : "human",
        trace_source: review.trace_source || state.sourceName || "",
        metadata: {
          task_status: task.status || "",
          agent_types: (task.agents || []).map((item) => item.name || item)
        }
      };
    }

    async function persistTaskReview(task, review) {
      const result = await requestDatabaseApi("/api/case-reviews", {
        method: "PUT",
        body: JSON.stringify(await buildTaskReviewRequest(task, review))
      });
      state.reviewByTask.set(task.task_id, result.review);
      updateTaskListReviewChip(task);
      $("#saveMessage").textContent = `审核结果已保存到 ${REQUEST_DATABASE_NAME}，${new Date().toLocaleTimeString()}`;
      return result.review;
    }

    function summarizeAccuracy(tasks, results, stage) {
      const counts = { pass: 0, fail: 0, question: 0, unavailable: 0 };
      for (const task of tasks) {
        const decision = results.get(task.task_id)?.[stage]?.decision || "question";
        counts[Object.hasOwn(counts, decision) ? decision : "question"] += 1;
      }
      const judged = counts.pass + counts.fail;
      return { ...counts, judged, rate: judged ? `${(counts.pass / judged * 100).toFixed(1)}%` : "--" };
    }

    function readAccuracyCardPosition() {
      try {
        const value = JSON.parse(localStorage.getItem(ACCURACY_POSITION_KEY));
        if (Number.isFinite(value?.x) && Number.isFinite(value?.y)) {
          return { x: value.x, y: value.y };
        }
      } catch (error) {
        console.warn("读取正确率卡片位置失败。", error);
      }
      return null;
    }

    function persistAccuracyCardPosition(position) {
      try {
        localStorage.setItem(ACCURACY_POSITION_KEY, JSON.stringify(position));
      } catch (error) {
        console.warn("保存正确率卡片位置失败。", error);
      }
    }

    function clampAccuracyCardPosition(position) {
      const card = $("#accuracySummary");
      const width = card.offsetWidth || 270;
      const height = card.offsetHeight || 200;
      return {
        x: Math.min(
          Math.max(ACCURACY_VIEWPORT_PADDING, Number(position.x) || 0),
          Math.max(ACCURACY_VIEWPORT_PADDING, window.innerWidth - width - ACCURACY_VIEWPORT_PADDING)
        ),
        y: Math.min(
          Math.max(ACCURACY_VIEWPORT_PADDING, Number(position.y) || 0),
          Math.max(ACCURACY_VIEWPORT_PADDING, window.innerHeight - height - ACCURACY_VIEWPORT_PADDING)
        )
      };
    }

    function applyAccuracyCardPosition(position, persist = false) {
      const card = $("#accuracySummary");
      if (!position || card.hidden) return;
      const next = clampAccuracyCardPosition(position);
      state.accuracyPosition = next;
      card.classList.add("is-positioned");
      card.style.left = `${next.x}px`;
      card.style.top = `${next.y}px`;
      if (persist) persistAccuracyCardPosition(next);
    }

    function resetAccuracyCardPosition() {
      state.accuracyPosition = null;
      state.accuracyDrag = null;
      const card = $("#accuracySummary");
      card.classList.remove("is-positioned", "is-dragging");
      card.style.removeProperty("left");
      card.style.removeProperty("top");
      try {
        localStorage.removeItem(ACCURACY_POSITION_KEY);
      } catch (error) {
        console.warn("清除正确率卡片位置失败。", error);
      }
    }

    function beginAccuracyDrag(event) {
      if (event.button !== 0 || event.target.closest("button")) return;
      const card = $("#accuracySummary");
      const rect = card.getBoundingClientRect();
      state.accuracyDrag = {
        pointerId: event.pointerId,
        offsetX: event.clientX - rect.left,
        offsetY: event.clientY - rect.top
      };
      card.classList.add("is-positioned", "is-dragging");
      card.style.left = `${rect.left}px`;
      card.style.top = `${rect.top}px`;
      event.currentTarget.setPointerCapture?.(event.pointerId);
      event.preventDefault();
    }

    function moveAccuracyCard(event) {
      const drag = state.accuracyDrag;
      if (!drag || drag.pointerId !== event.pointerId) return;
      applyAccuracyCardPosition({
        x: event.clientX - drag.offsetX,
        y: event.clientY - drag.offsetY
      });
      event.preventDefault();
    }

    function finishAccuracyDrag(event) {
      const drag = state.accuracyDrag;
      if (!drag || drag.pointerId !== event.pointerId) return;
      state.accuracyDrag = null;
      $("#accuracySummary").classList.remove("is-dragging");
      $("#accuracyDragHandle").releasePointerCapture?.(event.pointerId);
      if (state.accuracyPosition) persistAccuracyCardPosition(state.accuracyPosition);
    }

    function cancelAccuracyDrag() {
      if (!state.accuracyDrag) return;
      state.accuracyDrag = null;
      $("#accuracySummary").classList.remove("is-dragging");
      if (state.accuracyPosition) persistAccuracyCardPosition(state.accuracyPosition);
    }

    function nudgeAccuracyCard(event) {
      if (event.target.closest("button")) return;
      const directions = {
        ArrowLeft: [-1, 0],
        ArrowRight: [1, 0],
        ArrowUp: [0, -1],
        ArrowDown: [0, 1]
      };
      const direction = directions[event.key];
      if (!direction) return;
      const rect = $("#accuracySummary").getBoundingClientRect();
      const distance = event.shiftKey ? 1 : 10;
      applyAccuracyCardPosition({
        x: rect.left + direction[0] * distance,
        y: rect.top + direction[1] * distance
      }, true);
      event.preventDefault();
    }

    function renderAccuracySummary() {
      $("#accuracySummary").hidden = !state.taskModels.length;
      const tasks = filteredTasks({ includeReviewFilter: false, includeAccuracyFilter: false });
      $("#accuracyScope").textContent = `标准答案匹配 · 当前范围 ${tasks.length} / ${state.taskModels.length} 个任务`;
      $("#accuracyRefreshButton").disabled = state.accuracyLoading || state.autoReviewRunning;
      $("#accuracyStats").innerHTML = [["dsl", "DSL 正确率"], ["tool", "工具调用正确率"]].map(([stage, label]) => {
        const counts = summarizeAccuracy(tasks, state.accuracyResults, stage);
        const active = state.accuracyFailureFilter === stage;
        return `<button class="accuracy-item ${active ? "active" : ""}" type="button" data-stage="${stage}" aria-pressed="${active}" title="${active ? "取消错误筛选" : `筛选${stage === "dsl" ? " DSL" : "工具调用"}错误任务`}">
          <span class="accuracy-value"><span class="accuracy-label">${label}</span><strong>${counts.rate}</strong></span>
          <span class="subtle accuracy-detail">正确 ${counts.pass} / 已判定 ${counts.judged} · 待确认 ${counts.question}${counts.unavailable ? ` · 未记录 ${counts.unavailable}` : ""}</span>
        </button>`;
      }).join("");
      $("#accuracyStats").querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => toggleAccuracyFilter(button.dataset.stage));
      });
      $("#accuracyMessage").textContent = state.accuracyLoading ? "正在读取标准答案并统计..." : state.accuracyError;
      if (state.accuracyPosition) applyAccuracyCardPosition(state.accuracyPosition);
    }

    function scheduleAccuracyRefresh() {
      clearTimeout(state.accuracyRefreshTimer);
      state.accuracyRefreshToken += 1;
      state.accuracyResults.clear();
      state.accuracyLoading = true;
      renderAccuracySummary();
      state.accuracyRefreshTimer = setTimeout(() => { void refreshAccuracy(); }, 150);
    }

    function notifyAccuracyDataChanged() {
      scheduleAccuracyRefresh();
      state.accuracyChannel?.postMessage("answers-changed");
    }

    async function refreshAccuracy({ reloadRequestData = false, baselines = null } = {}) {
      clearTimeout(state.accuracyRefreshTimer);
      const token = ++state.accuracyRefreshToken;
      const traceToken = state.traceLoadToken;
      const isCurrent = () => token === state.accuracyRefreshToken && traceToken === state.traceLoadToken;
      state.accuracyLoading = true;
      state.accuracyError = "";
      state.accuracyResults.clear();
      renderAccuracySummary();
      try {
        if (reloadRequestData) {
          const source = await readRequestDatabase();
          if (!isCurrent()) return;
          if (!source) throw new Error("未连接请求数据库服务");
          setRequestOperatorSource(source);
        }
        const data = baselines || await loadAutoReviewBaselines(state.taskModels);
        if (!isCurrent()) return;
        const results = new Map();
        for (const task of state.taskModels) {
          results.set(task.task_id, await judgeTaskAccuracy(task, data));
          if (!isCurrent()) return;
        }
        state.accuracyResults = results;
        return results;
      } catch (error) {
        if (isCurrent()) state.accuracyError = `统计暂不可用：${error.message || String(error)}`;
      } finally {
        if (isCurrent()) {
          state.accuracyLoading = false;
          renderAccuracySummary();
          if (state.accuracyFailureFilter !== "all" || state.instructionFilter !== "all") {
            renderTaskList();
            if (state.viewMode === "overview") renderOverview();
          }
        }
      }
    }

    function traceRecordsToolStage(task) {
      return task.evaluation_mode === "tool_plan_only"
        || (state.workbook?.sheets?.agent_steps?.[0] || []).includes("tool_call_json")
        || [...state.steps, ...(task.steps || [])].some((step) => Object.hasOwn(step, "tool_call_json"))
        || (task.llmRequests || []).some((request) => ["tool_plan", "single_dsl_tool_plan"].includes(request.request_kind));
    }

    async function judgeTaskAccuracy(task, baselines) {
      const pending = { decision: "question", note: "任务尚未完成" };
      if (["running", "pending"].includes(String(task.status || "").toLowerCase())) {
        return { dsl: pending, tool: pending };
      }
      const judge = async (action) => {
        try {
          return await action();
        } catch (error) {
          return { decision: "question", note: error.message || String(error) };
        }
      };
      // Stage accuracy is independent of task execution status and human reviews.
      const dsl = task.evaluation_mode === "tool_plan_only"
        ? { decision: "unavailable", note: "工具评测中的 DSL 是给定输入" }
        : await judge(() => judgeTaskDslAnswers(task, baselines));
      const tool = traceRecordsToolStage(task)
        ? await judge(() => judgeTaskToolAnswers(task, baselines))
        : { decision: "unavailable", note: "旧 trace 未记录工具调用阶段" };
      return { dsl, tool };
    }

    function missingTaskAnswerTargets(task, baselines) {
      const roadContext = buildRoadComparisonContext(task, baselines);
      const caseId = getTaskCaseId(task, baselines);
      const caseAnswers = baselines?.cases[caseId] || {};
      const expectedAgents = unique([
        ...getRequestOperatorAgentsForTask(task),
        ...ANSWER_AGENTS.filter((agent) => caseAnswers[agent]?.length)
      ]);
      const outputsByAgent = new Map();
      for (const step of collectLogicalEvaluationSteps(task)) {
        for (const agent of resolveAutoReviewAnswerTargets(step, task)) {
          const target = getStepAnswerCompareTarget(step, agent);
          if (target.status === "missing" || !prettyJson(step.llm_output_json)) continue;
          if (!Array.isArray(parseMaybeJson(target.output)?.operations)) {
            outputsByAgent.set(agent, null);
            continue;
          }
          const roads = outputsByAgent.get(agent) || new Set();
          getAnswerScope(target.output).roadIds.forEach((road) => (
            roads.add(roadIdComparisonKey(road, roadContext))
          ));
          outputsByAgent.set(agent, roads);
        }
      }
      const missing = [];
      for (const agent of expectedAgents) {
        const actualRoads = outputsByAgent.get(agent);
        if (!outputsByAgent.has(agent)) {
          missing.push(agent);
          continue;
        }
        if (!actualRoads) continue;
        const expectedRoads = unique(preferAlignedAnswerCandidates(caseAnswers[agent] || [], roadContext)
          .flatMap((answer) => getAnswerScope(answer.dsl).roadIds)
          .map((road) => roadIdComparisonKey(road, roadContext)));
        for (const road of expectedRoads) {
          if (!actualRoads.has(road)) missing.push(`${agent}:${road}`);
        }
      }
      return missing;
    }

    async function loadAutoReviewBaselines(tasks) {
      const caseIdByTask = new Map();
      const errorsByTask = new Map();
      const caseIds = [];
      for (const task of tasks) {
        try {
          const caseInfo = await getRequestInputCellInfo(task);
          caseIdByTask.set(task.task_id, caseInfo.caseId);
          caseIds.push(caseInfo.caseId);
        } catch (error) {
          errorsByTask.set(task.task_id, error);
        }
      }
      if (!caseIds.length) return { cases: {}, caseIdByTask, errorsByTask };
      const payload = await requestDatabaseApi("/api/auto-review-baselines", {
        method: "POST",
        body: JSON.stringify({ case_ids: unique(caseIds) })
      });
      return { cases: payload.cases || {}, caseIdByTask, errorsByTask };
    }

    async function persistAutoReviewBatch(entries) {
      if (!entries.length) return [];
      const reviews = await Promise.all(entries.map(({ task, review, caseId }) => (
        buildTaskReviewRequest(task, review, caseId)
      )));
      const result = await requestDatabaseApi("/api/case-reviews/batch", {
        method: "PUT",
        body: JSON.stringify({ reviews })
      });
      for (const review of result.reviews || []) {
        state.reviewByTask.set(review.task_id, review);
      }
      return result.reviews || [];
    }

    function updateAutoReviewButton() {
      const button = $("#autoReviewButton");
      if (!button) return;
      const ready = Boolean(state.taskModels.length && state.requestOperatorWorkbook && !state.autoReviewRunning);
      button.disabled = !ready;
      button.title = state.autoReviewRunning ? "自动审核正在进行" : ready ? "自动审核未人工处理的任务" : "请先加载 trace，并通过本地服务连接请求数据库";
    }

    function hasManualReview(task) {
      const review = readReview(task);
      const hasReview = Boolean(String(review.decision || "").trim() || String(review.note || "").trim() || String(review.updated_at || "").trim());
      if (!hasReview) return false;
      if (review.review_source) return review.review_source === "human";
      return !isAutoReviewPayload(review);
    }

    function isAutoReviewPayload(review) {
      const note = String(review?.note || "").trim();
      return note.startsWith("\u81ea\u52a8\u5ba1\u6838\uff1a") || note.startsWith("\u81ea\u52a8\u5ba1\u6838:");
    }

    async function autoReviewPendingTasks() {
      const button = $("#autoReviewButton");
      if (!state.taskModels.length) {
        $("#saveMessage").textContent = "请先加载 trace 文件";
        return;
      }
      const originalText = button.textContent;
      const stats = { pass: 0, question: 0, fail: 0, skippedReviewed: 0, skippedNoAnswer: 0, skippedNoOutput: 0, errors: 0 };
      let processed = 0;
      const total = state.taskModels.length;
      state.autoReviewRunning = true;
      button.disabled = true;
      button.textContent = "审核中";
      showAutoReviewOverlay(total, stats);
      try {
        await ensureRequestOperatorWorkbookForAnswer(false);
        const autoReviewData = await loadAutoReviewBaselines(state.taskModels);
        const accuracyResults = await refreshAccuracy({ baselines: autoReviewData });
        const pendingReviews = [];
        for (const task of state.taskModels) {
          updateAutoReviewOverlay({ total, processed, currentTaskId: task.task_id, stats, done: false });
          if (hasManualReview(task)) {
            stats.skippedReviewed += 1;
            processed += 1;
            updateAutoReviewOverlay({ total, processed, currentTaskId: task.task_id, stats, done: false });
            continue;
          }
          let result;
          try {
            const baselineError = autoReviewData.errorsByTask.get(task.task_id);
            if (baselineError) throw baselineError;
            result = await judgeTaskByRequestAnswers(task, autoReviewData, accuracyResults?.get(task.task_id));
            if (["pass", "question", "fail"].includes(result.decision)) {
              pendingReviews.push({
                task,
                caseId: autoReviewData.caseIdByTask.get(task.task_id),
                review: normalizeTaskReviewPayload(task, {
                  decision: result.decision,
                  note: result.note,
                  review_source: "auto"
                })
              });
            }
          } catch (error) {
            console.error(error);
            stats.errors += 1;
            processed += 1;
            updateAutoReviewOverlay({ total, processed, currentTaskId: task.task_id, stats, done: false });
            continue;
          }
          if (["pass", "question", "fail"].includes(result.decision)) {
            stats[result.decision] += 1;
          } else if (result.reason === "no-output") {
            stats.skippedNoOutput += 1;
          } else {
            stats.skippedNoAnswer += 1;
          }
          processed += 1;
          updateAutoReviewOverlay({ total, processed, currentTaskId: task.task_id, stats, done: false });
        }
        updateAutoReviewOverlay({ total, processed, currentTaskId: "", stats, done: false, message: "正在批量保存审核结果" });
        await persistAutoReviewBatch(pendingReviews);
        renderSummary();
        renderTaskList();
        if (state.viewMode === "overview") renderOverview();
        const message = formatAutoReviewSummary(stats);
        $("#saveMessage").textContent = message;
        updateAutoReviewOverlay({ total, processed, currentTaskId: "", stats, done: true, message });
      } catch (error) {
        console.error(error);
        const message = "一键审核失败：" + (error.message || String(error));
        $("#saveMessage").textContent = message;
        updateAutoReviewOverlay({ total, processed, currentTaskId: "", stats, done: true, message, failed: true });
      } finally {
        state.autoReviewRunning = false;
        button.textContent = originalText;
        updateAutoReviewButton();
        renderAccuracySummary();
      }
    }

    function showAutoReviewOverlay(total, stats) {
      const overlay = $("#autoReviewOverlay");
      if (!overlay) return;
      overlay.hidden = false;
      $("#autoReviewCloseButton").hidden = true;
      updateAutoReviewOverlay({ total, processed: 0, currentTaskId: "", stats, done: false });
    }

    function hideAutoReviewOverlay() {
      const overlay = $("#autoReviewOverlay");
      if (overlay) overlay.hidden = true;
    }

    function updateAutoReviewOverlay({ total, processed, currentTaskId, stats, done, message = "", failed = false }) {
      const overlay = $("#autoReviewOverlay");
      if (!overlay) return;
      const safeTotal = Math.max(0, Number(total) || 0);
      const safeProcessed = Math.min(safeTotal, Math.max(0, Number(processed) || 0));
      const percent = safeTotal ? Math.round(safeProcessed / safeTotal * 100) : 0;
      $("#autoReviewMessage").textContent = message || (done ? "审核完成" : "正在自动审核未人工处理的任务");
      $("#autoReviewCurrentTask").textContent = currentTaskId ? `当前任务：${currentTaskId}` : (done ? (failed ? "审核失败" : "全部任务已处理") : "准备开始");
      $("#autoReviewProgressText").textContent = `${safeProcessed} / ${safeTotal}`;
      $("#autoReviewProgressFill").style.width = `${percent}%`;
      $("#autoReviewStats").innerHTML = renderAutoReviewStats(stats || {});
      $("#autoReviewCloseButton").hidden = !done;
    }

    function renderAutoReviewStats(stats) {
      const items = [
        ["通过", stats.pass || 0],
        ["有疑问", stats.question || 0],
        ["未通过", stats.fail || 0],
        ["人工跳过", stats.skippedReviewed || 0],
        ["无答案", stats.skippedNoAnswer || 0],
        ["无输出", stats.skippedNoOutput || 0],
        ["错误", stats.errors || 0]
      ];
      return items.map(([label, value]) => `
        <div class="auto-review-stat">
          <span>${escapeHtml(label)}</span>
          <strong>${escapeHtml(String(value))}</strong>
        </div>
      `).join("");
    }

    function formatAutoReviewSummary(stats) {
      return "一键审核完成：通过 " + stats.pass + "，有疑问 " + stats.question + "，未通过 " + stats.fail + "，已人工审核跳过 " + stats.skippedReviewed + "，无答案跳过 " + stats.skippedNoAnswer + "，无输出跳过 " + stats.skippedNoOutput + "，错误 " + stats.errors;
    }
    async function judgeTaskByRequestAnswers(task, autoReviewData, stageResults = null) {
      const taskStatus = String(task.status || "").toLowerCase();
      if (!['done', 'ok'].includes(taskStatus)) {
        return {
          decision: "fail",
          note: `自动审核：任务状态为 ${taskStatus || "unknown"}，未完成完整执行链路`
        };
      }
      const results = stageResults || await judgeTaskAccuracy(task, autoReviewData);
      const dslResult = results.dsl.decision === "unavailable"
        ? await judgeTaskDslAnswers(task, autoReviewData) : results.dsl;
      const toolResult = results.tool.decision === "unavailable"
        ? await judgeTaskToolAnswers(task, autoReviewData) : results.tool;
      if (dslResult.decision === "fail" || toolResult.decision === "fail") {
        const reasons = [];
        if (dslResult.decision === "fail") reasons.push(dslResult.note || "DSL 答案不匹配");
        if (toolResult.decision === "fail") reasons.push(toolResult.note || "工具调用答案不匹配");
        return { decision: "fail", note: `自动审核：${reasons.join("；")}` };
      }
      if (dslResult.decision === "pass" && toolResult.decision === "pass") {
        return {
          decision: "pass",
          note: "自动审核：全部 DSL 与全部工具调用均匹配数据库标准答案"
        };
      }
      const reasons = [];
      if (dslResult.decision !== "pass") reasons.push(dslResult.note || "DSL 缺少可用标准答案");
      if (toolResult.decision !== "pass") reasons.push(toolResult.note || "工具调用缺少 approved 标准答案");
      return {
        decision: "question",
        reason: "missing-baseline",
        note: `自动审核：${reasons.join("；")}`
      };
    }

    async function judgeTaskDslAnswers(task, autoReviewData = null) {
      const checks = collectTaskAnswerChecks(task);
      const missing = missingTaskAnswerTargets(task, autoReviewData);
      if (missing.length) return { decision: "fail", reason: "no-output", note: `缺少 DSL 子任务：${missing.join("、")}` };
      if (!checks.length) {
        return {
          decision: "fail",
          reason: "no-output",
          note: "没有可审核的 DSL 输出"
        };
      }
      let missingBaseline = false;
      let mismatch = false;
      for (const check of checks) {
        const parsed = parseMaybeJson(check.output);
        if (check.status !== "ok" || !Array.isArray(parsed?.operations) || !parsed.operations.length) {
          mismatch = true;
          continue;
        }
        let entries;
        if (autoReviewData) {
          const error = autoReviewData.errorsByTask.get(task.task_id);
          if (error) throw error;
          const caseId = autoReviewData.caseIdByTask.get(task.task_id);
          entries = (autoReviewData.cases[caseId]?.[check.agent] || []).map((answer) => ({ value: answer.dsl }));
        } else {
          const info = await getRequestAnswerCellInfo(task, check.agent);
          entries = parseAnswerEntries(info.value);
        }
        if (!entries.length) {
          missingBaseline = true;
          continue;
        }
        const roadContext = buildRoadComparisonContext(
          task,
          autoReviewData,
          entries.map((entry) => entry.value)
        );
        entries = preferAlignedAnswerCandidates(entries, roadContext, (entry) => entry.value);
        if (check.single) {
          const groups = buildSingleAgentAnswerGroups(
            check.sourceOutput,
            check.agent,
            entries,
            roadContext
          );
          if (!groups.length) {
            mismatch = true;
            continue;
          }
          for (const group of groups) {
            if (group.status !== "ok") {
              mismatch = true;
            } else if (!group.candidates.length) {
              missingBaseline = true;
            } else if (!group.candidates.some((candidate) => (
              normalizeAnswerForCompare(candidate.entry.value, roadContext)
                === normalizeAnswerForCompare(group.output, roadContext)
            ))) {
              mismatch = true;
            }
          }
          continue;
        }
        const output = normalizeAnswerForCompare(check.output, roadContext);
        const matched = entries.some((entry) => (
          normalizeAnswerForCompare(entry.value, roadContext) === output
        ));
        if (!matched) mismatch = true;
      }
      if (mismatch) {
        return {
          decision: "fail",
          note: "至少一个 DSL 输出与数据库标准答案不匹配"
        };
      }
      if (missingBaseline) {
        return {
          decision: "question",
          reason: "no-answer",
          note: "至少一个 DSL 子任务缺少标准答案"
        };
      }
      return { decision: "pass", note: "全部 DSL 输出匹配" };
    }

    async function judgeTaskToolAnswers(task, autoReviewData) {
      const missing = missingTaskAnswerTargets(task, autoReviewData);
      if (missing.length) return { decision: "fail", reason: "no-output", note: `缺少工具子任务：${missing.join("、")}` };
      const checks = collectLogicalEvaluationSteps(task)
        .flatMap((step) => {
          const agent = normalizeStepAgent(step.agent || step.operation);
          if (agent !== "single") return [{ step, agent }];
          return singleAgentReviewTargets(step, task).map((target) => ({
            agent: target.agent,
            step: projectSingleStepForReview(step, target.agent, target.roadId)
          }));
        })
        .filter(({ agent }) => ANSWER_AGENTS.includes(agent));
      if (!checks.length) {
        return {
          decision: "fail",
          reason: "no-output",
          note: "没有可关联的领域 Agent 工具调用步骤"
        };
      }
      const baselineError = autoReviewData.errorsByTask.get(task.task_id);
      if (baselineError) throw baselineError;
      const caseId = getTaskCaseId(task, autoReviewData);
      const caseBaselines = autoReviewData.cases[caseId] || {};
      const roadContext = buildRoadComparisonContext(task, autoReviewData);
      for (const check of checks) {
        if (!hasRecordedToolCalls(check.step.tool_call_json)) {
          return {
            decision: "fail",
            reason: "no-output",
            note: `${check.agent} 子任务没有实际工具调用输出`
          };
        }
        const calls = traceToolCalls(check.step.tool_call_json);
        if (calls.some((call) => !call.name.trim() || call.name === "__invalid__")) {
          return { decision: "fail", note: `${check.agent} 工具调用格式无效` };
        }
        const exactMatches = preferAlignedAnswerCandidates(caseBaselines[check.agent] || [], roadContext).filter((subtask) => (
          dslAnswersEqual(check.step.llm_output_json, subtask.dsl, roadContext)
        ));
        if (!exactMatches.length) {
          return {
            decision: "fail",
            note: `${check.agent} DSL 未关联到 approved 工具答案`
          };
        }
        const approved = exactMatches.flatMap((subtask) => subtask.tool_answers || [])
          .filter((answer) => answer.review_status === "approved");
        if (!approved.length) {
          return {
            decision: "fail",
            note: `${check.agent} 匹配的 DSL 标准答案均缺少 approved 工具答案`
          };
        }
        if (!approved.some((answer) => (
          compareToolAnswer(check.step, task, check.agent, answer, roadContext).matches
        ))) {
          return {
            decision: "fail",
            note: `${check.agent} 工具调用与所有 approved 候选均不匹配`
          };
        }
      }
      return { decision: "pass", note: "全部工具调用匹配 approved 候选" };
    }

    function hasRecordedToolCalls(value) {
      const parsed = parseMaybeJson(value);
      return Array.isArray(parsed) && parsed.length > 0;
    }

    function collectLogicalEvaluationSteps(task) {
      const logicalSteps = new Map();
      task.steps.forEach((step, stepIndex) => {
        const agent = normalizeStepAgent(step.agent || step.operation);
        if (![...ANSWER_AGENTS, "single"].includes(agent)) return;
        const logicalId = String(step.step_id ?? stepIndex);
        const key = `${agent}:${logicalId}`;
        const merged = logicalSteps.get(key) || { agent, step_id: logicalId };
        Object.entries(step).forEach(([field, value]) => {
          if (value !== undefined && value !== null && value !== "") merged[field] = value;
        });
        logicalSteps.set(key, merged);
      });
      return [...logicalSteps.values()];
    }

    function collectTaskAnswerChecks(task) {
      const checks = [];
      const seen = new Set();
      collectLogicalEvaluationSteps(task).forEach((step) => {
        for (const agent of resolveAutoReviewAnswerTargets(step, task)) {
          if (!ANSWER_AGENTS.includes(agent)) continue;
          const key = `${agent}:${step.step_id ?? "unknown"}`;
          if (seen.has(key)) continue;
          seen.add(key);
          const target = getStepAnswerCompareTarget(step, agent);
          checks.push({
            agent,
            output: target.output,
            status: target.status,
            message: target.message,
            single: normalizeStepAgent(step.agent || step.operation) === "single",
            sourceOutput: step.llm_output_json
          });
        }
      });
      return checks;
    }

    function singleAgentOutputForAnswerTarget(value, agent) {
      const target = singleAgentOperationsForAnswerTarget(value, agent);
      return {
        status: target.status,
        output: target.status === "invalid" ? "" : JSON.stringify({ operations: target.operations }, null, 2),
        message: target.message
      };
    }

    function singleAgentOperationsForAnswerTarget(value, agent) {
      const parsed = parseMaybeJson(value);
      const allOperations = Array.isArray(parsed?.dsl?.operations)
        ? parsed.dsl.operations
        : parsed?.operations;
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed) || !Array.isArray(allOperations)) {
        return {
          status: "invalid",
          operations: [],
          message: "single output missing dsl.operations array"
        };
      }
      const operations = allOperations.filter((operation) => String(operation?.operation || "").toLowerCase() === agent);
      if (!operations.length) {
        return {
          status: "missing",
          operations: [],
          message: `single output missing ${agent} operation`
        };
      }
      return {
        status: "ok",
        operations,
        message: ""
      };
    }

    function singleAgentReviewTargets(step, task = null) {
      const rawPlans = parseMaybeJson(step?.tool_call_json);
      const output = parseMaybeJson(step?.llm_output_json);
      const plans = Array.isArray(rawPlans)
        ? rawPlans
        : Array.isArray(output?.plans) ? output.plans : [];
      const operations = Array.isArray(output?.dsl?.operations)
        ? output.dsl.operations
        : Array.isArray(output?.operations) ? output.operations : [];
      const targets = [];
      const seen = new Set();
      const add = (agentValue, roadIdValue) => {
        const targetAgent = normalizeStepAgent(agentValue);
        if (!ANSWER_AGENTS.includes(targetAgent)) return;
        const roadId = normalizeSingleRoadId(roadIdValue);
        const key = `${targetAgent}:${roadId}`;
        if (seen.has(key)) return;
        seen.add(key);
        targets.push({ agent: targetAgent, roadId });
      };
      plans.forEach((plan) => add(plan?.agent, plan?.road_id));
      operations.forEach((operation) => add(operation?.operation, operation?.road_id));
      if (!targets.length) {
        resolveSingleAnswerTargets(step, task).forEach((targetAgent) => add(targetAgent, ""));
      }
      return targets;
    }

    function projectSingleStepForReview(step, agent, roadId = "") {
      const normalizedRoadId = normalizeSingleRoadId(roadId);
      const target = singleAgentOperationsForAnswerTarget(step?.llm_output_json, agent);
      const operations = target.operations.filter((operation) => (
        !normalizedRoadId || normalizeSingleRoadId(operation?.road_id) === normalizedRoadId
      ));
      const rawPlans = parseMaybeJson(step?.tool_call_json);
      const output = parseMaybeJson(step?.llm_output_json);
      const plans = Array.isArray(rawPlans)
        ? rawPlans
        : Array.isArray(output?.plans) ? output.plans : [];
      const calls = plans
        .filter((plan) => (
          normalizeStepAgent(plan?.agent) === agent
          && (!normalizedRoadId || normalizeSingleRoadId(plan?.road_id) === normalizedRoadId)
        ))
        .flatMap((plan) => Array.isArray(plan?.tool_calls) ? plan.tool_calls : []);
      const resolvedEntries = parseMaybeJson(step?.resolved_result_json);
      const resolvedEntry = Array.isArray(resolvedEntries)
        ? resolvedEntries.find((entry) => (
            normalizeStepAgent(entry?.agent) === agent
            && (!normalizedRoadId || normalizeSingleRoadId(entry?.road_id) === normalizedRoadId)
          ))
        : null;
      const filterCommands = (value) => traceInternalCommands(value).filter((command) => (
        commandMatchesSingleTarget(command, agent, normalizedRoadId)
      )).join("\n");
      const handlerResults = parseMaybeJson(step?.handler_result_json);
      const filteredHandlerResults = Array.isArray(handlerResults)
        ? handlerResults.filter((item) => commandMatchesSingleTarget(item?.command, agent, normalizedRoadId))
        : handlerResults;
      const label = normalizedRoadId ? `${agent} · ${normalizedRoadId}` : agent;
      return {
        ...step,
        agent,
        operation: agent,
        llm_output_json: JSON.stringify({ operations }),
        tool_call_json: JSON.stringify(calls),
        resolved_result_json: resolvedEntry ? JSON.stringify(resolvedEntry.resolved_result) : null,
        internal_command: filterCommands(step?.internal_command),
        reference_command: filterCommands(step?.reference_command),
        handler_result_json: Array.isArray(filteredHandlerResults) ? JSON.stringify(filteredHandlerResults) : filteredHandlerResults,
        single_review_road_id: normalizedRoadId,
        single_review_label: label
      };
    }

    function commandMatchesSingleTarget(command, agent, roadId = "") {
      const tokens = String(command || "").trim().split(/\s+/).filter(Boolean);
      if (String(tokens.shift() || "").toLowerCase() !== agent) return false;
      if (!roadId) return true;
      const idToken = tokens.find((token) => token.toLowerCase().startsWith("id="));
      return normalizeSingleRoadId(idToken ? idToken.slice(3) : "") === roadId;
    }

    function normalizeSingleRoadId(value) {
      const roadId = normalizeAnswerRoadId(value);
      if (!roadId) return "";
      return roadId.startsWith("road_") ? roadId : `road_${roadId}`;
    }

    function resolveAutoReviewAnswerTargets(step, task = null) {
      const agent = normalizeStepAgent(step.agent || step.operation);
      if (ANSWER_AGENTS.includes(agent)) return [agent];
      if (agent !== "single") return [];
      return resolveSingleAnswerTargets(step, task);
    }
    function statusChip(status) {
      const value = String(status || "").toLowerCase();
      const label = value || "unknown";
      const className = value === "done" || value === "ok" ? "status-done" : value === "error" ? "status-error" : value === "running" ? "status-running" : "";
      return `<span class="chip ${className}">${escapeHtml(label)}</span>`;
    }

    function normalizeReviewDecision(decision) {
      const value = String(decision || "").toLowerCase();
      return ["pass", "question", "fail"].includes(value) ? value : "pending";
    }

    function reviewClass(decision) {
      return `review-${normalizeReviewDecision(decision)}`;
    }

    function reviewChip(decision, labelOverride = null) {
      const value = normalizeReviewDecision(decision);
      const labels = {
        pending: "\u672a\u5ba1\u6838",
        pass: "\u901a\u8fc7",
        question: "\u6709\u7591\u95ee",
        fail: "\u672a\u901a\u8fc7"
      };
      const label = labelOverride || labels[value];
      return `<span class="chip ${reviewClass(decision)}">${escapeHtml(label)}</span>`;
    }

    function renderReviewDecisionButtons(decision) {
      const value = normalizeReviewDecision(decision);
      return [
        ["pass", "\u901a\u8fc7"],
        ["question", "\u6709\u7591\u95ee"],
        ["fail", "\u672a\u901a\u8fc7"]
      ].map(([option, label]) => {
        const active = value === option;
        return `<button class="review-option ${reviewClass(option)} ${active ? "active" : ""}" type="button" data-review-decision="${option}" aria-pressed="${active ? "true" : "false"}">${escapeHtml(label)}</button>`;
      }).join("");
    }

    function renderAgentChips(agents) {
      if (!agents.length) return `<span class="chip">未记录 Agent</span>`;
      return agents.map(agentChip).join("");
    }

    function agentChip(agent) {
      const name = String(agent?.name || agent || "").toLowerCase();
      const source = agent?.source || (agent?.recorded ? "recorded" : "inferred");
      const cls = AGENTS.includes(name) ? `agent-${name}` : "";
      const suffix = source === "recorded" ? "" : source === "request_table" ? " \u539f\u59cb\u8868" : source === "manager" ? " Manager" : " \u63a8\u65ad";
      return `<span class="chip ${cls} ${source === "recorded" ? "" : "agent-inferred"}">${escapeHtml(name || "unknown")}${suffix}</span>`;
    }

    function formatAgentType(agent) {
      const name = String(agent?.name || "").toLowerCase();
      if (!name) return "";
      if (agent.source === "manager") return `${name}(manager)`;
      if (agent.source === "inferred") return `${name}(inferred)`;
      return name;
    }

    function numberBox(label, value, unit, signValue = null) {
      const sign = signValue === null ? "" : signClass(signValue);
      return `<div class="number-box"><span>${escapeHtml(label)}</span><strong class="${sign}">${escapeHtml(formatNumber(value))} ${escapeHtml(unit || "")}</strong></div>`;
    }

    function curvatureRadius(curvature) {
      const value = Number(curvature);
      return Number.isFinite(value) && Math.abs(value) > 1e-12 ? 1 / Math.abs(value) : null;
    }

    function getCurveBeforePoints(before) {
      return normalizePoints(before?.initial_control_points || before?.curve_info?.control_points);
    }

    function getCurveAfterPoints(after) {
      return normalizePoints(after?.optimized_control_points);
    }

    function getLegacyCurvePoints(beforePoints, metric, task) {
      const metricStepId = String(metric?.step_id ?? "");
      const metricRoadId = String(metric?.road_id ?? "").replace(/^road_/, "");
      const curveSteps = (task?.steps || []).filter((step) => (
        ["curve", "single"].includes(normalizeStepAgent(step.agent || step.operation))
      ));
      const orderedSteps = [
        ...curveSteps.filter((step) => String(step.step_id ?? "") === metricStepId),
        ...curveSteps.filter((step) => String(step.step_id ?? "") !== metricStepId)
      ];
      for (const step of orderedSteps) {
        for (const command of traceInternalCommands(step.reference_command)) {
          const parsed = parseCurveCommand(command);
          if (!parsed) continue;
          const commandRoadId = String(parsed.id ?? "").replace(/^road_/, "");
          if (metricRoadId && commandRoadId && metricRoadId !== commandRoadId) continue;
          return applyCurveCommandToPoints(beforePoints, command);
        }
      }
      return null;
    }

    function parseCurveCommand(command) {
      const tokens = String(command || "").trim().split(/\s+/).filter(Boolean);
      if (String(tokens.shift() || "").toLowerCase() !== "curve") return null;
      const parameters = {};
      for (const token of tokens) {
        const separator = token.indexOf("=");
        if (separator <= 0) continue;
        parameters[token.slice(0, separator).toLowerCase()] = token.slice(separator + 1);
      }
      return parameters;
    }

    function applyCurveCommandToPoints(points, command) {
      const parameters = parseCurveCommand(command);
      const normalized = normalizePoints(points);
      if (!parameters || !normalized) return null;
      const [p0, p1, p2, p3] = normalized;
      const chord = distance(p0, p3);
      const originalL0 = distance(p0, p1);
      const originalL1 = distance(p2, p3);
      const originalH0 = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]);
      const originalH1 = Math.atan2(p3[1] - p2[1], p3[0] - p2[0]);
      let deltaH0 = numericCommandParameter(parameters.h0) * Math.PI / 180;
      let deltaH1 = numericCommandParameter(parameters.h1) * Math.PI / 180;
      const turnBefore = normalizeRadians(originalH1 - originalH0);
      const turnAfter = normalizeRadians(
        originalH1 + deltaH1 - originalH0 - deltaH0
      );
      if (turnBefore * turnAfter < 0) {
        deltaH0 = 0;
        deltaH1 = 0;
      }
      const requestedL0 = originalL0 + numericCommandParameter(parameters.v0) * chord;
      const requestedL1 = originalL1 + numericCommandParameter(parameters.v1) * chord;
      const adjustedL0 = originalL0 !== 0 && requestedL0 / originalL0 > 0
        ? requestedL0
        : originalL0 / 10;
      const adjustedL1 = originalL1 !== 0 && requestedL1 / originalL1 > 0
        ? requestedL1
        : originalL1 / 10;
      const h0 = originalH0 + deltaH0;
      const h1 = originalH1 + deltaH1;
      return [
        [...p0],
        [p0[0] + adjustedL0 * Math.cos(h0), p0[1] + adjustedL0 * Math.sin(h0)],
        [p3[0] - adjustedL1 * Math.cos(h1), p3[1] - adjustedL1 * Math.sin(h1)],
        [...p3]
      ];
    }

    function numericCommandParameter(value) {
      const parsed = Number(value ?? 0);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function normalizeRadians(value) {
      return Math.atan2(Math.sin(value), Math.cos(value));
    }

    function getCurvePeakContext(before, after, delta, metric, task) {
      const dsl = findCurveDsl(metric, task, before, after, delta);
      const currentShape = normalizeCurveShape(
        before?.current_shape ||
        before?.curve_info?.current_shape ||
        before?.curve_info?.shape ||
        after?.current_shape ||
        after?.curve_info?.current_shape
      );
      const targetShape = normalizeCurveShape(getCurveTargetShape(dsl));
      const effectiveShape = targetShape && targetShape !== "keep" ? targetShape : currentShape;
      const centroidActions = getCurveCentroidActions(dsl);
      const hasTwoDirectedShifts = centroidActions.every((action) => action !== "none");
      const oppositeCentroidShift = hasTwoDirectedShifts && centroidActions[0] !== centroidActions[1];
      const shouldSplit = effectiveShape === "s-shape" || oppositeCentroidShift;
      let reason = "整段";
      if (effectiveShape === "s-shape") {
        reason = "S-shape 按拐点";
      } else if (oppositeCentroidShift) {
        reason = "centroid_shift相反";
      } else if (hasTwoDirectedShifts) {
        reason = "centroid_shift同向";
      } else if (dsl) {
        reason = "centroid_shift缺省";
      } else {
        reason = "未找到Curve DSL";
      }
      return { dsl, shouldSplit, centroidActions, reason };
    }

    function findCurveDsl(metric, task, before, after, delta) {
      const sources = [delta, before, after, metric];
      for (const step of task?.steps || []) {
        const agent = String(step.agent || step.operation || "").toLowerCase();
        if (agent === "curve") {
          sources.push(parseMaybeJson(step.llm_output_json));
          sources.push(parseMaybeJson(step.handler_result_json));
          sources.push(parseMaybeJson(step.road_context_json));
        }
      }
      for (const step of task?.steps || []) {
        const agent = String(step.agent || step.operation || "").toLowerCase();
        if (agent !== "curve") {
          sources.push(parseMaybeJson(step.llm_output_json));
          sources.push(parseMaybeJson(step.handler_result_json));
        }
      }
      for (const source of sources) {
        const found = findCurveOperation(source);
        if (found) return found;
      }
      return null;
    }

    function findCurveOperation(value, seen = new Set()) {
      if (!value || typeof value !== "object") return null;
      if (seen.has(value)) return null;
      seen.add(value);
      if (Array.isArray(value)) {
        for (const item of value) {
          const found = findCurveOperation(item, seen);
          if (found) return found;
        }
        return null;
      }
      const operationName = String(value.operation || value.type_name || "").toLowerCase();
      const hasCurveIntent = Array.isArray(value.modification) || value.target_shape || value.shape;
      if (operationName === "curve" && hasCurveIntent) return value;
      if (value.target_shape && Array.isArray(value.modification)) return value;
      for (const key of ["operations", "commands", "result", "payload", "ai_input"]) {
        const found = findCurveOperation(value[key], seen);
        if (found) return found;
      }
      for (const child of Object.values(value)) {
        const found = findCurveOperation(child, seen);
        if (found) return found;
      }
      return null;
    }

    function getCurveTargetShape(dsl) {
      if (!dsl) return "";
      if (dsl.target_shape) return dsl.target_shape;
      if (typeof dsl.shape === "string") return dsl.shape;
      return dsl.shape?.target || "";
    }

    function normalizeCurveShape(shape) {
      const value = String(shape || "").trim().toLowerCase();
      if (value === "s-shape" || value === "s_shape" || value === "s") return "s-shape";
      if (value === "c-shape" || value === "c_shape" || value === "c") return "c-shape";
      if (value === "keep") return "keep";
      return "";
    }

    function getCurveCentroidActions(dsl) {
      const modifications = Array.isArray(dsl?.modification) ? dsl.modification : [];
      return [0, 1].map((index) => normalizeCentroidAction(
        modifications[index]?.centroid_shift?.change?.action
      ));
    }

    function normalizeCentroidAction(action) {
      const value = String(action || "none").toLowerCase();
      return ["none", "move_to_start", "move_to_end", "set"].includes(value) ? value : "none";
    }

    function normalizePoints(points) {
      if (!Array.isArray(points) || points.length !== 4) return null;
      const normalized = points.map((point) => Array.isArray(point) && point.length >= 2 ? [num(point[0]), num(point[1])] : null);
      return normalized.every(Boolean) ? normalized : null;
    }

    function bezierPoint(points, t) {
      const u = 1 - t;
      const b0 = u * u * u;
      const b1 = 3 * u * u * t;
      const b2 = 3 * u * t * t;
      const b3 = t * t * t;
      return [
        b0 * points[0][0] + b1 * points[1][0] + b2 * points[2][0] + b3 * points[3][0],
        b0 * points[0][1] + b1 * points[1][1] + b2 * points[2][1] + b3 * points[3][1]
      ];
    }

    function bezierFirstDerivative(points, t) {
      const u = 1 - t;
      return [
        3 * u * u * (points[1][0] - points[0][0]) +
          6 * u * t * (points[2][0] - points[1][0]) +
          3 * t * t * (points[3][0] - points[2][0]),
        3 * u * u * (points[1][1] - points[0][1]) +
          6 * u * t * (points[2][1] - points[1][1]) +
          3 * t * t * (points[3][1] - points[2][1])
      ];
    }

    function bezierSecondDerivative(points, t) {
      const u = 1 - t;
      const ax = points[2][0] - 2 * points[1][0] + points[0][0];
      const ay = points[2][1] - 2 * points[1][1] + points[0][1];
      const bx = points[3][0] - 2 * points[2][0] + points[1][0];
      const by = points[3][1] - 2 * points[2][1] + points[1][1];
      return [
        6 * u * ax + 6 * t * bx,
        6 * u * ay + 6 * t * by
      ];
    }

    function curvatureAt(points, t) {
      const first = bezierFirstDerivative(points, t);
      const second = bezierSecondDerivative(points, t);
      const numerator = Math.abs(first[0] * second[1] - first[1] * second[0]);
      const denominatorSquared = first[0] * first[0] + first[1] * first[1];
      if (denominatorSquared <= 1e-12) return 1e12;
      return numerator / (Math.pow(denominatorSquared, 1.5) + 1e-18);
    }

    function getCurvaturePeakSegments(points, peakContext) {
      const ranges = getCurvePeakSearchRanges(points, peakContext?.shouldSplit);
      return ranges.map((range) => findMaxAvgCurvatureSegment(points, range));
    }

    function getCurvePeakSearchRanges(points, shouldSplit) {
      if (!shouldSplit) return [[0, 1]];
      const inflection = getInflectionPointT(points);
      return [[0, inflection.t], [inflection.t, 1]];
    }

    function findMaxAvgCurvatureSegment(points, searchRange, samples = 501, fixedLength = 0.3) {
      const t0 = clamp(num(searchRange[0]), 0, 1);
      const t1 = clamp(num(searchRange[1]), 0, 1);
      if (t0 >= t1) {
        return { range: [t0, t1], centroid: bezierPoint(points, t0), avgCurvature: 0 };
      }
      const ts = [];
      const curvatures = [];
      const curvePoints = [];
      for (let i = 0; i < samples; i += 1) {
        const t = t0 + (t1 - t0) * i / (samples - 1);
        ts.push(t);
        curvatures.push(curvatureAt(points, t));
        curvePoints.push(bezierPoint(points, t));
      }
      const weights = curvatures.map((value) => value * value + 1e-9);
      const totalWeight = weights.reduce((sum, value) => sum + value, 0);
      const centroid = [
        curvePoints.reduce((sum, point, index) => sum + point[0] * weights[index], 0) / totalWeight,
        curvePoints.reduce((sum, point, index) => sum + point[1] * weights[index], 0) / totalWeight
      ];
      const rangeSize = t1 - t0;
      if (rangeSize <= fixedLength + 1e-12) {
        const avgCurvature = trapezoidAverage(curvatures, ts, rangeSize);
        return { range: [t0, t1], centroid, avgCurvature };
      }
      const windowSize = Math.max(2, Math.round(fixedLength * (samples - 1) / rangeSize));
      let bestStart = 0;
      let bestAvg = -Infinity;
      let windowSum = curvatures.slice(0, windowSize).reduce((sum, value) => sum + value, 0);
      for (let start = 0; start <= curvatures.length - windowSize; start += 1) {
        if (start > 0) {
          windowSum += curvatures[start + windowSize - 1] - curvatures[start - 1];
        }
        const avg = windowSum / windowSize;
        if (avg > bestAvg) {
          bestAvg = avg;
          bestStart = start;
        }
      }
      const endIndex = bestStart + windowSize - 1;
      return { range: [ts[bestStart], ts[endIndex]], centroid, avgCurvature: bestAvg };
    }

    function getInflectionPointT(points) {
      const p0 = points[0];
      const p1 = points[1];
      const p2 = points[2];
      const p3 = points[3];
      const aVec = [p1[0] - p0[0], p1[1] - p0[1]];
      const bVec = [p2[0] - p1[0], p2[1] - p1[1]];
      const cVec = [p3[0] - p2[0], p3[1] - p2[1]];
      const crossAb = cross2d(aVec, bVec);
      const crossBc = cross2d(bVec, cVec);
      const crossAc = cross2d(aVec, cVec);
      const a = crossAb + crossBc - crossAc;
      const b = crossAc - 2 * crossAb;
      const c = crossAb;
      const epsilon = 1e-9;
      const values = [];
      if (Math.abs(a) < epsilon) {
        if (Math.abs(b) > epsilon) {
          const t = -c / b;
          if (t > 0 && t < 1) values.push(t);
        }
      } else {
        const discriminant = b * b - 4 * a * c;
        if (discriminant >= 0) {
          const root = Math.sqrt(discriminant);
          const t1 = (-b + root) / (2 * a);
          const t2 = (-b - root) / (2 * a);
          if (epsilon < t1 && t1 < 1 - epsilon) values.push(t1);
          if (epsilon < t2 && t2 < 1 - epsilon) values.push(t2);
        }
      }
      if (!values.length) {
        let p1Index = 0;
        let p2Index = 0;
        let p1Best = Infinity;
        let p2Best = Infinity;
        const sampleCount = 500;
        for (let index = 0; index < sampleCount; index += 1) {
          const t = index / (sampleCount - 1);
          const point = bezierPoint(points, t);
          const p1Distance = squaredDistance(point, p1);
          const p2Distance = squaredDistance(point, p2);
          if (p1Distance < p1Best) {
            p1Best = p1Distance;
            p1Index = index;
          }
          if (p2Distance < p2Best) {
            p2Best = p2Distance;
            p2Index = index;
          }
        }
        const avgT = ((p1Index / (sampleCount - 1)) + (p2Index / (sampleCount - 1))) / 2;
        return { hasInflection: false, t: roundTo(avgT, 5) };
      }
      return { hasInflection: true, t: roundTo(Math.min(...values), 5) };
    }

    function cross2d(a, b) {
      return a[0] * b[1] - a[1] * b[0];
    }

    function trapezoidAverage(values, ts, rangeSize) {
      if (values.length < 2) return values[0] || 0;
      let area = 0;
      for (let i = 1; i < values.length; i += 1) {
        area += (values[i - 1] + values[i]) * 0.5 * (ts[i] - ts[i - 1]);
      }
      return area / (rangeSize + 1e-18);
    }

    function clamp(value, lower, upper) {
      return Math.max(lower, Math.min(upper, value));
    }

    function roundTo(value, digits) {
      const scale = 10 ** digits;
      return Math.round(value * scale) / scale;
    }

    function approximateBezierLength(points) {
      let length = 0;
      let previous = bezierPoint(points, 0);
      for (let i = 1; i <= 120; i += 1) {
        const current = bezierPoint(points, i / 120);
        length += distance(previous, current);
        previous = current;
      }
      return length;
    }

    function distance(a, b) {
      return Math.hypot(num(a[0]) - num(b[0]), num(a[1]) - num(b[1]));
    }

    function squaredDistance(a, b) {
      const dx = num(a[0]) - num(b[0]);
      const dy = num(a[1]) - num(b[1]);
      return dx * dx + dy * dy;
    }

    function formatPoint(point) {
      return `(${formatNumber(point[0])}, ${formatNumber(point[1])})`;
    }

    function formatRange(range) {
      return `[${formatNumber(range[0])}, ${formatNumber(range[1])}]`;
    }

    function groupBy(items, keyFn) {
      const map = new Map();
      for (const item of items) {
        const key = keyFn(item);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(item);
      }
      return map;
    }

    function sortByStep(rows) {
      return [...rows].sort((a, b) => num(a.step_id) - num(b.step_id));
    }

    function sortDslChecks(rows) {
      return [...rows].sort((a, b) => (
        num(a.step_id) - num(b.step_id)
        || num(a.attempt) - num(b.attempt)
      ));
    }

    function sortLlmRequests(rows) {
      return [...rows].sort((a, b) => (
        String(a.started_at || "").localeCompare(String(b.started_at || ""))
        || num(a.request_index) - num(b.request_index)
        || String(a.request_id || "").localeCompare(String(b.request_id || ""))
      ));
    }

    function parseMaybeJson(value) {
      if (value === undefined || value === null || value === "") return null;
      if (typeof value === "object") return value;
      try {
        return JSON.parse(String(value));
      } catch {
        return null;
      }
    }

    function prettyJson(value) {
      if (value === undefined || value === null || value === "") return "";
      const parsed = parseMaybeJson(value);
      return parsed ? JSON.stringify(parsed, null, 2) : String(value);
    }

    function sheetToObjects(rows) {
      if (!rows.length) return [];
      const headers = rows[0].map((cell) => String(cell || "").trim());
      return rows.slice(1)
        .filter((row) => row.some((cell) => cell !== ""))
        .map((row) => {
          const obj = {};
          headers.forEach((header, index) => {
            if (header) obj[header] = row[index] ?? "";
          });
          return obj;
        });
    }

    function unique(items) {
      return [...new Set(items.filter((item) => item !== undefined && item !== null && item !== ""))];
    }

    function num(value) {
      if (value === null || value === undefined || value === "") return 0;
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function isFiniteNumber(value) {
      return value !== "" && value !== null && value !== undefined && Number.isFinite(Number(value));
    }

    function percentChange(before, after) {
      if (!Number.isFinite(before) || !Number.isFinite(after) || Math.abs(before) < 1e-12) return null;
      return (after - before) / Math.abs(before) * 100;
    }

    function formatNumber(value) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "n/a";
      const number = Number(value);
      if (!Number.isFinite(number)) return "n/a";
      if (Math.abs(number) >= 1000) return number.toFixed(2);
      if (Math.abs(number) >= 1) return number.toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
      if (Math.abs(number) >= 0.0001) return number.toFixed(6).replace(/0+$/, "").replace(/\.$/, "");
      return number.toExponential(3);
    }

    function formatPct(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return "n/a";
      return `${formatNumber(value)}%`;
    }

    function signed(text) {
      return String(text).startsWith("-") || text === "0" || text === "0.0" ? text : `+${text}`;
    }

    function signClass(value) {
      const number = Number(value);
      if (number > 0) return "positive";
      if (number < 0) return "negative";
      return "";
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#96;");
    }

    function buildXlsx(sheetMap) {
      const encoder = new TextEncoder();
      const sheetNames = Object.keys(sheetMap);
      const files = new Map();
      files.set("[Content_Types].xml", encoder.encode(buildContentTypes(sheetNames.length)));
      files.set("_rels/.rels", encoder.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`));
      files.set("xl/workbook.xml", encoder.encode(buildWorkbookXml(sheetNames)));
      files.set("xl/_rels/workbook.xml.rels", encoder.encode(buildWorkbookRels(sheetNames.length)));
      files.set("xl/styles.xml", encoder.encode(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <fonts count="1"><font><sz val="11"/><name val="Calibri"/></font></fonts>
  <fills count="1"><fill><patternFill patternType="none"/></fill></fills>
  <borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>
  <cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
  <cellXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/></cellXfs>
  <cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`));
      sheetNames.forEach((name, index) => {
        files.set(`xl/worksheets/sheet${index + 1}.xml`, encoder.encode(buildWorksheetXml(sheetMap[name] || [])));
      });
      return buildZip(files);
    }

    function buildContentTypes(sheetCount) {
      const overrides = [];
      for (let i = 1; i <= sheetCount; i += 1) {
        overrides.push(`<Override PartName="/xl/worksheets/sheet${i}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`);
      }
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
  <Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
  ${overrides.join("\n  ")}
</Types>`;
    }

    function buildWorkbookXml(sheetNames) {
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <sheets>
    ${sheetNames.map((name, index) => `<sheet name="${escapeXmlAttr(safeSheetName(name, index))}" sheetId="${index + 1}" r:id="rId${index + 1}"/>`).join("\n    ")}
  </sheets>
</workbook>`;
    }

    function buildWorkbookRels(sheetCount) {
      const relationships = [];
      for (let i = 1; i <= sheetCount; i += 1) {
        relationships.push(`<Relationship Id="rId${i}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i}.xml"/>`);
      }
      relationships.push(`<Relationship Id="rId${sheetCount + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`);
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  ${relationships.join("\n  ")}
</Relationships>`;
    }

    function buildWorksheetXml(rows) {
      const normalized = rows.map((row) => Array.isArray(row) ? row : []);
      const maxColumns = Math.max(1, ...normalized.map((row) => row.length));
      const lastRef = `${columnLetters(maxColumns - 1)}${Math.max(1, normalized.length)}`;
      const rowXml = normalized.map((row, rowIndex) => {
        const cells = row.map((value, columnIndexValue) => {
          if (value === null || value === undefined || value === "") return "";
          const ref = `${columnLetters(columnIndexValue)}${rowIndex + 1}`;
          return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${escapeXmlText(String(value))}</t></is></c>`;
        }).join("");
        return `<row r="${rowIndex + 1}">${cells}</row>`;
      }).join("");
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
  <dimension ref="A1:${lastRef}"/>
  <sheetData>${rowXml}</sheetData>
</worksheet>`;
    }

    function safeSheetName(name, index) {
      const cleaned = String(name || `sheet${index + 1}`).replace(/[\\/?*[\]:]/g, "_").slice(0, 31);
      return cleaned || `sheet${index + 1}`;
    }

    function escapeXmlText(value) {
      return value
        .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\r/g, "&#13;");
    }

    function escapeXmlAttr(value) {
      return escapeXmlText(value).replace(/"/g, "&quot;");
    }

    function columnLetters(index) {
      let n = index + 1;
      let letters = "";
      while (n > 0) {
        const rem = (n - 1) % 26;
        letters = String.fromCharCode(65 + rem) + letters;
        n = Math.floor((n - 1) / 26);
      }
      return letters;
    }

    function buildZip(files) {
      const encoder = new TextEncoder();
      const chunks = [];
      const central = [];
      let offset = 0;
      const now = new Date();
      const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
      const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

      for (const [name, data] of files.entries()) {
        const nameBytes = encoder.encode(name);
        const crc = crc32(data);
        const local = new ByteWriter();
        local.u32(0x04034b50);
        local.u16(20);
        local.u16(0);
        local.u16(0);
        local.u16(dosTime);
        local.u16(dosDate);
        local.u32(crc);
        local.u32(data.length);
        local.u32(data.length);
        local.u16(nameBytes.length);
        local.u16(0);
        local.bytes(nameBytes);
        local.bytes(data);
        const localBytes = local.toUint8Array();
        chunks.push(localBytes);

        const header = new ByteWriter();
        header.u32(0x02014b50);
        header.u16(20);
        header.u16(20);
        header.u16(0);
        header.u16(0);
        header.u16(dosTime);
        header.u16(dosDate);
        header.u32(crc);
        header.u32(data.length);
        header.u32(data.length);
        header.u16(nameBytes.length);
        header.u16(0);
        header.u16(0);
        header.u16(0);
        header.u16(0);
        header.u32(0);
        header.u32(offset);
        header.bytes(nameBytes);
        central.push(header.toUint8Array());

        offset += localBytes.length;
      }

      const centralOffset = offset;
      const centralSize = central.reduce((sum, item) => sum + item.length, 0);
      const end = new ByteWriter();
      end.u32(0x06054b50);
      end.u16(0);
      end.u16(0);
      end.u16(files.size);
      end.u16(files.size);
      end.u32(centralSize);
      end.u32(centralOffset);
      end.u16(0);
      return concatUint8Arrays([...chunks, ...central, end.toUint8Array()]);
    }

    class ByteWriter {
      constructor() {
        this.parts = [];
        this.length = 0;
      }
      u16(value) {
        const bytes = new Uint8Array(2);
        new DataView(bytes.buffer).setUint16(0, value, true);
        this.bytes(bytes);
      }
      u32(value) {
        const bytes = new Uint8Array(4);
        new DataView(bytes.buffer).setUint32(0, value >>> 0, true);
        this.bytes(bytes);
      }
      bytes(bytes) {
        this.parts.push(bytes);
        this.length += bytes.length;
      }
      toUint8Array() {
        return concatUint8Arrays(this.parts, this.length);
      }
    }

    function concatUint8Arrays(parts, knownLength = null) {
      const total = knownLength ?? parts.reduce((sum, part) => sum + part.length, 0);
      const output = new Uint8Array(total);
      let offset = 0;
      for (const part of parts) {
        output.set(part, offset);
        offset += part.length;
      }
      return output;
    }

    const CRC_TABLE = (() => {
      const table = new Uint32Array(256);
      for (let i = 0; i < 256; i += 1) {
        let c = i;
        for (let k = 0; k < 8; k += 1) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        table[i] = c >>> 0;
      }
      return table;
    })();

    function crc32(bytes) {
      let crc = 0xffffffff;
      for (const byte of bytes) {
        crc = CRC_TABLE[(crc ^ byte) & 0xff] ^ (crc >>> 8);
      }
      return (crc ^ 0xffffffff) >>> 0;
    }

    async function readXlsxWorkbook(arrayBuffer) {
      if (!("DecompressionStream" in window)) {
        throw new Error("当前浏览器不支持 DecompressionStream，无法离线解压 xlsx。请使用 Chromium / Edge / Chrome 打开。");
      }
      const zip = await readZipEntries(arrayBuffer);
      const workbookXml = getZipText(zip, "xl/workbook.xml");
      const workbookRels = parseRelationships(getZipText(zip, "xl/_rels/workbook.xml.rels"));
      const sharedStrings = zip.has("xl/sharedStrings.xml") ? parseSharedStrings(getZipText(zip, "xl/sharedStrings.xml")) : [];
      const workbookDoc = parseXml(workbookXml);
      const sheets = {};
      for (const sheet of workbookDoc.querySelectorAll("sheets sheet")) {
        const name = sheet.getAttribute("name");
        const relId = sheet.getAttribute("r:id") || sheet.getAttribute("id");
        const target = workbookRels.get(relId);
        if (!name || !target) continue;
        const path = normalizeXlsxPath("xl", target);
        if (!zip.has(path)) continue;
        sheets[name] = parseWorksheet(getZipText(zip, path), sharedStrings);
      }
      return { sheets };
    }

    async function readZipEntries(arrayBuffer) {
      const bytes = new Uint8Array(arrayBuffer);
      const view = new DataView(arrayBuffer);
      const eocdOffset = findEndOfCentralDirectory(view);
      const totalEntries = view.getUint16(eocdOffset + 10, true);
      const centralDirOffset = view.getUint32(eocdOffset + 16, true);
      const entries = new Map();
      let offset = centralDirOffset;
      for (let i = 0; i < totalEntries; i += 1) {
        if (view.getUint32(offset, true) !== 0x02014b50) throw new Error("xlsx zip central directory 解析失败");
        const method = view.getUint16(offset + 10, true);
        const compressedSize = view.getUint32(offset + 20, true);
        const fileNameLength = view.getUint16(offset + 28, true);
        const extraLength = view.getUint16(offset + 30, true);
        const commentLength = view.getUint16(offset + 32, true);
        const localHeaderOffset = view.getUint32(offset + 42, true);
        const nameBytes = bytes.slice(offset + 46, offset + 46 + fileNameLength);
        const name = new TextDecoder().decode(nameBytes).replace(/\\/g, "/");
        const data = await readZipEntryData(view, bytes, localHeaderOffset, compressedSize, method);
        entries.set(name, data);
        offset += 46 + fileNameLength + extraLength + commentLength;
      }
      return entries;
    }

    function findEndOfCentralDirectory(view) {
      for (let offset = view.byteLength - 22; offset >= 0; offset -= 1) {
        if (view.getUint32(offset, true) === 0x06054b50) return offset;
      }
      throw new Error("未找到 xlsx zip 目录");
    }

    async function readZipEntryData(view, bytes, localHeaderOffset, compressedSize, method) {
      if (view.getUint32(localHeaderOffset, true) !== 0x04034b50) throw new Error("xlsx zip local header 解析失败");
      const fileNameLength = view.getUint16(localHeaderOffset + 26, true);
      const extraLength = view.getUint16(localHeaderOffset + 28, true);
      const dataStart = localHeaderOffset + 30 + fileNameLength + extraLength;
      const compressed = bytes.slice(dataStart, dataStart + compressedSize);
      if (method === 0) return compressed;
      if (method !== 8) throw new Error(`不支持的 xlsx 压缩方式: ${method}`);
      return inflateRaw(compressed);
    }

    async function inflateRaw(bytes) {
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    function getZipText(zip, path) {
      const data = zip.get(path);
      if (!data) throw new Error(`xlsx 缺少文件: ${path}`);
      return new TextDecoder("utf-8").decode(data);
    }

    function parseXml(text) {
      const doc = new DOMParser().parseFromString(text, "application/xml");
      const parserError = doc.querySelector("parsererror");
      if (parserError) throw new Error("XML 解析失败");
      return doc;
    }

    function parseRelationships(text) {
      const doc = parseXml(text);
      const map = new Map();
      for (const rel of doc.querySelectorAll("Relationship")) {
        map.set(rel.getAttribute("Id"), rel.getAttribute("Target"));
      }
      return map;
    }

    function normalizeXlsxPath(base, target) {
      if (target.startsWith("/")) return target.slice(1);
      const parts = `${base}/${target}`.split("/");
      const normalized = [];
      for (const part of parts) {
        if (!part || part === ".") continue;
        if (part === "..") normalized.pop();
        else normalized.push(part);
      }
      return normalized.join("/");
    }

    function parseSharedStrings(text) {
      const doc = parseXml(text);
      return [...doc.querySelectorAll("si")].map((si) => collectText(si));
    }

    function collectText(node) {
      let text = "";
      for (const child of node.childNodes) {
        if (child.nodeType === Node.TEXT_NODE) text += child.nodeValue;
        else text += collectText(child);
      }
      return text;
    }

    function parseWorksheet(text, sharedStrings) {
      const doc = parseXml(text);
      const rows = [];
      for (const row of doc.querySelectorAll("sheetData row")) {
        const cells = [];
        for (const cell of row.querySelectorAll("c")) {
          const ref = cell.getAttribute("r") || "";
          const colIndex = columnIndex(ref.replace(/[0-9]/g, ""));
          cells[colIndex] = parseCell(cell, sharedStrings);
        }
        rows.push(fillSparseRow(cells));
      }
      return rows;
    }

    function parseCell(cell, sharedStrings) {
      const type = cell.getAttribute("t");
      if (type === "inlineStr") {
        const inline = cell.querySelector("is");
        return inline ? collectText(inline) : "";
      }
      const value = cell.querySelector("v")?.textContent ?? "";
      if (type === "s") return sharedStrings[Number(value)] ?? "";
      if (type === "b") return value === "1" ? "true" : "false";
      return value;
    }

    function columnIndex(columnLetters) {
      let index = 0;
      for (const char of columnLetters) {
        index = index * 26 + (char.charCodeAt(0) - 64);
      }
      return Math.max(0, index - 1);
    }

    function fillSparseRow(row) {
      const length = row.length;
      const filled = [];
      for (let i = 0; i < length; i += 1) filled.push(row[i] ?? "");
      return filled;
    }

    window.AgentTraceViewer = {
      readJsonlTrace,
      readXlsxWorkbook,
      sheetToObjects,
      buildTaskModels
    };
  </script>
</body>
